<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>實驗紀錄資料庫 - 智慧實驗日誌</title>
  <style>
    :root {
      --bg-main: #f1f5f9;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      
      --border-color: #e2e8f0;
      --border-focus: #60a5fa;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-main); color: var(--text-primary); }

    .app-container {
      width: 100%; max-width: 680px; margin: 0 auto; min-height: 100vh;
      background: var(--bg-main); display: flex; flex-direction: column; position: relative;
    }

    /* Header */
    .header {
      background: var(--card-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px); box-shadow: var(--shadow-sm);
    }
    .header-title h1 { font-size: 16px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .header-title h1::before { content: ""; display: inline-block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
    
    .header-right { display: flex; align-items: center; gap: 8px; }
    .lang-btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-back {
      background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-secondary);
      border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-back:hover { background: #e2e8f0; }

    .main-content { padding: 16px; flex: 1; overflow-y: auto; }

    .form-control {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); font-size: 13px; background: #fff; color: var(--text-primary); outline: none;
      transition: border-color 0.2s ease;
    }
    .form-control:focus { border-color: var(--border-focus); }

    /* 統計卡片 */
    .stats-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-md); transition: all 0.25s ease;
    }
    .stats-header {
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none;
    }
    .stats-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .toggle-icon { font-size: 12px; color: var(--text-muted); transition: transform 0.2s ease; }
    .toggle-icon.collapsed { transform: rotate(-90deg); }

    .stats-body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; transition: all 0.3s ease; }
    .stats-body.hidden { display: none; }

    .stat-interactive-item { cursor: pointer; transition: all 0.15s ease; }
    .stat-interactive-item:hover { transform: translateY(-1px); filter: brightness(0.97); }

    .tag-btn {
      background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-secondary);
      padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .tag-btn:hover, .tag-btn:active { background: var(--primary-light); color: var(--primary); border-color: var(--border-focus); }

    /* 時間軸列表 */
    .timeline-container { position: relative; padding-left: 20px; margin-top: 12px; }
    .timeline-line { position: absolute; left: 5px; top: 12px; bottom: 8px; width: 2px; background: var(--border-color); }
    .timeline-item { position: relative; margin-bottom: 12px; cursor: pointer; }
    .timeline-node { position: absolute; left: -19px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card-bg); box-shadow: 0 0 0 2px var(--primary); }
    .timeline-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); transition: all 0.2s ease; }
    .timeline-card.reserved-card { background: #f8fafc; border-color: #cbd5e1; }
    .timeline-card:hover { border-color: var(--border-focus); box-shadow: var(--shadow-md); }

    .timeline-date-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .timeline-date-title { font-size: 13px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 140px; }
    .timeline-user-badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; white-space: nowrap; }
    .timeline-status-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    
    .status-badge-lg { display: inline-flex; align-items: center; justify-content: center; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; border: 1px solid transparent; flex-shrink: 0; }
    .upload-status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
    .upload-status-tag.uploaded { background: #dcfce7; color: #15803d; }
    .upload-status-tag.pending { background: #fee2e2; color: #b91c1c; }

    .timeline-info-text { font-size: 13px; margin-top: 6px; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-exp-id { font-size: 10px; font-family: ui-monospace, monospace; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

    .mini-timeline-bar-bg { width: 100%; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; display: flex; margin-top: 6px; }
    .mini-timeline-segment { height: 100%; }

    .empty-state-box {
      text-align: center; padding: 28px 16px; color: var(--text-muted);
      background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: var(--radius-md);
      margin: 8px 0;
    }
    .empty-state-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-top: 4px; }
    .empty-state-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .custom-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 12px;
    }
    .custom-modal {
      background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 440px;
      padding: 18px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); max-height: 88vh; display: flex; flex-direction: column;
      transition: max-width 0.25s ease;
    }
    .custom-modal.expanded-mode {
      max-width: 720px;
    }

    .custom-modal h3 { margin-bottom: 10px; font-size: 15px; font-weight: 700; color: var(--text-primary); text-align: center; flex-shrink: 0; }
    .detail-list { text-align: left; overflow-y: auto; max-height: 68vh; font-size: 12px; padding-right: 4px; flex: 1; -webkit-overflow-scrolling: touch; }
    .detail-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--border-color); gap: 8px; }
    .detail-row:last-child { border-bottom: none; margin-bottom: 0; }
    .detail-label { font-weight: 700; color: var(--text-muted); font-size: 11px; width: 40%; flex-shrink: 0; word-break: break-word; }
    .detail-value { font-weight: 600; color: var(--text-primary); width: 60%; text-align: right; word-break: break-word; overflow-wrap: break-word; }
    
    .detail-value.condition-highlight { color: var(--primary) !important; font-weight: 700; }
    .detail-value.normal-value { color: var(--text-primary); font-weight: 600; }
    .detail-value.muted-value { color: var(--text-muted); font-weight: 500; }

    .modal-btn-area { margin-top: 12px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .modal-btn-confirm { background: var(--primary); color: #fff; border: none; padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 600; width: 100%; cursor: pointer; font-size: 13px; }
    .modal-btn-expand { background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-focus); padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 700; width: 100%; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .modal-btn-expand:hover { background: #dbeafe; }

    .expanded-grid {
      display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 8px;
    }
    @media (min-width: 600px) {
      .expanded-grid { grid-template-columns: 1fr 1fr; }
      .expanded-grid .full-width { grid-column: span 2; }
    }

    .exp-panel {
      background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px 12px;
    }
    .exp-panel-title {
      font-size: 12px; font-weight: 800; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color); padding-bottom: 4px; letter-spacing: 0.3px;
    }

    .timeline-bar-wrapper { margin-top: 6px; margin-bottom: 6px; }
    .timeline-multi-bar { display: flex; width: 100%; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #cbd5e1; background: #e2e8f0; }
    .timeline-segment { height: 100%; transition: width 0.3s ease; }
    .timeline-legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 10px; margin-top: 6px; font-weight: 600; }
    .legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

    .vertical-time-log { position: relative; padding-left: 14px; margin-top: 4px; }
    .vertical-time-line { position: absolute; left: 3px; top: 6px; bottom: 6px; width: 2px; background: var(--border-color); }
    .vertical-time-item { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 5px; }
    .vertical-time-item:last-child { margin-bottom: 0; }
    .vertical-time-dot { position: absolute; left: -14px; top: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card-bg); box-shadow: 0 0 0 1px var(--primary); }

    /* 展開版拖曳上傳 Zone 樣式 */
    .drop-zone {
      border: 2px dashed var(--border-focus);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      background: #f0f9ff;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
    }
    .drop-zone.dragover { background: #dbeafe; border-color: var(--primary); }
    .drop-zone-text { font-size: 11px; color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="header-title">
      <h1 id="txtDbTitle">實驗紀錄資料庫</h1>
    </div>
    <div class="header-right">
      <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
      <a href="index.html" class="btn-back" id="txtBtnBack">返回主頁</a>
    </div>
  </div>

  <div class="main-content">
    <div class="stats-card">
      <div class="stats-header" onclick="toggleStatsCard()">
        <div class="stats-title" id="txtStatsTitle">會員專案與題目個案統計</div>
        <div id="statsToggleIcon" class="toggle-icon">▼</div>
      </div>
      <div id="statsContent" class="stats-body">
        <div style="color:var(--text-muted);" id="txtLoadingStats">載入統計數據中...</div>
      </div>
    </div>

    <div style="margin-bottom:16px;">
      <input type="text" id="txtRecordSearch" class="form-control" placeholder="搜尋負責人、大綱、狀態、編號..." oninput="filterRecordCenterList()" style="margin-bottom:10px;">
      <div style="font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:8px;" id="txtQuickSearchTitle">快速點擊搜尋：</div>
      <div id="quickSearchTags" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
    </div>

    <div id="recordCenterList" class="timeline-container">
      <div class="timeline-line"></div>
      <div style="padding:10px; color:var(--text-muted); font-size:12px;" id="txtSyncing">同步試算表資料中...</div>
    </div>
  </div>
</div>

<div id="customModalBackdrop" class="custom-modal-backdrop">
  <div class="custom-modal" id="modalDialogBox">
    <h3 id="modalTitle">實驗詳細資訊</h3>
    <div id="modalMessage"></div>
    <div id="modalBtnArea" class="modal-btn-area">
      <button class="modal-btn-confirm" onclick="closeCustomModal()">關閉</button>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwvsd4fRN4qgWBL2ku7E_r-DekIiVtikpvjyVLRqOiGWPPb1sts3Mj10bMiX9n_zoO1tw/exec";
  const URL_MEMBERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=280963157&single=true&output=csv";
  const URL_FORMS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=0&single=true&output=csv";
  const URL_DATA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=301837161&single=true&output=csv";

  const STATUS_STYLES = {
    "已預約": { bg: "#f1f5f9", text: "#64748b", border: "#cbd5e1" },        
    "準備中": { bg: "#f0f9ff", text: "#0284c7", border: "#bae6fd" },        
    "準備完成": { bg: "#ecfdf5", text: "#059669", border: "#a7f3d0" },      
    "手術中": { bg: "#fef2f2", text: "#dc2626", border: "#fca5a5" },        
    "休息中": { bg: "#f0fdf4", text: "#10b981", border: "#86efac" },        
    "已死亡": { bg: "#0f172a", text: "#ffffff", border: "#0f172a" },        
    "訊號蒐集中": { bg: "#fffbeb", text: "#d97706", border: "#fde68a" },    
    "訊號蒐集完成": { bg: "#fefce8", text: "#ca8a04", border: "#fef08a" },
    "犧牲中": { bg: "#f3e8ff", text: "#7c3aed", border: "#d8b4fe" },        
    "實驗善後": { bg: "#faf5ff", text: "#a855f7", border: "#e9d5ff" },      
    "實驗完成": { bg: "#334155", text: "#ffffff", border: "#334155" },      
    "已完成": { bg: "#334155", text: "#ffffff", border: "#334155" },      
    "其他": { bg: "#f1f5f9", text: "#64748b", border: "#cbd5e1" }
  };

  const STATUS_TRANS = {
    "已預約": { ZH: "已預約", EN: "Reserved" },
    "準備中": { ZH: "準備中", EN: "Preparing" },
    "準備完成": { ZH: "準備完成", EN: "Prepared" },
    "手術中": { ZH: "手術中", EN: "Surgery" },
    "休息中": { ZH: "休息中", EN: "In Break" },
    "已死亡": { ZH: "已死亡", EN: "Deceased" },
    "訊號蒐集中": { ZH: "訊號蒐集中", EN: "Recording" },
    "訊號蒐集完成": { ZH: "訊號蒐集完成", EN: "Signal Done" },
    "犧牲中": { ZH: "犧牲中", EN: "Sacrificing" },
    "實驗善後": { ZH: "實驗善後", EN: "Cleaning" },
    "已完成": { ZH: "已完成", EN: "Completed" },
    "實驗完成": { ZH: "實驗完成", EN: "Completed" }
  };

  let state = {
    currentLang: "ZH",
    membersList: [],
    dataCenter: [],
    dynamicForms: {},
    isStatsCollapsed: false,
    activeViewingExpId: null
  };

  window.addEventListener('DOMContentLoaded', async () => {
    const savedUser = localStorage.getItem('elabnote_user');
    if (savedUser) {
      try {
        const usrObj = JSON.parse(savedUser);
        if (usrObj.lang) state.currentLang = usrObj.lang;
      } catch(e) {}
    }

    applyLanguage();
    await fetchMembersFromSheet();
    await fetchAndParseFormsFromSheet();
    await fetchDataCenterFromSheet();
    
    renderRecordCenterStats();
    renderQuickSearchTags();
    filterRecordCenterList();
  });

  function toggleLanguage() {
    state.currentLang = state.currentLang === "ZH" ? "EN" : "ZH";
    applyLanguage();
    renderRecordCenterStats();
    renderQuickSearchTags();
    filterRecordCenterList();
  }

  function applyLanguage() {
    const isZH = state.currentLang === 'ZH';
    document.getElementById('langToggleBtn').innerText = isZH ? "ZN" : "EN";
    document.getElementById('txtDbTitle').innerText = isZH ? "實驗紀錄資料庫" : "Experiment Database";
    document.getElementById('txtBtnBack').innerText = isZH ? "返回主頁" : "Back to Home";
    document.getElementById('txtStatsTitle').innerText = isZH ? "會員專案與題目個案統計" : "Member Projects & Cases Statistics";
    document.getElementById('txtQuickSearchTitle').innerText = isZH ? "快速點擊搜尋：" : "Quick Filter Tags:";
    document.getElementById('txtRecordSearch').placeholder = isZH ? "搜尋負責人、大綱、狀態、編號..." : "Search owner, outline, status, ID...";
    
    const loadingElem = document.getElementById('txtLoadingStats');
    if (loadingElem) loadingElem.innerText = isZH ? "載入統計數據中..." : "Loading statistics...";
    
    const syncingElem = document.getElementById('txtSyncing');
    if (syncingElem) syncingElem.innerText = isZH ? "同步試算表資料中..." : "Syncing spreadsheet data...";
  }

  function toggleStatsCard() {
    state.isStatsCollapsed = !state.isStatsCollapsed;
    const statsBody = document.getElementById('statsContent');
    const toggleIcon = document.getElementById('statsToggleIcon');
    
    if (state.isStatsCollapsed) {
      statsBody.classList.add('hidden');
      toggleIcon.classList.add('collapsed');
    } else {
      statsBody.classList.remove('hidden');
      toggleIcon.classList.remove('collapsed');
    }
  }

  function getStatusStyle(statusStr) {
    if (!statusStr) return STATUS_STYLES["其他"];
    const key = Object.keys(STATUS_STYLES).find(k => statusStr.includes(k));
    return key ? STATUS_STYLES[key] : STATUS_STYLES["其他"];
  }

  function parseSingleBilingualStr(str, lang) {
    if (!str) return '';
    if (!str.includes('/')) return str.trim();
    const parts = str.split('/');
    return lang === 'EN' ? (parts[1] || parts[0]).trim() : parts[0].trim();
  }

  function cleanDisplayLabel(text) {
    if (typeof text !== 'string') text = String(text || ''); 
    return text
      .replace(/\[submit\]/gi, '')
      .replace(/\[fetch_detail:[^\]]+\]/gi, '')
      .replace(/\[status:[^\]]+\]/gi, '')
      .replace(/\[info\]/gi, '')
      .replace(/\[warning\]/gi, '')
      .replace(/\[formula:[^\]]+\]/gi, '')
      .replace(/\[unit:[^\]]+\]/gi, '')
      .replace(/\[placeholder:[^\]]+\]/gi, '')
      .replace(/\[default:[^\]]+\]/gi, '')
      .trim();
  }

  function formatBilingualText(fullInfoStr, lang) {
    if (!fullInfoStr) return '';
    const cleaned = cleanDisplayLabel(fullInfoStr);
    if (cleaned.includes(' - ')) {
      const parts = cleaned.split(' - ');
      const outlineFormatted = parseSingleBilingualStr(parts[0], lang);
      const purposeFormatted = parseSingleBilingualStr(parts[1], lang);
      return `${outlineFormatted} - ${purposeFormatted}`;
    }
    return parseSingleBilingualStr(cleaned, lang);
  }

  function getStatusText(statusRaw, lang) {
    if (STATUS_TRANS[statusRaw]) {
      return STATUS_TRANS[statusRaw][lang] || statusRaw;
    }
    return parseSingleBilingualStr(statusRaw, lang);
  }

  function parseCSV(text) {
    const result = [];
    let row = [];
    let entry = '';
    let insideQuote = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (insideQuote && nextChar === '"') {
          entry += '"';
          i++;
        } else {
          insideQuote = !insideQuote;
        }
      } else if (char === ',' && !insideQuote) {
        row.push(entry);
        entry = '';
      } else if ((char === '\r' || char === '\n') && !insideQuote) {
        if (char === '\r' && nextChar === '\n') {
          i++;
        }
        row.push(entry);
        entry = '';
        if (row.some(c => c.trim() !== '')) {
          result.push(row);
        }
        row = [];
      } else {
        entry += char;
      }
    }

    if (entry !== '' || row.length > 0) {
      row.push(entry);
      if (row.some(c => c.trim() !== '')) {
        result.push(row);
      }
    }

    return result;
  }

      const csvText = await res.text();
      const rows = parseCSV(csvText);
      state.membersList = rows.slice(1).map(r => ({ name: r[0]?.trim(), color: r[3]?.trim() || '#f1f5f9' })).filter(m => m.name);

  async function fetchAndParseFormsFromSheet() {
    try {
      const res = await fetch(`${URL_FORMS}&_t=${Date.now()}`);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      if (rows.length < 2) return;

      const headerRow = rows[0];
      const formBlocks = [];
      for (let colIdx = 0; colIdx < headerRow.length; colIdx++) {
        const cellVal = (headerRow[colIdx] || "").trim();
        if (cellVal.startsWith("FORM_")) formBlocks.push({ formId: cellVal, startCol: colIdx });
      }

      const parsedForms = {};
      formBlocks.forEach(block => {
        const pages = [];
        let currentPage = null;
        for (let r = 2; r < rows.length; r++) {
          if (!rows[r]) continue;
          const rawLabel = (rows[r][block.startCol] || "").trim();
          const rawType = (rows[r][block.startCol + 1] || "").trim();
          if (!rawLabel && !rawType) continue;

          if (rawLabel.includes("【") && rawLabel.includes("】")) {
            currentPage = { title: cleanDisplayLabel(rawLabel.replace(/【|】/g, "")), fields: [] };
            pages.push(currentPage);
            continue;
          }
          if (!currentPage) { currentPage = { title: "Page 1", fields: [] }; pages.push(currentPage); }
          
          const fieldId = `field_${r}_${block.startCol}`;
          currentPage.fields.push({ id: fieldId, label: cleanDisplayLabel(rawLabel), type: rawType });
        }
        parsedForms[block.formId] = pages;
      });
      state.dynamicForms = parsedForms;
    } catch (err) { console.error("解析動態表單架構失敗:", err); }
  }

  async function fetchDataCenterFromSheet() {
    try {
      const res = await fetch(`${URL_DATA}&_t=${Date.now()}`);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      const records = [];

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        if (row[0] || row[1]) {
          const expId = row[0] ? row[0].trim() : '未編號';
          const date = row[1] ? row[1].trim() : '';
          const user = row[2] ? row[2].trim() : '';
          const status = row[3] ? row[3].trim() : '未知';
          
          let parsedFormData = {};
          const jsonCols = [4, 6, 8, 10, 12];
          jsonCols.forEach(colIdx => {
            if (row[colIdx]) {
              let rawJsonStr = row[colIdx].trim();
              if (rawJsonStr.startsWith('"') && rawJsonStr.endsWith('"')) rawJsonStr = rawJsonStr.slice(1, -1).replace(/""/g, '"');
              if (rawJsonStr.startsWith('{') && rawJsonStr.endsWith('}')) {
                try { parsedFormData = { ...parsedFormData, ...JSON.parse(rawJsonStr) }; } catch (e) {}
              }
            }
          });

          const outlineName = cleanDisplayLabel(parsedFormData['outline_select_val'] || parsedFormData['field_4_4'] || parsedFormData['field_5_0'] || '');
          
          let rawPurpose = parsedFormData['selected_purpose_name'];
          if (!rawPurpose || rawPurpose === '不保存' || rawPurpose === '過麻') {
            rawPurpose = parsedFormData['field_8_0'] || parsedFormData['field_13_0'] || parsedFormData['field_7_4'] || '';
          }
          
          let purposeName = cleanDisplayLabel(rawPurpose);
          
          let dynamicInfo = "";
          if (outlineName && purposeName) {
            dynamicInfo = `${outlineName} - ${purposeName}`;
          } else if (outlineName || purposeName) {
            dynamicInfo = outlineName || purposeName;
          } else {
            dynamicInfo = "實驗專案";
          }

          let expDataFolder = "";
          for (let c = 0; c < row.length; c++) {
            const cellVal = String(row[c] || "").trim();
            if (cellVal.includes("drive.google.com")) {
              expDataFolder = cellVal;
              break;
            }
          }
          
          if (!expDataFolder && row.length > 22) {
            expDataFolder = String(row[22] || "").trim();
          }

          const isFolderValid = expDataFolder.startsWith("http");

          records.push({
            expId, date, user, status, info: dynamicInfo, formData: parsedFormData, expDataFolder,
            hasDataUpload: isFolderValid
          });
        }
      }
      state.dataCenter = records;
    } catch (csvErr) { console.error("解析 CSV 失敗:", csvErr); }
  }

  function calculateProcessTimeline(timeLogs) {
    const isZH = state.currentLang === 'ZH';
    const segments = [];
    let totalMins = 0;

    const getTime = (key) => {
      if (!timeLogs || !timeLogs[key]) return null;
      const d = new Date(timeLogs[key]);
      return isNaN(d.getTime()) ? null : d;
    };

    const tSurgeryStart = getTime('手術中');
    const tBreakStart = getTime('休息中');
    const tSignalStart = getTime('訊號蒐集中');
    const tSignalEnd = getTime('訊號蒐集完成');
    const tSacrificeStart = getTime('犧牲中');
    const tCleanupEnd = getTime('實驗善後') || getTime('已完成') || getTime('實驗完成');

    if (tSurgeryStart && (tBreakStart || tSignalStart)) {
      const end = tBreakStart || tSignalStart;
      const diff = Math.max(0, Math.floor((end - tSurgeryStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '手術耗時' : 'Surgery', mins: diff, color: '#ef4444' }); totalMins += diff; }
    }

    if (tBreakStart && tSignalStart) {
      const diff = Math.max(0, Math.floor((tSignalStart - tBreakStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '休息間隔' : 'Rest Interval', mins: diff, color: '#10b981' }); totalMins += diff; }
    }

    if (tSignalStart && tSignalEnd) {
      const diff = Math.max(0, Math.floor((tSignalEnd - tSignalStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '訊號蒐集耗時' : 'Signal Duration', mins: diff, color: '#f59e0b' }); totalMins += diff; }
    }

    if (tSacrificeStart && tCleanupEnd) {
      const diff = Math.max(0, Math.floor((tCleanupEnd - tSacrificeStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '犧牲耗時' : 'Sacrifice', mins: diff, color: '#8b5cf6' }); totalMins += diff; }
    }

    if (totalMins === 0 || segments.length === 0) {
      return {
        totalMins: 0,
        barHtml: `<div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${isZH?'尚無完整階段時間歷程':'No process timeline data available'}</div>`,
        miniBarHtml: ''
      };
    }

    const BASE_MAX_MINS = 720;
    const isExceeded = totalMins > BASE_MAX_MINS;

    let barSegsHtml = '';
    let miniSegsHtml = '';
    let legendHtml = '';

    segments.forEach(seg => {
      const pct = isExceeded ? ((seg.mins / totalMins) * 100).toFixed(1) : ((seg.mins / BASE_MAX_MINS) * 100).toFixed(1);
      barSegsHtml += `<div class="timeline-segment" style="width:${pct}%; background:${seg.color};" title="${seg.name}: ${seg.mins} min"></div>`;
      miniSegsHtml += `<div class="mini-timeline-segment" style="width:${pct}%; background:${seg.color};"></div>`;
      legendHtml += `
        <span class="legend-item">
          <span class="legend-dot" style="background:${seg.color};"></span>
          ${seg.name}: ${seg.mins}${isZH?'分':'m'}
        </span>
      `;
    });

    const barHtml = `
      <div class="timeline-bar-wrapper">
        <div class="timeline-multi-bar">${barSegsHtml}</div>
        <div class="timeline-legend">${legendHtml}</div>
      </div>
    `;

    const miniBarHtml = `<div class="mini-timeline-bar-bg">${miniSegsHtml}</div>`;

    return { totalMins, barHtml, miniBarHtml };
  }

  function filterRecordCenterList() {
    const kw = document.getElementById('txtRecordSearch').value.trim().toLowerCase();
    const container = document.getElementById('recordCenterList');
    let html = `<div class="timeline-line"></div>`;

    const filtered = state.dataCenter.filter(d => {
      if (!kw) return true;
      
      const displayStatus = getStatusText(d.status, state.currentLang).toLowerCase();
      const displayInfo = formatBilingualText(d.info, state.currentLang).toLowerCase();

      const isCompleted = d.status === '已完成' || d.status === '實驗完成' || d.status === '實驗結束' || d.status === 'Completed';
      const uploadText = isCompleted 
        ? (d.hasDataUpload ? (state.currentLang==='ZH'?'已上傳':'uploaded') : (state.currentLang==='ZH'?'待上傳':'pending'))
        : '';

      const basicMatch = (d.expId||'').toLowerCase().includes(kw) || 
                         (d.user||'').toLowerCase().includes(kw) || 
                         displayStatus.includes(kw) || (d.status||'').toLowerCase().includes(kw) ||
                         displayInfo.includes(kw) || (d.date||'').toLowerCase().includes(kw) ||
                         uploadText.includes(kw);
                         
      if (basicMatch) return true;

      if (d.formData && typeof d.formData === 'object') {
        const formDataString = JSON.stringify(d.formData).toLowerCase();
        if (formDataString.includes(kw)) return true;
      }

      return false;
    }).sort((a,b) => new Date(b.date) - new Date(a.date));

    if (filtered.length === 0) {
      container.innerHTML = html + renderEmptyState(state.currentLang==='ZH'?'無符合條件的實驗紀錄':'No matching records', '');

        ? `<span style="font-size:10px; color:var(--text-muted); font-weight:600;">(${state.currentLang==='ZH'?'總耗時':'Total'}: ${timeLogCalculations.totalMins}${state.currentLang==='ZH'?'分':'m'})</span>`

            <div class="timeline-date-head">

                <span>${item.date}</span>

                ${timeTotalText}

                <span class="status-badge-lg" style="background:${styleObj.bg}; color:${styleObj.text}; border-color:${styleObj.border};">${displayStatus}</span>
                ${uploadTagHtml}
              </div>

    });

  function getDynamicFieldValue(formData, labelKeywords) {
    if (!state.dynamicForms || !formData) return { val: null, id: null };
    const kwArr = Array.isArray(labelKeywords) ? labelKeywords : [labelKeywords];
    for (const formId in state.dynamicForms) {
      const pages = state.dynamicForms[formId];
      if (!Array.isArray(pages)) continue;
      for (const p of pages) {
        if (!p.fields || !Array.isArray(p.fields)) continue;
        for (const f of p.fields) {
          if (f.label) {
            const cleanLabel = f.label.toLowerCase();
            const isMatch = kwArr.some(kw => cleanLabel.includes(kw.toLowerCase()));
            if (isMatch && formData[f.id] !== undefined) return { val: formData[f.id], id: f.id };
          }
        }
      }
    }
    return { val: null, id: null };
  }

  let isEditingActiveModal = false;

  function getConditionClass(text) {
    if (!text) return 'normal-value';
    const clean = String(text).trim();
    if (['無特殊情況', '無', '不保存', 'None', '--', '正常'].includes(clean)) {
      return 'normal-value';
    }
    return 'condition-highlight';
  }

    const defaultKeys = ['已預約', '準備中', '準備完成', '手術中', '休息中', '訊號蒐集中', '訊號蒐集完成', '犧牲中', '實驗善後'];

        </div>
      `;
    }).join('');

    let surgeryDurationHtml = '';
    if (timeLogsMap['手術中'] && (timeLogsMap['休息中'] || timeLogsMap['已死亡'])) {
      const start = new Date(timeLogsMap['手術中']);
      const end = new Date(timeLogsMap['休息中'] || timeLogsMap['已死亡']);
      const diffMs = end - start;
      if (!isNaN(diffMs) && diffMs > 0) {
        const diffMins = Math.floor(diffMs / 60000);
        surgeryDurationHtml = `
          <div class="detail-row">
            <div class="detail-label" style="color:var(--danger);">${isZH ? '手術用時' : 'Surgery Duration'}</div>
            <div class="detail-value" style="font-weight:700; color:var(--danger);">${diffMins} ${isZH ? '分鐘' : 'mins'}</div>
          </div>
        `;
      }
    }

    let filledDataSectionHtml = '';

    if (!isReserved) {
      const freqVal = formData['freq'] !== undefined ? formData['freq'] : (formData['field_19_0'] !== undefined ? formData['field_19_0'] : '3.5');
      const cycleVal = formData['cycle'] !== undefined ? formData['cycle'] : (formData['field_20_0'] !== undefined ? formData['field_20_0'] : '2000');
      const voltVal = formData['volt'] !== undefined ? formData['volt'] : (formData['field_21_0'] !== undefined ? formData['field_21_0'] : '239');
      const interVal = formData['inter'] !== undefined ? formData['inter'] : (formData['field_22_0'] !== undefined ? formData['field_22_0'] : '25');

      const ratWeight = parseFloat(formData['rat_weight'] || formData['field_5_16'] || formData['field_3_16'] || 0);
      const ptzDose = parseFloat(formData['field_4_16'] || 1.0);
      
      const calculatedPTZ = ratWeight > 0 ? (ratWeight * ptzDose).toFixed(1) : '--';
      const calculatedSaline = ratWeight > 0 ? Math.max(0, 700 - (ratWeight * ptzDose)).toFixed(1) : '--';

      const lamdaAP = formData['field_13_16'] !== undefined ? formData['field_13_16'] : (formData['field_9_16'] || '0');
      const lamdaML = formData['field_12_16'] !== undefined ? formData['field_12_16'] : (formData['field_10_16'] || '0');

      const eleAP = formData['field_15_16'] !== undefined ? formData['field_15_16'] : (formData['field_20_16'] || '0');
      const eleML = formData['field_16_16'] !== undefined ? formData['field_16_16'] : (formData['field_19_16'] || '0');
      const eleDH = formData['field_17_16'] !== undefined ? formData['field_17_16'] : (formData['field_21_16'] || '0');

      // 🚀 動態解析器強化版 (包含獨立備註文字自動加引號 ( ... ) 串接)
      const extractSmartValue = (kwArr, fallbackKeys = [], noteKeys = [], defaultText = '--') => {
        let raw = null;
        let inputVal = "";

        const isValidVal = (val) => {
          if (val === null || val === undefined || val === false || val === true) return false;
          const str = String(val).trim().toLowerCase();
          return str !== '' && str !== 'false' && str !== 'true' && str !== 'on' && str !== 'off' && str !== 'null' && str !== 'undefined';
        };

        const fieldObj = getDynamicFieldValue(formData, kwArr);
        if (fieldObj && isValidVal(fieldObj.val)) {
          raw = fieldObj.val;
          inputVal = formData[`${fieldObj.id}_input`] || "";
        }

        if (!isValidVal(raw) && fallbackKeys.length > 0) {
          for (const fbKey of fallbackKeys) {
            if (isValidVal(formData[fbKey])) {
              raw = formData[fbKey];
              inputVal = formData[`${fbKey}_input`] || "";
              break;
            }
          }
        }

        if (!isValidVal(raw)) return defaultText;

        let resStr = "";
        if (Array.isArray(raw)) {
          const filteredArr = raw.filter(v => isValidVal(v));
          if (filteredArr.length === 0) return defaultText;
          resStr = filteredArr.map(v => typeof v === 'object' ? JSON.stringify(v) : formatBilingualText(String(v), state.currentLang)).join(', ');
        } else if (typeof raw === 'object') {
          resStr = JSON.stringify(raw);
        } else {
          resStr = formatBilingualText(String(raw), state.currentLang);
        }

        let addedNotes = [];
        if (inputVal && isValidVal(inputVal)) {
          addedNotes.push(formatBilingualText(String(inputVal), state.currentLang));
        }

        if (Array.isArray(noteKeys)) {
          noteKeys.forEach(nk => {
            if (isValidVal(formData[nk])) {
              addedNotes.push(formatBilingualText(String(formData[nk]), state.currentLang));
            }
          });
        }

        if (addedNotes.length > 0) {
          resStr += ` (${addedNotes.join(' / ')})`;
        }

        return resStr || defaultText;
      };

  function toggleEditMode(expId) {
    const isZH = state.currentLang === 'ZH';
    const exp = state.dataCenter.find(d => d.expId === expId);
    if (!exp) return;

    const btnEdit = document.getElementById('btnToggleEdit');

    if (!isEditingActiveModal) {
      isEditingActiveModal = true;
      if (btnEdit) {
        btnEdit.innerText = isZH ? "儲存修改" : "Save Changes";
        btnEdit.style.background = "var(--success)";
        btnEdit.style.color = "#fff";
        btnEdit.style.borderColor = "var(--success)";
      }

      const viewTexts = document.querySelectorAll('.view-mode-text');
      const editInputs = document.querySelectorAll('.edit-mode-input');
      
      viewTexts.forEach(el => el.style.display = 'none');
      editInputs.forEach(el => {
        if (el.tagName === 'DIV') el.style.display = 'flex';
        else el.style.display = 'inline-block';
      });

      const appendContainer = document.getElementById('appendNoteContainer');
      if (appendContainer) appendContainer.style.display = 'block';

    } else {
      saveActiveExpEdit(expId);
    }
  }

  async function saveActiveExpEdit(expId) {
    const isZH = state.currentLang === 'ZH';
    const exp = state.dataCenter.find(d => d.expId === expId);
    if (!exp) return;

    if (!exp.formData) exp.formData = {};

    let safePurposeName = exp.formData['selected_purpose_name'];
    if (!safePurposeName || safePurposeName === '不保存') {
      safePurposeName = exp.formData['field_7_4'] || exp.formData['field_8_0'] || '健康控制組 / Healthy control group';
    }

    const timeLogInputs = document.querySelectorAll('.time-log-input');
    if (!exp.formData['_time_logs']) exp.formData['_time_logs'] = {};
    
    timeLogInputs.forEach(input => {
      const key = input.getAttribute('data-time-key');
      if (key) {
        exp.formData['_time_logs'][key] = input.value.trim();
      }
    });

    if (document.getElementById('edit_freq')) {
      const val = document.getElementById('edit_freq').value;
      exp.formData['freq'] = val;
      exp.formData['field_19_0'] = val;
    }
    if (document.getElementById('edit_cycle')) {
      const val = document.getElementById('edit_cycle').value;
      exp.formData['cycle'] = val;
      exp.formData['field_20_0'] = val;
    }
    if (document.getElementById('edit_volt')) {
      const val = document.getElementById('edit_volt').value;
      exp.formData['volt'] = val;
      exp.formData['field_21_0'] = val;
    }
    if (document.getElementById('edit_inter')) {
      const val = document.getElementById('edit_inter').value;
      exp.formData['inter'] = val;
      exp.formData['field_22_0'] = val;
    }
    if (document.getElementById('edit_weight')) {
      const val = document.getElementById('edit_weight').value;
      exp.formData['rat_weight'] = val;
      exp.formData['field_5_16'] = val;
      exp.formData['field_3_16'] = val;
    }

    if (document.getElementById('edit_lamdaAP')) {
      const val = document.getElementById('edit_lamdaAP').value;
      exp.formData['lamda_ap'] = val;
      exp.formData['field_13_16'] = val;
      exp.formData['field_20_16'] = val;
    }
    if (document.getElementById('edit_lamdaML')) {
      const val = document.getElementById('edit_lamdaML').value;
      exp.formData['lamda_ml'] = val;
      exp.formData['field_12_16'] = val;
      exp.formData['field_19_16'] = val;
    }

    if (document.getElementById('edit_eleAP')) {
      const val = document.getElementById('edit_eleAP').value;
      exp.formData['ele_ap'] = val;
      exp.formData['field_15_16'] = val;
    }
    if (document.getElementById('edit_eleML')) {
      const val = document.getElementById('edit_eleML').value;
      exp.formData['ele_ml'] = val;
      exp.formData['field_16_16'] = val;
    }
    if (document.getElementById('edit_eleDH')) {
      const val = document.getElementById('edit_eleDH').value;
      exp.formData['ele_dh'] = val;
      exp.formData['field_17_16'] = val;
    }

    if (document.getElementById('edit_rat_status')) exp.formData['rat_status'] = document.getElementById('edit_rat_status').value;
    if (document.getElementById('edit_surgery_status')) exp.formData['surgery_status'] = document.getElementById('edit_surgery_status').value;
    if (document.getElementById('edit_elec_status')) exp.formData['elec_status'] = document.getElementById('edit_elec_status').value;
    if (document.getElementById('edit_signal_status')) exp.formData['signal_status'] = document.getElementById('edit_signal_status').value;
    if (document.getElementById('edit_sac_method')) exp.formData['sac_method'] = document.getElementById('edit_sac_method').value;
    if (document.getElementById('edit_sac_status')) exp.formData['sac_status'] = document.getElementById('edit_sac_status').value;
    if (document.getElementById('edit_tissue')) exp.formData['tissue'] = document.getElementById('edit_tissue').value;
    if (document.getElementById('edit_tissue_status')) exp.formData['tissue_status'] = document.getElementById('edit_tissue_status').value;
    
    if (document.getElementById('edit_storage')) {
      const storageVal = document.getElementById('edit_storage').value;
      exp.formData['storage'] = storageVal;
      exp.formData['field_21_24'] = storageVal;
    }

    exp.formData['selected_purpose_name'] = safePurposeName;

    const oldNotes = exp.formData['notes'] || '';
    const appendInput = document.getElementById('inputAppendNote');
    const appendVal = appendInput ? appendInput.value.trim() : '';

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const timeStampTag = `[${yyyy}/${mm}/${dd} ${hh}:${min} 修改/Modify]`;

    let updatedNotes = oldNotes;
    if (appendVal) {
      updatedNotes = oldNotes ? `${oldNotes}\n${appendVal}\n${timeStampTag}` : `${appendVal}\n${timeStampTag}`;
    } else {
      updatedNotes = oldNotes ? `${oldNotes}\n${timeStampTag}` : timeStampTag;
    }

    exp.formData['notes'] = updatedNotes;

    const targetIndex = state.dataCenter.findIndex(d => d.expId === expId);
    if (targetIndex !== -1) {
      state.dataCenter[targetIndex].formData = JSON.parse(JSON.stringify(exp.formData));
      const outlineStr = exp.formData['outline_select_val'] || 'Vortex gut–brain stimulation';
      state.dataCenter[targetIndex].info = `${outlineStr} - ${safePurposeName}`;
    }

    const btnEdit = document.getElementById('btnToggleEdit');
    if (btnEdit) {
      btnEdit.disabled = true;
      btnEdit.innerText = isZH ? "同步至雲端中..." : "Saving...";
    }

    try {
      const payload = {
        action: "updateRecord",
        expId: expId,
        status: exp.status,
        date: exp.date,
        user: exp.user,
        formJson: JSON.stringify(exp.formData)
      };

      await fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      alert(isZH ? "修改已成功儲存並同步至雲端！" : "Successfully saved!");
    } catch (err) {
      console.error("雲端同步失敗：", err);
      alert(isZH ? "本地已更新，但雲端同步失敗。" : "Failed to sync with cloud.");
    }

    isEditingActiveModal = false;
    if (typeof filterRecordCenterList === 'function') filterRecordCenterList();
    showActiveExpDetail(expId);
  }

  function deleteActiveExp(expId) {
    const isZH = state.currentLang === 'ZH';
    const targetId = expId || state.activeViewingExpId;
    
    showCustomConfirm(isZH ? '確定要刪除這筆實驗紀錄嗎？後端資料庫將會同步抹除且無法復原。' : 'Are you sure to delete this record from database?', function() {
      executeDelete(targetId);
    });
  }

  async function executeDelete(expId) {
    const isZH = state.currentLang === 'ZH';

    try {
      await fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "deleteRecord",
          expId: expId
        })
      });

      state.dataCenter = state.dataCenter.filter(d => d.expId !== expId);
      alert(isZH ? "實驗紀錄已成功從後端資料庫抹除！" : "Record deleted!");
    } catch (err) {
      console.error("刪除失敗：", err);
      alert(isZH ? "刪除請求發送失敗，請重試。" : "Delete action failed.");
    }
    
    closeCustomModal();
    if (typeof filterRecordCenterList === 'function') filterRecordCenterList();
  }

    const formData = exp.formData || {};

    const modalDialog = document.getElementById('modalDialogBox');
    modalDialog.classList.add('expanded-mode');

    const timeLogCalculations = calculateProcessTimeline(formData['_time_logs'] || {});

    let dotLineLogsHtml = '';
    if (formData['_time_logs'] && Object.keys(formData['_time_logs']).length > 0) {
      const logs = formData['_time_logs'];
      const itemsHtml = Object.entries(logs).map(([st, time]) => {
        const transSt = getStatusText(st, state.currentLang);
        return `
          <div class="vertical-time-item">
            <div class="vertical-time-dot"></div>
            <span style="font-weight:700; color:var(--text-secondary);">${transSt}</span>
            <span style="font-family:ui-monospace, monospace; color:var(--text-primary); font-weight:600;">${time}</span>
          </div>
        `;
      }).join('');

      dotLineLogsHtml = `
        <div class="vertical-time-log">
          <div class="vertical-time-line"></div>
          ${itemsHtml}
        </div>
      `;
    } else {
      dotLineLogsHtml = `<div style="font-size:11px; color:var(--text-muted); padding:4px 0;">${isZH ? '尚無詳細歷程時間' : 'No time logs'}</div>`;
    }

    const freqVal = formData['field_19_0'] !== undefined ? formData['field_19_0'] : (formData['freq'] !== undefined ? formData['freq'] : '3.5');
    const cycleVal = formData['field_20_0'] !== undefined ? formData['field_20_0'] : (formData['cycle'] !== undefined ? formData['cycle'] : '2000');
    const voltVal = formData['field_21_0'] !== undefined ? formData['field_21_0'] : (formData['volt'] !== undefined ? formData['volt'] : '239');
    const interVal = formData['field_22_0'] !== undefined ? formData['field_22_0'] : (formData['inter'] !== undefined ? formData['inter'] : '25');

    const ultrasoundPanelHtml = `
      <div class="exp-panel">
        <div class="exp-panel-title">${isZH ? '超音波刺激參數' : 'Ultrasound Parameters'}</div>
        <div class="detail-row"><div class="detail-label">${isZH?'頻率':'Frequency'}</div><div class="detail-value normal-value">${freqVal} HZ</div></div>
        <div class="detail-row"><div class="detail-label">${isZH?'週期數':'Cycles'}</div><div class="detail-value normal-value">${cycleVal} times</div></div>
        <div class="detail-row"><div class="detail-label">${isZH?'電壓':'Voltage'}</div><div class="detail-value normal-value">${voltVal} mV</div></div>
        <div class="detail-row"><div class="detail-label">${isZH?'間隔':'Interval'}</div><div class="detail-value normal-value">${interVal} ms</div></div>
      </div>
    `;

    const ratWeight = parseFloat(formData['field_5_16'] || formData['field_3_16'] || formData['rat_weight'] || 0);
    const ptzDose = parseFloat(formData['field_4_16'] || 1.0);
    const ptzVol = ratWeight > 0 ? (ratWeight * ptzDose).toFixed(1) : '--';
    const salineVol = ratWeight > 0 ? Math.max(0, 700 - ratWeight * ptzDose).toFixed(1) : '--';

    const extractSmartValueEx = (kwArr, fallbackKeys = [], noteKeys = [], defaultText = '--') => {
      let raw = null;
      let inputVal = "";

      const isValidVal = (val) => {
        if (val === null || val === undefined || val === false || val === true) return false;
        const str = String(val).trim().toLowerCase();
        return str !== '' && str !== 'false' && str !== 'true' && str !== 'on' && str !== 'off' && str !== 'null' && str !== 'undefined';
      };

      const fieldObj = getDynamicFieldValue(formData, kwArr);
      if (fieldObj && isValidVal(fieldObj.val)) {
        raw = fieldObj.val;
        inputVal = formData[`${fieldObj.id}_input`] || "";
      }

      if (!isValidVal(raw) && fallbackKeys.length > 0) {
        for (const fbKey of fallbackKeys) {
          if (isValidVal(formData[fbKey])) {
            raw = formData[fbKey];
            inputVal = formData[`${fbKey}_input`] || "";
            break;
          }
        }
      }

      if (!isValidVal(raw)) return defaultText;

      let resStr = "";
      if (Array.isArray(raw)) {
        const filteredArr = raw.filter(v => isValidVal(v));
        if (filteredArr.length === 0) return defaultText;
        resStr = filteredArr.map(v => typeof v === 'object' ? JSON.stringify(v) : formatBilingualText(String(v), state.currentLang)).join(', ');
      } else if (typeof raw === 'object') {
        resStr = JSON.stringify(raw);
      } else {
        resStr = formatBilingualText(String(raw), state.currentLang);
      }

      let addedNotes = [];
      if (inputVal && isValidVal(inputVal)) {
        addedNotes.push(formatBilingualText(String(inputVal), state.currentLang));
      }

      if (Array.isArray(noteKeys)) {
        noteKeys.forEach(nk => {
          if (isValidVal(formData[nk])) {
            addedNotes.push(formatBilingualText(String(formData[nk]), state.currentLang));
          }
        });
      }

      if (addedNotes.length > 0) {
        resStr += ` (${addedNotes.join(' / ')})`;
      }

      return resStr || defaultText;
    };

    const ratStatusText = formData['rat_status'] || extractSmartValueEx(['生理', 'physiological'], ['field_23_16'], ['field_44_16'], isZH ? '無特殊情況' : 'None');

    let surgDurationText = '--';
    if (formData['_time_logs'] && formData['_time_logs']['手術中'] && (formData['_time_logs']['休息中'] || formData['_time_logs']['已死亡'])) {
      const start = new Date(formData['_time_logs']['手術中']);
      const end = new Date(formData['_time_logs']['休息中'] || formData['_time_logs']['已死亡']);
      const diffMs = end - start;
      if (!isNaN(diffMs) && diffMs > 0) surgDurationText = `${Math.floor(diffMs / 60000)} ${isZH ? '分鐘' : 'mins'}`;
    }
    const surgeryStatusText = formData['surgery_status'] || extractSmartValueEx(['手術', 'surgical'], ['field_31_16'], ['field_47_16'], isZH ? '無特殊情況' : 'None');

    const lamdaAP = formData['field_13_16'] !== undefined ? formData['field_13_16'] : (formData['field_9_16'] || '0');
    const lamdaML = formData['field_12_16'] !== undefined ? formData['field_12_16'] : (formData['field_10_16'] || '0');
    const eleAP = formData['field_15_16'] !== undefined ? formData['field_15_16'] : (formData['field_20_16'] || '0');
    const eleML = formData['field_16_16'] !== undefined ? formData['field_16_16'] : (formData['field_19_16'] || '0');
    const eleDH = formData['field_17_16'] !== undefined ? formData['field_17_16'] : (formData['field_21_16'] || '0');

    const elecStatusText = formData['elec_status'] || extractSmartValueEx(['電極', 'electrode'], ['field_37_16'], [], isZH ? '無特殊情況' : 'None');
    const signalStatusText = formData['signal_status'] || extractSmartValueEx(['訊號', 'signal'], ['field_7_20'], ['field_5_20', 'field_16_20'], isZH ? '無特殊情況' : 'None');

    const sacMethodText = formData['sac_method'] || extractSmartValueEx(['犧牲方式', 'sacrificemethod'], ['field_3_24'], ['field_7_24'], isZH ? '無' : 'None');
    const sacStatusText = formData['sac_status'] || extractSmartValueEx(['犧牲情況', 'sacrificestatus'], ['field_7_24', 'field_9_24'], ['field_12_24'], isZH ? '無特殊情況' : 'None');
    const tissueText = formData['tissue'] || extractSmartValueEx(['摘除組織', 'tissue'], ['field_12_24', 'field_14_24'], [], isZH ? '無' : 'None');
    const tissueStatusText = formData['tissue_status'] || extractSmartValueEx(['摘除情況', 'excisionstatus'], ['field_17_24'], ['field_24_24'], isZH ? '無特殊情況' : 'None');
    const storageText = formData['storage'] || formData['field_21_24'] || extractSmartValueEx(['保存', 'preservation'], ['field_24_24', 'field_21_24'], [], isZH ? '不保存' : 'None');

    let notesStr = formData['notes'] || '';
    if (!notesStr) {
      const bottomNotes = [];
      if (formData['field_15_0']) bottomNotes.push(formData['field_15_0']);
      if (formData['field_81_8']) bottomNotes.push(formData['field_81_8']);
      if (formData['field_56_28']) bottomNotes.push(formData['field_56_28']);
      notesStr = bottomNotes.join('\n') || (isZH ? '無' : 'None');
    }

    const isCompleted = exp.status === '已完成' || exp.status === '實驗完成' || exp.status === '實驗結束' || exp.status === 'Completed';
    const uploadTagHtml = isCompleted 
      ? (exp.hasDataUpload 
          ? `<span class="upload-status-tag uploaded">${isZH?'已上傳':'Uploaded'}</span>` 
          : `<span class="upload-status-tag pending">${isZH?'待上傳':'Pending'}</span>`) 
      : '';

    const folderLinkHtml = exp.expDataFolder 
      ? `<a href="${exp.expDataFolder}" target="_blank" style="color:var(--primary); font-weight:700; text-decoration:none;">開啟雲端數據資料夾 ↗</a>`
      : `<span style="color:var(--text-muted); font-size:11px;">${isZH?'尚未建立雲端資料夾':'No cloud folder yet'}</span>`;

    const expandedHtml = `
      <div class="detail-list">
        <div class="exp-panel full-width" style="margin-bottom:12px;">
          <div class="exp-panel-title">
            <span>${isZH ? '基本資訊與執行總覽' : 'Basic Information Overview'}</span>
            <span class="status-badge-lg" style="background:${styleObj.bg}; color:${styleObj.text}; border-color:${styleObj.border};">${displayStatus}</span>
          </div>
          <div class="expanded-grid" style="margin-top:0; margin-bottom:10px;">
            <div>
              <div class="detail-row"><div class="detail-label">${isZH?'實驗編號':'Experiment ID'}</div><div class="detail-value normal-value" style="font-family:ui-monospace, monospace; color:var(--primary); font-size:13px;">${exp.expId}</div></div>
              <div class="detail-row"><div class="detail-label">${isZH?'大綱與目的':'Outline & Purpose'}</div><div class="detail-value normal-value">${displayInfo}</div></div>
              <div class="detail-row"><div class="detail-label">${isZH?'負責人員':'Experimenter'}</div><div class="detail-value normal-value">${exp.user}</div></div>
              <div class="detail-row"><div class="detail-label">${isZH?'執行日期':'Date'}</div><div class="detail-value normal-value">${exp.date}</div></div>
            </div>
            <div style="background:#fff; border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:10px 12px;">
              <div style="font-weight:700; color:var(--text-muted); font-size:11px; margin-bottom:6px;">${isZH?'狀態歷程點線記錄':'Time Log History'}</div>
              ${dotLineLogsHtml}
            </div>
          </div>
          <div style="border-top:1px dashed var(--border-color); padding-top:8px;">
            <div style="font-size:11px; font-weight:700; color:var(--text-secondary); display:flex; justify-content:space-between; align-items:center;">
              <span>${isZH?'實驗全流程時間軸 (12小時基準)':'Execution Timeline (12h Max)'}</span>
              <span>${isZH?'實驗總耗時':'Total Duration'}: <strong style="color:var(--primary); font-size:13px;">${timeLogCalculations.totalMins} ${isZH?'分鐘':'mins'}</strong></span>
            </div>
            ${timeLogCalculations.barHtml}
          </div>
        </div>

        <div class="expanded-grid">
          ${ultrasoundPanelHtml}

          <div class="exp-panel">
            <div class="exp-panel-title">${isZH ? '動物基本參數與生理狀況' : 'Animal Parameters & State'}</div>
            <div class="detail-row"><div class="detail-label">${isZH?'大鼠體重':'Rat Weight'}</div><div class="detail-value normal-value">${ratWeight || '--'} g</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'PTZ / Saline 劑量':'PTZ / Saline Dose'}</div><div class="detail-value normal-value">${ptzVol} / ${salineVol} uL</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'生理情況標記':'Physiological State'}</div><div class="detail-value ${getConditionClass(ratStatusText)}">${ratStatusText}</div></div>
          </div>

          <div class="exp-panel">
            <div class="exp-panel-title">${isZH ? '手術情形' : 'Surgical Conditions'}</div>
            <div class="detail-row"><div class="detail-label">${isZH?'手術耗時':'Surgery Duration'}</div><div class="detail-value" style="color:var(--danger); font-weight:700;">${surgDurationText}</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'手術過程狀況':'Surgical Status'}</div><div class="detail-value ${getConditionClass(surgeryStatusText)}">${surgeryStatusText}</div></div>
          </div>

          <div class="exp-panel full-width">
            <div class="exp-panel-title">${isZH ? '電極設置與訊號蒐集' : 'Electrode Setup & Signal Collection'}</div>
            <div class="expanded-grid" style="margin-top:0;">
              <div>
                <div class="detail-row"><div class="detail-label">${isZH?'Lamda 座標':'Lamda Position'}</div><div class="detail-value normal-value">(${lamdaAP}, ${lamdaML})</div></div>
                <div class="detail-row"><div class="detail-label">${isZH?'電極插入位置':'Electrode Position'}</div><div class="detail-value normal-value">(${eleAP}, ${eleML}, ${eleDH})</div></div>
              </div>
              <div>
                <div class="detail-row"><div class="detail-label">${isZH?'電極插入狀況':'Electrode Status'}</div><div class="detail-value ${getConditionClass(elecStatusText)}">${elecStatusText}</div></div>
                <div class="detail-row"><div class="detail-label">${isZH?'訊號蒐集狀況':'Signal Status'}</div><div class="detail-value ${getConditionClass(signalStatusText)}">${signalStatusText}</div></div>
              </div>
            </div>
          </div>

          <div class="exp-panel full-width">
            <div class="exp-panel-title">${isZH ? '犧牲與組織保存' : 'Sacrifice & Tissue Preservation'}</div>
            <div class="expanded-grid" style="margin-top:0;">
              <div>
                <div class="detail-row"><div class="detail-label">${isZH?'犧牲方式':'Sacrifice Method'}</div><div class="detail-value ${getConditionClass(sacMethodText)}">${sacMethodText}</div></div>
                <div class="detail-row"><div class="detail-label">${isZH?'犧牲狀況':'Sacrifice Condition'}</div><div class="detail-value ${getConditionClass(sacStatusText)}">${sacStatusText}</div></div>
                <div class="detail-row"><div class="detail-label">${isZH?'摘除組織':'Excised Tissue'}</div><div class="detail-value ${getConditionClass(tissueText)}">${tissueText}</div></div>
              </div>
              <div>
                <div class="detail-row"><div class="detail-label">${isZH?'摘除狀況':'Excision Condition'}</div><div class="detail-value ${getConditionClass(tissueStatusText)}">${tissueStatusText}</div></div>
                <div class="detail-row"><div class="detail-label">${isZH?'保存方式':'Preservation Method'}</div><div class="detail-value normal-value">${storageText}</div></div>
              </div>
            </div>
          </div>

          <div class="exp-panel full-width">
            <div class="exp-panel-title">${isZH ? '備註紀錄' : 'Notes'}</div>
            <div class="detail-value normal-value" style="white-space:pre-line; text-align:left; font-weight:600; padding:2px 0;">${notesStr}</div>
          </div>

          <!-- 區塊 7：獨立實驗數據檔案專區 ( Column W 上傳 Zone ) -->
          <div class="exp-panel full-width">
            <div class="exp-panel-title">
              <span>${isZH ? '實驗數據檔案 (Column W)' : 'Experimental Data Files'}</span>
              ${uploadTagHtml}
            </div>
            <div style="padding:4px 0 8px 0; font-size:12px;">
              <div style="margin-bottom:6px;">${folderLinkHtml}</div>
              
              <div id="dropZoneExpanded" class="drop-zone" onclick="document.getElementById('fileInputSecretEx').click();">
                <div class="drop-zone-text">📁 點擊或將檔案拖曳至此處上傳</div>
                <div style="font-size:10px; color:var(--text-muted); margin-top:2px;">(限定 .csv, .png, .jpeg，系統將自動歸檔至 [${exp.expId}] 並寫入 W 欄)</div>
                <input type="file" id="fileInputSecretEx" multiple accept=".csv, .png, .jpeg, .jpg" style="display:none;" onchange="handleDirectFileUpload(this.files, '${exp.expId}')">
              </div>
              <div id="uploadStatusTextEx" style="font-size:11px; font-weight:700; margin-top:6px;"></div>
            </div>
          </div>

        </div>
      </div>
    `;

    document.getElementById('modalTitle').innerText = isZH ? "完整實驗專案報告 (展開版)" : "Full Experiment Detailed Report";
    document.getElementById('modalMessage').innerHTML = expandedHtml;
    document.getElementById('modalBtnArea').innerHTML = `
      <button class="modal-btn-confirm" onclick="showActiveExpDetail('${exp.expId}')">${isZH?'返回精簡明細':'Back to Summary'}</button>
      <button class="modal-btn-confirm" style="background:var(--text-secondary);" onclick="closeCustomModal()">${isZH ? '關閉' : 'Close'}</button>
    `;

    setupDropZoneEventsExpanded(exp.expId);
  }

  /* 3. 展開版拖曳事件監聽 */
  function setupDropZoneEventsExpanded(expId) {
    setTimeout(() => {
      const dz = document.getElementById('dropZoneExpanded');
      if (!dz) return;

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dz.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        dz.addEventListener(eventName, () => dz.classList.add('dragover'), false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dz.addEventListener(eventName, () => dz.classList.remove('dragover'), false);
      });

      dz.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        handleDirectFileUpload(dt.files, expId);
      }, false);
    }, 100);
  }

  /* 多檔案直傳 */
  async function handleDirectFileUpload(files, expId) {
    const statusElem = document.getElementById('uploadStatusTextEx');
    if (!files || files.length === 0) return;

    const validFiles = [];
    const allowedExts = ['csv', 'png', 'jpeg', 'jpg'];

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const ext = f.name.split('.').pop().toLowerCase();
      if (allowedExts.includes(ext)) {
        validFiles.push(f);
      }
    }

    if (validFiles.length === 0) {
      alert("只接受 CSV、PNG 與 JPEG 格式檔案！");
      return;
    }

    let latestFolderUrl = "";

    for (let i = 0; i < validFiles.length; i++) {
      const file = validFiles[i];
      
      if (statusElem) {
        statusElem.innerText = `正在傳送第 (${i + 1}/${validFiles.length}) 個檔案：${file.name}...`;
        statusElem.style.color = "var(--primary)";
      }

      try {
        const base64 = await readFileAsBase64(file);

        const response = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "uploadSingleFile",
            expId: expId,
            fileName: file.name,
            mimeType: file.type || "application/octet-stream",
            fileData: base64
          })
        });

        const resText = await response.text();
        let resJson = {};
        try { resJson = JSON.parse(resText); } catch(e) {}

        if (resJson.folderUrl) {
          latestFolderUrl = resJson.folderUrl;
        }

      } catch (err) {
        console.error(`檔案 ${file.name} 上傳失敗:`, err);
        if (statusElem) {
          statusElem.innerText = `❌ 檔案 ${file.name} 上傳失敗。`;
          statusElem.style.color = "var(--danger)";
        }
        return;
      }
    }

    const targetExp = state.dataCenter.find(d => d.expId === expId);
    if (targetExp) {
      if (latestFolderUrl) targetExp.expDataFolder = latestFolderUrl;
      targetExp.hasDataUpload = true;
    }

    if (statusElem) {
      statusElem.innerText = `✅ 全部 ${validFiles.length} 個檔案上傳完成！`;
      statusElem.style.color = "var(--success)";
    }

    alert(`成功上傳 ${validFiles.length} 個檔案！\n已存入雲端硬碟 [${expId}] 資料夾並寫入 W 欄。`);

    if (typeof filterRecordCenterList === 'function') filterRecordCenterList();
    showFullExpandedView(expId);
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  function closeCustomModal() { 
    document.getElementById('customModalBackdrop').style.display = 'none'; 
  }

  function showCustomConfirm(message, onConfirm) {
    if (window.confirm(message)) {
      if (typeof onConfirm === 'function') onConfirm();
    }
  }
</script>
</body>
</html>

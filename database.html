<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>實驗紀錄資料庫 - 智慧實驗日誌</title>
  <style>
    :root {
      --bg-main: #f1f5f9;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      
      --border-color: #e2e8f0;
      --border-focus: #60a5fa;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: var(--bg-main); color: var(--text-primary); }

    .app-container {
      width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh;
      background: var(--bg-main); display: flex; flex-direction: column; position: relative;
    }

    /* Header */
    .header {
      background: var(--card-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px); box-shadow: var(--shadow-sm);
    }
    .header-title h1 { font-size: 16px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .header-title h1::before { content: ""; display: inline-block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
    
    .header-right { display: flex; align-items: center; gap: 8px; }
    .lang-btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-back {
      background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-secondary);
      border-radius: var(--radius-sm); padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-back:hover { background: #e2e8f0; }

    .main-content { padding: 16px; flex: 1; overflow-y: auto; }

    .form-control {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); font-size: 13px; background: #fff; color: var(--text-primary); outline: none;
      transition: border-color 0.2s ease;
    }
    .form-control:focus { border-color: var(--border-focus); }

    /* 統計卡片與收合機制 */
    .stats-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-md); transition: all 0.25s ease;
    }
    .stats-header {
      display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none;
    }
    .stats-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .toggle-icon { font-size: 12px; color: var(--text-muted); transition: transform 0.2s ease; }
    .toggle-icon.collapsed { transform: rotate(-90deg); }

    .stats-body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; transition: all 0.3s ease; }
    .stats-body.hidden { display: none; }

    .stat-interactive-item { cursor: pointer; transition: all 0.15s ease; }
    .stat-interactive-item:hover { transform: translateY(-1px); filter: brightness(0.97); }

    .tag-btn {
      background: #f8fafc; border: 1px solid var(--border-color); color: var(--text-secondary);
      padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .tag-btn:hover, .tag-btn:active { background: var(--primary-light); color: var(--primary); border-color: var(--border-focus); }

    /* 時間軸列表 */
    .timeline-container { position: relative; padding-left: 20px; margin-top: 12px; }
    .timeline-line { position: absolute; left: 5px; top: 12px; bottom: 8px; width: 2px; background: var(--border-color); }
    .timeline-item { position: relative; margin-bottom: 12px; cursor: pointer; }
    .timeline-node { position: absolute; left: -19px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card-bg); box-shadow: 0 0 0 2px var(--primary); }
    .timeline-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); transition: all 0.2s ease; }
    .timeline-card:hover { border-color: var(--border-focus); box-shadow: var(--shadow-md); }

    .timeline-date-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .timeline-date-title { font-size: 13px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .timeline-user-badge { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-status-group { display: flex; align-items: center; gap: 4px; }
    
    .status-badge-lg { display: inline-flex; align-items: center; justify-content: center; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; border: 1px solid transparent; }

    .timeline-info-text { font-size: 13px; margin-top: 6px; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-exp-id { font-size: 10px; font-family: ui-monospace, monospace; color: var(--text-muted); font-weight: 500; margin-top: 4px; }

    /* Empty State */
    .empty-state-box {
      text-align: center; padding: 28px 16px; color: var(--text-muted);
      background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: var(--radius-md);
      margin: 8px 0;
    }
    .empty-state-title { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-top: 4px; }
    .empty-state-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* Modal 通用背景與基本排版 */
    .custom-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px;
    }
    .custom-modal {
      background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 420px;
      padding: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); max-height: 88vh; display: flex; flex-direction: column;
      transition: max-width 0.3s ease;
    }
    .custom-modal.expanded-mode {
      max-width: 880px;
    }

    .custom-modal h3 { margin-bottom: 12px; font-size: 15px; font-weight: 700; color: var(--text-primary); text-align: center; }
    .detail-list { text-align: left; overflow-y: auto; max-height: 72vh; font-size: 12px; padding: 2px; }
    .detail-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--border-color); gap: 8px; }
    .detail-label { font-weight: 700; color: var(--text-muted); font-size: 11px; width: 35%; flex-shrink: 0; }
    .detail-value { font-weight: 600; color: var(--text-primary); width: 65%; text-align: right; word-break: break-word; }
    
    .modal-btn-confirm { background: var(--primary); color: #fff; border: none; padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; font-size: 13px; }
    .modal-btn-expand { background: var(--primary-light); color: var(--primary); border: 1px solid var(--border-focus); padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; font-size: 13px; transition: all 0.2s; }
    .modal-btn-expand:hover { background: #dbeafe; }

    /* 展開版專業 Grid Layout */
    .expanded-grid {
      display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 10px;
    }
    @media (min-width: 640px) {
      .expanded-grid { grid-template-columns: 1fr 1fr; }
      .expanded-grid .full-width { grid-column: span 2; }
    }

    .exp-panel {
      background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px 14px;
    }
    .exp-panel-title {
      font-size: 12px; font-weight: 800; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid var(--border-color); padding-bottom: 6px;
    }

    /* 多色耗數比例時間軸 */
    .timeline-bar-wrapper { margin-top: 8px; margin-bottom: 8px; }
    .timeline-multi-bar { display: flex; width: 100%; height: 14px; border-radius: 6px; overflow: hidden; border: 1px solid #cbd5e1; background: #e2e8f0; }
    .timeline-segment { height: 100%; transition: width 0.3s ease; }
    .timeline-legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; margin-top: 8px; font-weight: 600; }
    .legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <h1 id="txtDbTitle">實驗紀錄資料庫</h1>
    </div>
    <div class="header-right">
      <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
      <a href="index.html" class="btn-back" id="txtBtnBack">返回主頁</a>
    </div>
  </div>

  <div class="main-content">
    <!-- 1. 數據統計卡片區 -->
    <div class="stats-card">
      <div class="stats-header" onclick="toggleStatsCard()">
        <div class="stats-title" id="txtStatsTitle">會員專案與題目個案統計</div>
        <div id="statsToggleIcon" class="toggle-icon">▼</div>
      </div>
      <div id="statsContent" class="stats-body">
        <div style="color:var(--text-muted);" id="txtLoadingStats">載入統計數據中...</div>
      </div>
    </div>

    <!-- 2. 關鍵字搜尋與快速 Tag -->
    <div style="margin-bottom:16px;">
      <input type="text" id="txtRecordSearch" class="form-control" placeholder="搜尋負責人、大綱、狀態、編號..." oninput="filterRecordCenterList()" style="margin-bottom:10px;">
      <div style="font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:8px;" id="txtQuickSearchTitle">快速點擊搜尋：</div>
      <div id="quickSearchTags" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
    </div>

    <!-- 3. 全數據歷史時間軸 -->
    <div id="recordCenterList" class="timeline-container">
      <div class="timeline-line"></div>
      <div style="padding:10px; color:var(--text-muted); font-size:12px;" id="txtSyncing">同步試算表資料中...</div>
    </div>
  </div>
</div>

<!-- 詳細明細彈窗 -->
<div id="customModalBackdrop" class="custom-modal-backdrop">
  <div class="custom-modal" id="modalDialogBox">
    <h3 id="modalTitle">實驗詳細資訊</h3>
    <div id="modalMessage"></div>
    <div id="modalBtnArea">
      <button class="modal-btn-confirm" onclick="closeCustomModal()">關閉</button>
    </div>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwvsd4fRN4qgWBL2ku7E_r-DekIiVtikpvjyVLRqOiGWPPb1sts3Mj10bMiX9n_zoO1tw/exec";
  const URL_MEMBERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=280963157&single=true&output=csv";
  const URL_FORMS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=0&single=true&output=csv";
  const URL_DATA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=301837161&single=true&output=csv";

  const STATUS_STYLES = {
    "已預約": { bg: "#f1f5f9", text: "#64748b", border: "#cbd5e1" },        
    "準備中": { bg: "#f0f9ff", text: "#0284c7", border: "#bae6fd" },        
    "準備完成": { bg: "#ecfdf5", text: "#059669", border: "#a7f3d0" },      
    "手術中": { bg: "#fef2f2", text: "#dc2626", border: "#fca5a5" },        
    "休息中": { bg: "#f0fdf4", text: "#10b981", border: "#86efac" },        
    "已死亡": { bg: "#0f172a", text: "#ffffff", border: "#0f172a" },        
    "訊號蒐集中": { bg: "#fffbeb", text: "#d97706", border: "#fde68a" },    
    "訊號蒐集完成": { bg: "#fefce8", text: "#ca8a04", border: "#fef08a" },
    "犧牲中": { bg: "#f3e8ff", text: "#7c3aed", border: "#d8b4fe" },        
    "實驗善後": { bg: "#faf5ff", text: "#a855f7", border: "#e9d5ff" },      
    "實驗完成": { bg: "#334155", text: "#ffffff", border: "#334155" },      
    "已完成": { bg: "#334155", text: "#ffffff", border: "#334155" },      
    "其他": { bg: "#f1f5f9", text: "#64748b", border: "#cbd5e1" }
  };

  const STATUS_TRANS = {
    "已預約": { ZH: "已預約", EN: "Reserved" },
    "準備中": { ZH: "準備中", EN: "Preparing" },
    "準備完成": { ZH: "準備完成", EN: "Prepared" },
    "手術中": { ZH: "手術中", EN: "Surgery" },
    "休息中": { ZH: "休息中", EN: "In Break" },
    "已死亡": { ZH: "已死亡", EN: "Deceased" },
    "訊號蒐集中": { ZH: "訊號蒐集中", EN: "Recording" },
    "訊號蒐集完成": { ZH: "訊號蒐集完成", EN: "Signal Done" },
    "犧牲中": { ZH: "犧牲中", EN: "Sacrificing" },
    "實驗善後": { ZH: "實驗善後", EN: "Cleaning" },
    "已完成": { ZH: "已完成", EN: "Completed" },
    "實驗完成": { ZH: "實驗完成", EN: "Completed" }
  };

  let state = {
    currentLang: "ZH",
    membersList: [],
    dataCenter: [],
    dynamicForms: {},
    isStatsCollapsed: false,
    activeViewingExpId: null
  };

  window.addEventListener('DOMContentLoaded', async () => {
    const savedUser = localStorage.getItem('elabnote_user');
    if (savedUser) {
      try {
        const usrObj = JSON.parse(savedUser);
        if (usrObj.lang) state.currentLang = usrObj.lang;
      } catch(e) {}
    }

    applyLanguage();
    await fetchMembersFromSheet();
    await fetchAndParseFormsFromSheet();
    await fetchDataCenterFromSheet();
    
    renderRecordCenterStats();
    renderQuickSearchTags();
    filterRecordCenterList();
  });

  function toggleLanguage() {
    state.currentLang = state.currentLang === "ZH" ? "EN" : "ZH";
    applyLanguage();
    renderRecordCenterStats();
    renderQuickSearchTags();
    filterRecordCenterList();
  }

  function applyLanguage() {
    const isZH = state.currentLang === 'ZH';
    document.getElementById('langToggleBtn').innerText = isZH ? "ZN" : "EN";
    document.getElementById('txtDbTitle').innerText = isZH ? "實驗紀錄資料庫" : "Experiment Database";
    document.getElementById('txtBtnBack').innerText = isZH ? "返回主頁" : "Back to Home";
    document.getElementById('txtStatsTitle').innerText = isZH ? "會員專案與題目個案統計" : "Member Projects & Cases Statistics";
    document.getElementById('txtQuickSearchTitle').innerText = isZH ? "快速點擊搜尋：" : "Quick Filter Tags:";
    document.getElementById('txtRecordSearch').placeholder = isZH ? "搜尋負責人、大綱、狀態、編號..." : "Search owner, outline, status, ID...";
    
    const loadingElem = document.getElementById('txtLoadingStats');
    if (loadingElem) loadingElem.innerText = isZH ? "載入統計數據中..." : "Loading statistics...";
    
    const syncingElem = document.getElementById('txtSyncing');
    if (syncingElem) syncingElem.innerText = isZH ? "同步試算表資料中..." : "Syncing spreadsheet data...";
  }

  function toggleStatsCard() {
    state.isStatsCollapsed = !state.isStatsCollapsed;
    const statsBody = document.getElementById('statsContent');
    const toggleIcon = document.getElementById('statsToggleIcon');
    
    if (state.isStatsCollapsed) {
      statsBody.classList.add('hidden');
      toggleIcon.classList.add('collapsed');
    } else {
      statsBody.classList.remove('hidden');
      toggleIcon.classList.remove('collapsed');
    }
  }

  function getStatusStyle(statusStr) {
    if (!statusStr) return STATUS_STYLES["其他"];
    const key = Object.keys(STATUS_STYLES).find(k => statusStr.includes(k));
    return key ? STATUS_STYLES[key] : STATUS_STYLES["其他"];
  }

  function parseSingleBilingualStr(str, lang) {
    if (!str) return '';
    if (!str.includes('/')) return str.trim();
    const parts = str.split('/');
    return lang === 'EN' ? (parts[1] || parts[0]).trim() : parts[0].trim();
  }

  function cleanDisplayLabel(text) {
    if (!text) return '';
    return text
      .replace(/\[submit\]/gi, '')
      .replace(/\[fetch_detail:[^\]]+\]/gi, '')
      .replace(/\[status:[^\]]+\]/gi, '')
      .replace(/\[info\]/gi, '')
      .replace(/\[warning\]/gi, '')
      .replace(/\[formula:[^\]]+\]/gi, '')
      .replace(/\[unit:[^\]]+\]/gi, '')
      .replace(/\[placeholder:[^\]]+\]/gi, '')
      .replace(/\[default:[^\]]+\]/gi, '')
      .trim();
  }

  function formatBilingualText(fullInfoStr, lang) {
    if (!fullInfoStr) return '';
    const cleaned = cleanDisplayLabel(fullInfoStr);
    if (cleaned.includes(' - ')) {
      const parts = cleaned.split(' - ');
      const outlineFormatted = parseSingleBilingualStr(parts[0], lang);
      const purposeFormatted = parseSingleBilingualStr(parts[1], lang);
      return `${outlineFormatted} - ${purposeFormatted}`;
    }
    return parseSingleBilingualStr(cleaned, lang);
  }

  function getStatusText(statusRaw, lang) {
    if (STATUS_TRANS[statusRaw]) {
      return STATUS_TRANS[statusRaw][lang] || statusRaw;
    }
    return parseSingleBilingualStr(statusRaw, lang);
  }

  function parseCSV(text) {
    const result = [];
    let row = [];
    let entry = '';
    let insideQuote = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (insideQuote && nextChar === '"') {
          entry += '"';
          i++;
        } else {
          insideQuote = !insideQuote;
        }
      } else if (char === ',' && !insideQuote) {
        row.push(entry);
        entry = '';
      } else if ((char === '\r' || char === '\n') && !insideQuote) {
        if (char === '\r' && nextChar === '\n') {
          i++;
        }
        row.push(entry);
        entry = '';
        if (row.some(c => c.trim() !== '')) {
          result.push(row);
        }
        row = [];
      } else {
        entry += char;
      }
    }

    if (entry !== '' || row.length > 0) {
      row.push(entry);
      if (row.some(c => c.trim() !== '')) {
        result.push(row);
      }
    }

    return result;
  }

  async function fetchMembersFromSheet() {
    try {
      const res = await fetch(`${URL_MEMBERS}&_t=${Date.now()}`);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      state.membersList = rows.slice(1).map(r => ({ name: r[0]?.trim(), color: r[3]?.trim() || '#f1f5f9' })).filter(m => m.name);
    } catch(e) { console.error("讀取會員列表失敗:", e); }
  }

  async function fetchAndParseFormsFromSheet() {
    try {
      const res = await fetch(`${URL_FORMS}&_t=${Date.now()}`);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      if (rows.length < 2) return;

      const headerRow = rows[0];
      const formBlocks = [];
      for (let colIdx = 0; colIdx < headerRow.length; colIdx++) {
        const cellVal = (headerRow[colIdx] || "").trim();
        if (cellVal.startsWith("FORM_")) formBlocks.push({ formId: cellVal, startCol: colIdx });
      }

      const parsedForms = {};
      formBlocks.forEach(block => {
        const pages = [];
        let currentPage = null;
        for (let r = 2; r < rows.length; r++) {
          if (!rows[r]) continue;
          const rawLabel = (rows[r][block.startCol] || "").trim();
          const rawType = (rows[r][block.startCol + 1] || "").trim();
          if (!rawLabel && !rawType) continue;

          if (rawLabel.includes("【") && rawLabel.includes("】")) {
            currentPage = { title: cleanDisplayLabel(rawLabel.replace(/【|】/g, "")), fields: [] };
            pages.push(currentPage);
            continue;
          }
          if (!currentPage) { currentPage = { title: "Page 1", fields: [] }; pages.push(currentPage); }
          
          const fieldId = `field_${r}_${block.startCol}`;
          currentPage.fields.push({ id: fieldId, label: cleanDisplayLabel(rawLabel), type: rawType });
        }
        parsedForms[block.formId] = pages;
      });
      state.dynamicForms = parsedForms;
    } catch (err) { console.error("解析動態表單架構失敗:", err); }
  }

  async function fetchDataCenterFromSheet() {
    try {
      const res = await fetch(`${URL_DATA}&_t=${Date.now()}`);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      const records = [];

      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;
        if (row[0] || row[1]) {
          const expId = row[0] ? row[0].trim() : '未編號';
          const date = row[1] ? row[1].trim() : '';
          const user = row[2] ? row[2].trim() : '';
          const status = row[3] ? row[3].trim() : '未知';
          
          let parsedFormData = {};
          const jsonCols = [4, 6, 8, 10, 12];
          jsonCols.forEach(colIdx => {
            if (row[colIdx]) {
              let rawJsonStr = row[colIdx].trim();
              if (rawJsonStr.startsWith('"') && rawJsonStr.endsWith('"')) rawJsonStr = rawJsonStr.slice(1, -1).replace(/""/g, '"');
              if (rawJsonStr.startsWith('{') && rawJsonStr.endsWith('}')) {
                try { parsedFormData = { ...parsedFormData, ...JSON.parse(rawJsonStr) }; } catch (e) {}
              }
            }
          });

          let dynamicInfo = '實驗專案';
          const outline = parsedFormData['outline_select_val'] || '';
          const purpose = parsedFormData['selected_purpose_name'] || '';
          if (outline && purpose) dynamicInfo = `${outline} - ${purpose}`;
          else dynamicInfo = outline || purpose || '實驗專案';

          const expDataFolder = (row.length > 22 && row[22]) ? row[22].trim() : '';

          records.push({
            expId, date, user, status, info: dynamicInfo, formData: parsedFormData, expDataFolder
          });
        }
      }
      state.dataCenter = records;
    } catch (csvErr) { console.error("解析 CSV 失敗:", csvErr); }
  }

        <span style="font-weight:600; color:var(--text-secondary); max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${tpc}</span>

        <div style="display:flex; flex-wrap:wrap; gap:6px;">${userHtml || emptyUserHtml}</div>
      </div>
      <div style="margin-top:6px;">
        <div style="font-size:11px; color:var(--text-muted); margin-bottom:6px; font-weight:600;">• ${isZH?'實驗題目個案累積（點擊搜尋）：':'Experiment Topic Cases:'}</div>
        <div style="display:flex; flex-direction:column; gap:6px;">${topicHtml || emptyUserHtml}</div>

  function renderQuickSearchTags() {
    const tagContainer = document.getElementById('quickSearchTags');
    const tagsSet = new Set();
    state.membersList.forEach(m => tagsSet.add(m.name));
    ["已完成", "手術中", "已預約", "已死亡"].forEach(s => tagsSet.add(getStatusText(s, state.currentLang)));

    tagContainer.innerHTML = Array.from(tagsSet).slice(0, 10).map(tag => `
      <button type="button" class="tag-btn" onclick="applyQuickSearch('${tag}')">${tag}</button>

  function applyQuickSearch(kw) {
    document.getElementById('txtRecordSearch').value = kw;
    filterRecordCenterList();
  }

  function filterRecordCenterList() {
    const kw = document.getElementById('txtRecordSearch').value.trim().toLowerCase();
    const container = document.getElementById('recordCenterList');
    let html = `<div class="timeline-line"></div>`;

    const filtered = state.dataCenter.filter(d => {
      if (!kw) return true;
      const displayStatus = getStatusText(d.status, state.currentLang).toLowerCase();
      const displayInfo = formatBilingualText(d.info, state.currentLang).toLowerCase();
      return (d.expId||'').toLowerCase().includes(kw) || 
             (d.user||'').toLowerCase().includes(kw) || 
             displayStatus.includes(kw) || (d.status||'').toLowerCase().includes(kw) ||
             displayInfo.includes(kw) || (d.date||'').toLowerCase().includes(kw);
    }).sort((a,b) => new Date(b.date) - new Date(a.date));

    if (filtered.length === 0) {
      container.innerHTML = html + renderEmptyState(state.currentLang==='ZH'?'無符合條件的實驗紀錄':'No matching records', '');
      return;
    }

    filtered.forEach(item => {
      const userObj = state.membersList.find(m => m.name === item.user);
      const userColor = userObj ? userObj.color : '#f1f5f9';
      const styleObj = getStatusStyle(item.status);
      const displayStatus = getStatusText(item.status, state.currentLang);
      const displayInfo = formatBilingualText(item.info, state.currentLang);

      html += `
        <div class="timeline-item" onclick="showActiveExpDetail('${item.expId}')">
          <div class="timeline-node" style="background:${styleObj.text}"></div>
          <div class="timeline-card">
            <div class="timeline-date-head">
              <div class="timeline-date-title">
                <span>${item.date}</span>
                <span class="timeline-user-badge" style="background:${userColor};">${item.user}</span>
              </div>
              <div class="timeline-status-group">
                <span class="status-badge-lg" style="background:${styleObj.bg}; color:${styleObj.text}; border-color:${styleObj.border};">${displayStatus}</span>
              </div>
            </div>
            <div class="timeline-info-text">${displayInfo || '實驗專案'}</div>
            <div class="timeline-exp-id">ID: ${item.expId}</div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function getDynamicFieldValue(formData, labelKeywords) {
    if (!state.dynamicForms || !formData) return { val: null, id: null };
    const kwArr = Array.isArray(labelKeywords) ? labelKeywords : [labelKeywords];
    for (const formId in state.dynamicForms) {
      const pages = state.dynamicForms[formId];
      if (!Array.isArray(pages)) continue;
      for (const p of pages) {
        if (!p.fields || !Array.isArray(p.fields)) continue;
        for (const f of p.fields) {
          if (f.label) {
            const cleanLabel = f.label.toLowerCase();
            const isMatch = kwArr.some(kw => cleanLabel.includes(kw.toLowerCase()));
            if (isMatch && formData[f.id] !== undefined) return { val: formData[f.id], id: f.id };
          }
        }
      }
    }
    return { val: null, id: null };
  }

  /* 第一階段：精簡明細彈窗 */
  function showActiveExpDetail(expId) {
    state.activeViewingExpId = expId;
    const exp = state.dataCenter.find(d => d.expId === expId);
    if (!exp) return;

    const isZH = state.currentLang === 'ZH';
    const styleObj = getStatusStyle(exp.status);
    const displayStatus = getStatusText(exp.status, state.currentLang);
    const displayInfo = formatBilingualText(exp.info, state.currentLang);
    const formData = exp.formData || {};

    const modalDialog = document.getElementById('modalDialogBox');
    modalDialog.classList.remove('expanded-mode');

    let timeLogsHtml = '';
    let surgeryDurationHtml = '';
    
    if (formData['_time_logs'] && Object.keys(formData['_time_logs']).length > 0) {
      const logs = formData['_time_logs'];
      timeLogsHtml = Object.entries(logs).map(([st, time]) => {
        const transSt = getStatusText(st, state.currentLang);
        return `
          <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px;">
            <span style="color:var(--text-muted); font-weight:700;">• ${transSt}:</span>
            <span style="font-family:ui-monospace, monospace; color:var(--text-primary);">${time}</span>
          </div>
        `;
      }).join('');

      if (logs['手術中'] && (logs['休息中'] || logs['已死亡'])) {
        const start = new Date(logs['手術中']);
        const end = new Date(logs['休息中'] || logs['已死亡']);
        const diffMs = end - start;
        if (diffMs > 0) {
          const diffMins = Math.floor(diffMs / 60000);
          surgeryDurationHtml = `
            <div class="detail-row">
              <div class="detail-label" style="color:var(--danger);">${isZH ? '手術用時' : 'Surgery Duration'}</div>
              <div class="detail-value" style="font-weight:700; color:var(--danger);">${diffMins} ${isZH ? '分鐘' : 'mins'}</div>
            </div>
          `;
        }
      }
    } else {
      timeLogsHtml = `<span style="color:var(--text-muted); font-size:11px;">${isZH ? '尚無詳細歷程時間' : 'No time logs'}</span>`;
    }

    let detailsList = [];

    const freqObj = getDynamicFieldValue(formData, ['頻率', 'frequency']);
    if (freqObj.val) detailsList.push({ label: isZH ? '頻率 / Frequency' : 'Frequency', val: `${freqObj.val} HZ` });

    const cycleObj = getDynamicFieldValue(formData, ['週期', 'cycle']);
    if (cycleObj.val) detailsList.push({ label: isZH ? '週期數 / Cycles' : 'Cycles', val: `${cycleObj.val} times` });

    const voltObj = getDynamicFieldValue(formData, ['電壓', 'voltage']);
    if (voltObj.val) detailsList.push({ label: isZH ? '電壓 / Voltage' : 'Voltage', val: `${voltObj.val} mV` });

    const weightObj = getDynamicFieldValue(formData, ['體重', 'weight']);
    const doseObj = getDynamicFieldValue(formData, ['劑量', 'dose']);
    const ratWeight = parseFloat(weightObj.val || 0);
    const ptzDose = parseFloat(doseObj.val || 1);

    if (ratWeight > 0) {
      const ptzVol = ratWeight * ptzDose;
      const salineVol = 700 - ptzVol;
      detailsList.push({ label: isZH ? '大鼠體重（g）' : 'Rat Weight (g)', val: `${ratWeight}` });
      detailsList.push({ label: isZH ? 'PTZ使用劑量' : 'PTZ Dosage', val: `${ptzVol} uL` });
      detailsList.push({ label: isZH ? 'Saline用量' : 'Saline Volume', val: `${salineVol} uL` });
    }

    const lamdaAP = formData['field_20_16'] || '0';
    const lamdaML = formData['field_19_16'] || '0';
    detailsList.push({ label: isZH ? 'Lamda位置' : 'Lamda Position', val: `(${lamdaAP}, ${lamdaML})` });

    const eleAP = formData['field_16_16'] || '0';
    const eleML = formData['field_12_16'] || '0';
    const eleDH = formData['field_17_16'] || '0';
    detailsList.push({ label: isZH ? '電極插入位置' : 'Electrode Insertion Pos', val: `(${eleAP}, ${eleML}, ${eleDH})` });

    const conditionConfigs = [
      { zh: '大鼠生理情況', en: 'Rat Physiological State', kw: ['生理', 'physiological'] },
      { zh: '手術過程狀況', en: 'Surgical Conditions', kw: ['手術', 'surgical', 'surgery'] },
      { zh: '電極插入狀況', en: 'Electrode Insertion State', kw: ['電極', 'electrode'] }
    ];

    conditionConfigs.forEach(cfg => {
      let fieldObj = getDynamicFieldValue(formData, cfg.kw);
      let itemArr = [];

      if (fieldObj.val && Array.isArray(fieldObj.val) && fieldObj.val.length > 0) {
        itemArr = [...fieldObj.val];
        const otherInput = formData[`${fieldObj.id}_input`] || '';
        itemArr = itemArr.map(item => item.includes('其他') ? (otherInput || (isZH ? '其他' : 'Other')) : formatBilingualText(item, state.currentLang));
      } else if (fieldObj.val && typeof fieldObj.val === 'string' && fieldObj.val.trim() !== '') {
        itemArr = [formatBilingualText(fieldObj.val, state.currentLang)];
      }

      if (itemArr.length > 0) {
        detailsList.push({ label: isZH ? cfg.zh : cfg.en, val: itemArr.join(', '), isBlock: true, isCondition: true });
      } else {
        const noCondText = isZH ? '無特殊情況' : 'No special conditions';
        detailsList.push({ label: isZH ? cfg.zh : cfg.en, val: `<span style="color:var(--text-muted); font-weight:500;">${noCondText}</span>`, isBlock: true, isCondition: false });
      }
    });

    let signalItems = [];
    let usedSignalKeys = new Set();

    Object.keys(formData).forEach(k => {
      if (k.endsWith('_20') && !['field_3_20', 'field_4_20', 'field_5_20', 'field_6_20'].includes(k)) {
        const val = formData[k];
        if (Array.isArray(val) && val.length > 0) {
          val.forEach(item => {
            const formatted = formatBilingualText(item, state.currentLang);
            if (!signalItems.includes(formatted)) signalItems.push(formatted);
          });
          usedSignalKeys.add(k);
        } else if (typeof val === 'string' && val.trim() !== '' && !['on', 'true'].includes(val.trim().toLowerCase())) {
          const formatted = String(val).trim();
          if (!signalItems.includes(formatted)) signalItems.push(formatted);
          usedSignalKeys.add(k);
        }
      }
    });

    if (signalItems.length > 0) {
      detailsList.push({ label: isZH ? '訊號蒐集情況' : 'Signal Collection Conditions', val: signalItems.join(', '), isBlock: true, isCondition: true });
    } else {
      const noCondText = isZH ? '無特殊情況' : 'No special conditions';
      detailsList.push({ label: isZH ? '訊號蒐集情況' : 'Signal Collection Conditions', val: `<span style="color:var(--text-muted); font-weight:500;">${noCondText}</span>`, isBlock: true, isCondition: false });
    }

    const sacrificeConfigs = [
      { zh: '犧牲方式', en: 'Sacrifice Method', kw: ['犧牲方式', '犧牲方法', 'sacrificemethod'], fallbackKeys: ['field_3_24'] },
      { zh: '犧牲情況', en: 'Sacrifice Condition', kw: ['犧牲情況', '犧牲狀況', '犧牲過程', '灌流狀況', '灌流情況', '灌流', 'sacrificestatus', 'sacrificedetail'], fallbackKeys: ['field_9_24'] },
      { zh: '本次摘除組織', en: 'Excised Tissue', kw: ['摘除組織', '摘取組織', '摘除器官', 'tissue', 'organ'], fallbackKeys: ['field_14_24'] },
      { zh: '摘除情況', en: 'Excision Condition', kw: ['摘除情況', '摘除狀況', '摘除過程', '組織情況', '組織狀況', '器官情況', 'excisionstatus', 'excisiondetail'], fallbackKeys: ['field_17_24'] },
      { zh: '保存方式', en: 'Preservation Method', kw: ['保存方式', '保存方法', '保存', 'preservation'], fallbackKeys: ['field_21_24'] }
    ];

    sacrificeConfigs.forEach(cfg => {
      let fieldObj = getDynamicFieldValue(formData, cfg.kw);
      let rawVal = fieldObj.val;

      if ((rawVal === null || rawVal === undefined) && cfg.fallbackKeys) {
        for (const fbKey of cfg.fallbackKeys) {
          if (formData[fbKey] !== undefined && formData[fbKey] !== '') {
            rawVal = formData[fbKey];
            break;
          }
        }
      }

      if (rawVal !== null && rawVal !== undefined) {
        let displayStr = "";
        if (Array.isArray(rawVal)) {
          displayStr = rawVal.map(v => formatBilingualText(v, state.currentLang)).filter(Boolean).join(', ');
        } else if (typeof rawVal === 'string') {
          displayStr = formatBilingualText(rawVal, state.currentLang);
        }

        if (displayStr.trim() !== '') {
          let isHighlighted = true;
          if (cfg.zh === '保存方式' && displayStr.includes('不保存')) {
            isHighlighted = false;
          }
          detailsList.push({ label: isZH ? cfg.zh : cfg.en, val: displayStr, isBlock: true, isCondition: isHighlighted });
        }
      }
    });

    let validStages = [];
    let totalMin = 0;

    Object.keys(formData).forEach(k => {
      if (Array.isArray(formData[k]) && formData[k].length > 0) {
        formData[k].forEach(st => {
          if (st && st.name && st.time !== undefined) {
            const t = parseFloat(st.time) || 0;
            if (t > 0 && String(st.name).trim() !== '') {
              totalMin += t;
              validStages.push({ name: String(st.name).trim(), time: t });
            }
          }
        });
      }
    });

    if (totalMin > 0) {
      const colors = ['#3b82f6', '#ef4444', '#10b981', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899'];
      let barBarsHtml = '';
      let legendsHtml = '';

      validStages.forEach((st, idx) => {
        const color = colors[idx % colors.length];
        const pct = ((st.time / totalMin) * 100).toFixed(1);
        barBarsHtml += `<div style="width:${pct}%; background:${color};" title="${st.name}: ${st.time}m"></div>`;
        legendsHtml += `<span style="color:${color};">■ ${st.name}: ${st.time}m</span>`;
      });

      const timelineBarHtml = `
        <div style="margin-top:4px; margin-bottom:6px;">
          <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); margin-bottom:3px; font-weight:700;">
            <span>${isZH ? '訊號蒐集總長度' : 'Total Collection Duration'}: ${totalMin} min</span>
          </div>
          <div style="display:flex; width:100%; height:12px; border-radius:6px; overflow:hidden; border:1px solid #cbd5e1; background:#f1f5f9;">
            ${barBarsHtml}
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; font-size:10px; margin-top:5px; font-weight:600;">
            ${legendsHtml}
          </div>
        </div>
      `;
      detailsList.push({ label: isZH ? '訊號蒐集時間軸' : 'Signal Collection Timeline', val: timelineBarHtml, isBlock: true, isCustomHtml: true });
    }

    const filledDataHtml = detailsList.length > 0 
      ? detailsList.map(item => {
          if (item.isBlock) {
            const textColor = item.isCondition ? 'var(--primary)' : 'var(--text-primary)';
            return `
              <div style="margin-bottom:8px; border-bottom:1px dashed #f1f5f9; padding-bottom:5px;">
                <div style="color:var(--text-muted); font-weight:700; font-size:11px; margin-bottom:2px;">${item.label}:</div>
                <div style="font-weight:700; color:${textColor}; font-size:12px; line-height:1.4; padding-left:2px;">${item.val}</div>
              </div>
            `;
          } else {
            return `
              <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px; border-bottom:1px dashed #f1f5f9; padding-bottom:3px;">
                <span style="color:var(--text-muted); font-weight:700; max-width:55%; font-size:11px;">${item.label}:</span>
                <span style="font-weight:700; color:var(--text-primary); font-family:ui-monospace, monospace; text-align:right;">${item.val}</span>
              </div>
            `;
          }
        }).join('')
      : `<span style="color:var(--text-muted); font-size:11px;">${isZH ? '無紀錄數據' : 'No recorded data'}</span>`;

    let notesArr = [];
    if (formData['notes'] && String(formData['notes']).trim() !== '') {
      notesArr.push(String(formData['notes']).trim());
    }

    let notesStr = notesArr.length > 0 ? notesArr.join('\n') : (isZH ? '無' : 'None');

    const htmlContent = `
      <div class="detail-list">
        <div class="detail-row">
          <div class="detail-label">${isZH ? '實驗編號' : 'ID'}</div>
          <div class="detail-value" style="font-family:ui-monospace, monospace; color:var(--primary);">${exp.expId}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">${isZH ? '當前狀態' : 'Status'}</div>
          <div class="detail-value"><span class="status-badge-lg" style="background:${styleObj.bg}; color:${styleObj.text}; border-color:${styleObj.border}; font-size:10px;">${displayStatus}</span></div>
        </div>
        <div class="detail-row">
          <div class="detail-label">${isZH ? '大綱與目的' : 'Outline & Purpose'}</div>
          <div class="detail-value">${displayInfo}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">${isZH ? '負責人' : 'Owner'}</div>
          <div class="detail-value">${exp.user}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">${isZH ? '實驗日期' : 'Date'}</div>
          <div class="detail-value">${exp.date}</div>
        </div>
        ${surgeryDurationHtml}
        <div class="detail-row">
          <div class="detail-label">${isZH ? '狀態歷程時間' : 'Time Logs'}</div>
          <div class="detail-value" style="text-align:left;">${timeLogsHtml}</div>
        </div>
        <div class="detail-row" style="flex-direction:column; align-items:stretch;">
          <div class="detail-label" style="width:100%; margin-bottom:6px;">${isZH ? '填寫數據明細' : 'Field Data'}</div>
          <div class="detail-value" style="text-align:left; max-height:220px; overflow-y:auto; width:100%; padding:4px 0;">${filledDataHtml}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">${isZH ? '備註紀錄' : 'Notes'}</div>
          <div class="detail-value" style="white-space:pre-line; color:var(--text-primary); text-align:left; font-weight:700;">${notesStr}</div>
        </div>

    document.getElementById('modalTitle').innerText = isZH ? "實驗詳細資訊" : "Experiment Details";
    document.getElementById('modalMessage').innerHTML = htmlContent;
    document.getElementById('modalBtnArea').innerHTML = `
      <button class="modal-btn-expand" onclick="showFullExpandedView('${exp.expId}')">🔎 ${isZH?'檢視完整數據與細節 (專業展開版)':'View Full Detailed Report'}</button>
      <button class="modal-btn-confirm" onclick="closeCustomModal()">${isZH ? '關閉' : 'Close'}</button>
    `;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  /* 🚀 精準全流程多段耗時計算引擎 🚀 */
  function calculateProcessTimeline(timeLogs) {
    const isZH = state.currentLang === 'ZH';
    const segments = [];
    let totalMins = 0;

    const getTime = (key) => {
      if (!timeLogs || !timeLogs[key]) return null;
      const d = new Date(timeLogs[key]);
      return isNaN(d.getTime()) ? null : d;
    };

    const tSurgeryStart = getTime('手術中');
    const tBreakStart = getTime('休息中');
    const tSignalStart = getTime('訊號蒐集中');
    const tSignalEnd = getTime('訊號蒐集完成');
    const tSacrificeStart = getTime('犧牲中');
    const tCleanupEnd = getTime('實驗善後') || getTime('已完成') || getTime('實驗完成');

    // 1. 手術耗時
    if (tSurgeryStart && (tBreakStart || tSignalStart)) {
      const end = tBreakStart || tSignalStart;
      const diff = Math.max(0, Math.floor((end - tSurgeryStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '手術耗時' : 'Surgery', mins: diff, color: '#ef4444' }); totalMins += diff; }
    }

    // 2. 休息間隔
    if (tBreakStart && tSignalStart) {
      const diff = Math.max(0, Math.floor((tSignalStart - tBreakStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '休息間隔' : 'Rest Interval', mins: diff, color: '#10b981' }); totalMins += diff; }
    }

    // 3. 訊號蒐集耗時
    if (tSignalStart && tSignalEnd) {
      const diff = Math.max(0, Math.floor((tSignalEnd - tSignalStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '訊號蒐集耗時' : 'Signal Duration', mins: diff, color: '#f59e0b' }); totalMins += diff; }
    }

    // 4. 犧牲與善後耗時
    if (tSacrificeStart && tCleanupEnd) {
      const diff = Math.max(0, Math.floor((tCleanupEnd - tSacrificeStart) / 60000));
      if (diff > 0) { segments.push({ name: isZH ? '犧牲耗時' : 'Sacrifice', mins: diff, color: '#8b5cf6' }); totalMins += diff; }
    }

    if (totalMins === 0 || segments.length === 0) {
      return {
        totalMins: 0,
        barHtml: `<div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${isZH?'尚無完整階段時間歷程':'No process timeline data available'}</div>`
      };
    }

    let barSegsHtml = '';
    let legendHtml = '';

    segments.forEach(seg => {
      const pct = ((seg.mins / totalMins) * 100).toFixed(1);
      barSegsHtml += `<div class="timeline-segment" style="width:${pct}%; background:${seg.color};" title="${seg.name}: ${seg.mins} min"></div>`;
      legendHtml += `
        <span class="legend-item">
          <span class="legend-dot" style="background:${seg.color};"></span>
          ${seg.name}: ${seg.mins}${isZH?'分':'m'}
        </span>
      `;
    });

    const barHtml = `
      <div class="timeline-bar-wrapper">
        <div class="timeline-multi-bar">${barSegsHtml}</div>
        <div class="timeline-legend">${legendHtml}</div>
      </div>
    `;

    return { totalMins, barHtml };
  }

  /* 🚀 第二階段：全資訊專業展開版（網格結構化完整呈現） 🚀 */
  function showFullExpandedView(expId) {
    const exp = state.dataCenter.find(d => d.expId === expId);
    if (!exp) return;

    const isZH = state.currentLang === 'ZH';
    const styleObj = getStatusStyle(exp.status);
    const displayStatus = getStatusText(exp.status, state.currentLang);
    const formData = exp.formData || {};

    const modalDialog = document.getElementById('modalDialogBox');
    modalDialog.classList.add('expanded-mode');

    // 1. 全流程多段耗時計算
    const timeLogCalculations = calculateProcessTimeline(formData['_time_logs'] || {});

    // 2. 提取物理與動物參數
    const weightObj = getDynamicFieldValue(formData, ['體重', 'weight']);
    const doseObj = getDynamicFieldValue(formData, ['劑量', 'dose']);
    const freqObj = getDynamicFieldValue(formData, ['頻率', 'frequency']);
    const cycleObj = getDynamicFieldValue(formData, ['週期', 'cycle']);
    const voltObj = getDynamicFieldValue(formData, ['電壓', 'voltage']);

    const ratWeight = parseFloat(weightObj.val || 0);
    const ptzDose = parseFloat(doseObj.val || 1);
    const ptzVol = ratWeight > 0 ? (ratWeight * ptzDose).toFixed(1) : '--';
    const salineVol = ratWeight > 0 ? Math.max(0, 700 - ratWeight * ptzDose).toFixed(1) : '--';

    // 3. 立體定位座標
    const lamdaAP = formData['field_20_16'] || '0';
    const lamdaML = formData['field_19_16'] || '0';
    const eleAP = formData['field_16_16'] || '0';
    const eleML = formData['field_12_16'] || '0';
    const eleDH = formData['field_17_16'] || '0';

    // 4. 實驗過程狀況、特殊情況與犧牲摘除全抓取
    let conditionRowsHtml = '';

    const conditionConfigs = [
      { zh: '大鼠生理情況', en: 'Rat Physiological State', kw: ['生理', 'physiological'] },
      { zh: '手術過程狀況', en: 'Surgical Conditions', kw: ['手術', 'surgical', 'surgery'] },
      { zh: '電極插入狀況', en: 'Electrode Insertion State', kw: ['電極', 'electrode'] }
    ];

    conditionConfigs.forEach(cfg => {
      let fieldObj = getDynamicFieldValue(formData, cfg.kw);
      let itemArr = [];
      if (fieldObj.val && Array.isArray(fieldObj.val) && fieldObj.val.length > 0) {
        itemArr = [...fieldObj.val];
        const otherInput = formData[`${fieldObj.id}_input`] || '';
        itemArr = itemArr.map(item => item.includes('其他') ? (otherInput || (isZH ? '其他' : 'Other')) : formatBilingualText(item, state.currentLang));
      } else if (fieldObj.val && typeof fieldObj.val === 'string' && fieldObj.val.trim() !== '') {
        itemArr = [formatBilingualText(fieldObj.val, state.currentLang)];
      }

      const valStr = itemArr.length > 0 ? itemArr.join(', ') : (isZH ? '無特殊情況' : 'No special conditions');
      const textColor = itemArr.length > 0 ? 'var(--primary)' : 'var(--text-muted)';
      conditionRowsHtml += `<div class="detail-row"><div class="detail-label">${isZH ? cfg.zh : cfg.en}</div><div class="detail-value" style="color:${textColor}; font-weight:700;">${valStr}</div></div>`;
    });

    // 訊號蒐集情況
    let signalItems = [];
    Object.keys(formData).forEach(k => {
      if (k.endsWith('_20') && !['field_3_20', 'field_4_20', 'field_5_20', 'field_6_20'].includes(k)) {
        const val = formData[k];
        if (Array.isArray(val) && val.length > 0) {
          val.forEach(item => {
            const formatted = formatBilingualText(item, state.currentLang);
            if (!signalItems.includes(formatted)) signalItems.push(formatted);
          });
        } else if (typeof val === 'string' && val.trim() !== '' && !['on', 'true'].includes(val.trim().toLowerCase())) {
          const formatted = String(val).trim();
          if (!signalItems.includes(formatted)) signalItems.push(formatted);
        }
      }
    });
    const signalValStr = signalItems.length > 0 ? signalItems.join(', ') : (isZH ? '無特殊情況' : 'No special conditions');
    const signalTextColor = signalItems.length > 0 ? 'var(--primary)' : 'var(--text-muted)';
    conditionRowsHtml += `<div class="detail-row"><div class="detail-label">${isZH ? '訊號蒐集情況' : 'Signal Collection'}</div><div class="detail-value" style="color:${signalTextColor}; font-weight:700;">${signalValStr}</div></div>`;

    // 犧牲與組織摘除
    const sacrificeConfigs = [
      { zh: '犧牲方式', en: 'Sacrifice Method', kw: ['犧牲方式', '犧牲方法', 'sacrificemethod'], fallbackKeys: ['field_3_24'] },
      { zh: '犧牲情況', en: 'Sacrifice Condition', kw: ['犧牲情況', '犧牲狀況', '犧牲過程', '灌流狀況', '灌流情況', '灌流', 'sacrificestatus', 'sacrificedetail'], fallbackKeys: ['field_9_24'] },
      { zh: '本次摘除組織', en: 'Excised Tissue', kw: ['摘除組織', '摘取組織', '摘除器官', 'tissue', 'organ'], fallbackKeys: ['field_14_24'] },
      { zh: '摘除情況', en: 'Excision Condition', kw: ['摘除情況', '摘除狀況', '摘除過程', '組織情況', '組織狀況', '器官情況', 'excisionstatus', 'excisiondetail'], fallbackKeys: ['field_17_24'] },
      { zh: '保存方式', en: 'Preservation Method', kw: ['保存方式', '保存方法', '保存', 'preservation'], fallbackKeys: ['field_21_24'] }
    ];

    sacrificeConfigs.forEach(cfg => {
      let fieldObj = getDynamicFieldValue(formData, cfg.kw);
      let rawVal = fieldObj.val;
      if ((rawVal === null || rawVal === undefined) && cfg.fallbackKeys) {
        for (const fbKey of cfg.fallbackKeys) {
          if (formData[fbKey] !== undefined && formData[fbKey] !== '') { rawVal = formData[fbKey]; break; }
        }
      }

      if (rawVal !== null && rawVal !== undefined) {
        let displayStr = Array.isArray(rawVal) ? rawVal.map(v => formatBilingualText(v, state.currentLang)).filter(Boolean).join(', ') : formatBilingualText(rawVal, state.currentLang);
        if (displayStr.trim() !== '') {
          conditionRowsHtml += `<div class="detail-row"><div class="detail-label">${isZH ? cfg.zh : cfg.en}</div><div class="detail-value" style="color:var(--primary); font-weight:700;">${displayStr}</div></div>`;
        }
      }
    });

    // 5. 腦訊號蒐集區段時間軸動態解析
    let validStages = [];
    let totalBrainMin = 0;
    Object.keys(formData).forEach(k => {
      if (Array.isArray(formData[k]) && formData[k].length > 0) {
        formData[k].forEach(st => {
          if (st && st.name && st.time !== undefined) {
            const t = parseFloat(st.time) || 0;
            if (t > 0 && String(st.name).trim() !== '') {
              totalBrainMin += t;
              validStages.push({ name: String(st.name).trim(), time: t });
            }
          }
        });
      }
    });

    let brainTimelineHtml = '';
    if (totalBrainMin > 0) {
      const colors = ['#3b82f6', '#ef4444', '#10b981', '#8b5cf6', '#f59e0b', '#06b6d4', '#ec4899'];
      let barBarsHtml = '';
      let legendsHtml = '';
      validStages.forEach((st, idx) => {
        const color = colors[idx % colors.length];
        const pct = ((st.time / totalBrainMin) * 100).toFixed(1);
        barBarsHtml += `<div style="width:${pct}%; background:${color};" title="${st.name}: ${st.time}m"></div>`;
        legendsHtml += `<span style="color:${color};">■ ${st.name}: ${st.time}m</span>`;
      });

      brainTimelineHtml = `
        <div style="margin-top:6px;">
          <div style="font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:4px;">
            ${isZH ? '腦訊號搜集總長度' : 'Signal Duration'}: ${totalBrainMin} min
          </div>
          <div style="display:flex; width:100%; height:12px; border-radius:6px; overflow:hidden; border:1px solid #cbd5e1; background:#f1f5f9;">
            ${barBarsHtml}
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; font-size:10px; margin-top:6px; font-weight:600;">
            ${legendsHtml}
          </div>
        </div>
      `;
    } else {
      brainTimelineHtml = `<span style="color:var(--text-muted); font-size:11px;">${isZH ? '無紀錄腦訊號搜集區段' : 'No recorded signal stages'}</span>`;
    }

    // 6. 備註紀錄
    let notesArr = [];
    if (formData['notes'] && String(formData['notes']).trim() !== '') {
      notesArr.push(String(formData['notes']).trim());
    }
    let notesStr = notesArr.length > 0 ? notesArr.join('\n') : (isZH ? '無' : 'None');

    // 7. 數據資料夾連結 (Column W)
    const dataFolderHtml = exp.expDataFolder 
      ? `<a href="${exp.expDataFolder}" target="_blank" style="color:var(--primary); font-weight:700; text-decoration:none;">📁 ${isZH?'點擊開啟雲端數據資料夾':'Open Raw Data Folder'} ↗</a>`
      : `<span style="color:var(--text-muted); font-size:11px;">${isZH?'未上傳數據資料夾':'No data folder linked'}</span>`;

    const expandedHtml = `
      <div class="detail-list" style="max-height:75vh;">
        
        <!-- Header 識別標頭 -->
        <div style="background:#f1f5f9; padding:12px 16px; border-radius:var(--radius-md); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div>
            <span style="font-size:11px; color:var(--text-muted); font-weight:700;">ID:</span>
            <strong style="font-family:ui-monospace, monospace; color:var(--primary); font-size:15px; margin-left:4px;">${exp.expId}</strong>
          </div>
          <div>
            <span class="status-badge-lg" style="background:${styleObj.bg}; color:${styleObj.text}; border-color:${styleObj.border};">${displayStatus}</span>
          </div>
        </div>

        <!-- 面板 1：全流程總耗時間軸區 -->
        <div class="exp-panel" style="margin-bottom:12px;">
          <div class="exp-panel-title">${isZH?'實驗全流程時間軸與階段耗時':'Experiment Execution Timeline'}</div>
          <div style="font-size:11px; font-weight:700; color:var(--text-secondary); margin-bottom:4px;">
            ${isZH?'實驗總耗時':'Total Process Time'}: <span style="color:var(--primary); font-size:13px;">${timeLogCalculations.totalMins} ${isZH?'分鐘':'mins'}</span>
          </div>
          ${timeLogCalculations.barHtml}
        </div>

        <!-- 響應式雙欄結構化網格區 -->
        <div class="expanded-grid">
          
          <!-- 面板 2：物理與動物參數 -->
          <div class="exp-panel">
            <div class="exp-panel-title">${isZH?'動物劑量與物理參數':'Animal & Physical Parameters'}</div>
            <div class="detail-row"><div class="detail-label">${isZH?'大鼠體重':'Rat Weight'}</div><div class="detail-value">${ratWeight > 0 ? ratWeight + ' g' : '--'}</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'PTZ / Saline':'PTZ / Saline'}</div><div class="detail-value">${ptzVol} / ${salineVol} uL</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'超音波頻率':'US Frequency'}</div><div class="detail-value">${freqObj.val ? freqObj.val + ' HZ' : '--'}</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'週期 / 電壓':'Cycle / Volt'}</div><div class="detail-value">${cycleObj.val || '--'} / ${voltObj.val || '--'} mV</div></div>
          </div>

          <!-- 面板 3：立體定位與執行資訊 -->
          <div class="exp-panel">
            <div class="exp-panel-title">${isZH?'立體定位與電極座標':'Stereotaxic Coordinates'}</div>
            <div class="detail-row"><div class="detail-label">${isZH?'Lamda 座標':'Lamda Pos'}</div><div class="detail-value">(${lamdaAP}, ${lamdaML})</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'電極插入位置':'Electrode Pos'}</div><div class="detail-value">(${eleAP}, ${eleML}, ${eleDH})</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'負責人員':'Experimenter'}</div><div class="detail-value">${exp.user}</div></div>
            <div class="detail-row"><div class="detail-label">${isZH?'執行日期':'Date'}</div><div class="detail-value">${exp.date}</div></div>
          </div>

          <!-- 面板 4：實驗過程狀況與組織摘除 (Full Width) -->
          <div class="exp-panel full-width">
            <div class="exp-panel-title">${isZH?'實驗過程狀況與犧牲摘除紀錄':'Surgical Conditions & Organ Excision'}</div>
            ${conditionRowsHtml}
          </div>

          <!-- 面板 5：腦訊號蒐集時間軸 (Full Width) -->
          <div class="exp-panel full-width">
            <div class="exp-panel-title">${isZH?'腦訊號搜集區段時間軸':'Brain Signal Collection Stages'}</div>
            ${brainTimelineHtml}
          </div>

          <!-- 面板 6：備註與雲端數據資料夾 (Full Width) -->
          <div class="exp-panel full-width">
            <div class="exp-panel-title">${isZH?'備註與雲端數據資料夾 (Column W)':'Notes & Experimental Data Files'}</div>
            <div class="detail-row"><div class="detail-label">${isZH?'備註紀錄':'Notes'}</div><div class="detail-value" style="white-space:pre-line; text-align:left;">${notesStr}</div></div>
            <div style="padding-top:6px; font-size:12px;">
              ${dataFolderHtml}
            </div>
          </div>

        </div>

      </div>
    `;

    document.getElementById('modalTitle').innerText = isZH ? "完整實驗專案報告 (展開版)" : "Full Experiment Detailed Report";
    document.getElementById('modalMessage').innerHTML = expandedHtml;
    document.getElementById('modalBtnArea').innerHTML = `
      <button class="modal-btn-confirm" onclick="showActiveExpDetail('${exp.expId}')">⬅️ ${isZH?'返回精簡明細':'Back to Summary'}</button>
      <button class="modal-btn-confirm" style="background:var(--text-secondary); margin-top:6px;" onclick="closeCustomModal()">${isZH ? '關閉' : 'Close'}</button>
    `;
  }

  function closeCustomModal() { 
    document.getElementById('customModalBackdrop').style.display = 'none'; 
  }
</script>
</body>
</html>

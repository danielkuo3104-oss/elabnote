<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智慧實驗日誌 E-labnote</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #f0f9ff;
      
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      
      --border-color: #e2e8f0;
      --border-focus: #38bdf8;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { background-color: var(--bg-main); color: var(--text-primary); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }

    .app-container {
      width: 100%; max-width: 480px; background: var(--bg-main); min-height: 100vh;
      display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    /* 頂部 Header */
    .header {
      background: var(--card-bg); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10;
    }
    .header-title h1 { font-size: 17px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .header-title h1::before { content: ""; display: inline-block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
    .header-title h2 { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-left: 10px; }
    
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .user-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--text-secondary); background: #f1f5f9; border: 1px solid var(--border-color); cursor: pointer; }
    .lang-btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .update-time { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, monospace; display: flex; align-items: center; gap: 4px; }
    .refresh-icon { cursor: pointer; display: inline-block; transition: transform 0.3s; }
    .refresh-icon:active { transform: rotate(180deg); }

    .main-content { padding: 16px; flex: 1; overflow-y: auto; }

    .dashboard-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    .status-badge { background: #fef3c7; color: var(--warning); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; float: right; border: 1px solid #fde68a; }
    .schedule-item { display: flex; align-items: center; margin-top: 10px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
    .schedule-tag { border-radius: 4px; padding: 2px 8px; font-size: 11px; margin-right: 8px; font-weight: 600; font-family: ui-monospace, monospace; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn-action {
      padding: 14px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); font-weight: 600; font-size: 13px;
      cursor: pointer; text-align: center; transition: all 0.15s; background: var(--card-bg); color: var(--text-primary); box-shadow: var(--shadow-sm);
    }
    .btn-action:active { transform: translateY(1px); }
    .btn-disabled { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; background: #f1f5f9; color: var(--text-muted); }
    
    .btn-today { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .btn-tomorrow { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
    .btn-reserve { background: #ffffff; color: var(--text-primary); border-color: var(--border-color); }
    .btn-makeup { background: #fffbeb; color: #b45309; border-color: #fde68a; }

    .timeline-container { position: relative; padding-left: 20px; margin-top: 16px; }
    .timeline-line { position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--border-color); }
    .timeline-item { position: relative; margin-bottom: 14px; cursor: pointer; }
    .timeline-node { position: absolute; left: -19px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card-bg); box-shadow: 0 0 0 2px var(--primary); }
    .timeline-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .timeline-card.today { border-color: #93c5fd; background: #f0f9ff; }

    .fab {
      position: fixed; right: calc(50% - 220px); bottom: 24px; width: 48px; height: 48px;
      background: var(--text-primary); color: #fff; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 22px; cursor: pointer; border: none; box-shadow: var(--shadow-md); z-index: 10;
    }
    @media (max-width: 480px) { .fab { right: 20px; } }

    .fab-menu-overlay {
      position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(15, 23, 42, 0.3);
      backdrop-filter: blur(4px); display: none; flex-direction: column; justify-content: flex-end; align-items: flex-end; padding: 80px 20px; z-index: 9;
    }
    .fab-menu-item {
      background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 20px;
      margin-bottom: 10px; font-weight: 600; font-size: 13px; cursor: pointer; box-shadow: var(--shadow-md); color: var(--text-primary);
    }

    .custom-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px;
    }
    .custom-modal {
      background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 320px;
      padding: 20px; box-shadow: var(--shadow-md); text-align: center; border: 1px solid var(--border-color);
    }
    .custom-modal h3 { margin-bottom: 8px; font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .custom-modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; white-space: pre-line; text-align: center; line-height: 1.5; }
    .custom-modal-btns { display: flex; gap: 8px; justify-content: center; }
    .modal-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-weight: 600; font-size: 13px; cursor: pointer; }
    .modal-btn-confirm { background: var(--primary); color: #fff; border: none; }
    .modal-btn-cancel { background: var(--bg-main); color: var(--text-secondary); }

    /* 動態渲染表單 */
    .form-page-container {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--card-bg); z-index: 100; flex-direction: column;
    }
    .form-header { padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); }
    .form-body { flex: 1; display: flex; overflow: hidden; position: relative; }
    .form-sidebar { width: 95px; background: var(--bg-main); border-right: 1px solid var(--border-color); overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-bookmark { padding: 12px 8px; font-size: 11px; text-align: center; border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-muted); font-weight: 500; }
    .sidebar-bookmark.active { background: var(--card-bg); font-weight: 700; color: var(--primary); border-left: 3px solid var(--primary); }
    .form-content { flex: 1; padding: 16px; overflow-y: auto; }
    .form-footer { padding: 12px 16px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; background: var(--card-bg); }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; color: var(--text-primary); }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg-main); color: var(--text-primary); outline: none; }
    .form-control:focus { border-color: var(--border-focus); background: #fff; }
    
    .checkbox-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--text-primary); }
    .field-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
    .section-header { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 6px 10px; border-radius: 4px; margin: 12px 0 8px 0; }
    .warning-box { font-size: 11px; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 8px 10px; border-radius: var(--radius-sm); margin-top: 4px; }

    .auth-container {
      position: absolute; top:0; left:0; right:0; bottom:0; background: var(--card-bg); z-index: 200;
      padding: 24px; display: flex; flex-direction: column; justify-content: center; overflow-y: auto;
    }
    .auth-header-bar { display: flex; justify-content: flex-end; margin-bottom: 24px; padding-top: env(safe-area-inset-top, 10px); }
    .auth-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 24px; color: var(--text-primary); letter-spacing: -0.5px; }
    .auth-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-muted); }
    .auth-tab.active { border-bottom: 2px solid var(--primary); color: var(--primary); }

    .error-msg { color: var(--danger); font-size: 11px; font-weight: 600; margin-top: 6px; display: none; }
  </style>

  <link rel="icon" type="image/png" href="icon-2.0.png?v=2.0">
  <link rel="apple-touch-icon" href="icon-2.0.png?v=2.0">
  <link rel="manifest" href="manifest.json?v=2.0">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="e-Lab">
  <meta name="theme-color" content="#ffffff">
</head>
<body>

<div class="app-container">

  <!-- 1. 登入 / 註冊 頁面 -->
  <div id="authPage" class="auth-container">
    <div class="auth-header-bar">
      <button id="authLangBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
    </div>

    <div class="auth-title" id="txtAuthTitle">智慧實驗日誌 E-labnote</div>
    <div class="auth-tabs">
      <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">登入</div>
      <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">註冊</div>
    </div>

    <!-- 登入 Form -->
    <div id="loginForm">
      <div class="form-group">
        <label id="lblUserSelect">選擇會員帳號</label>
        <select id="selLoginUser" class="form-control">
          <option value="">同步會員中心資料中...</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lblPassword">識別密碼</label>
        <input type="password" id="txtLoginPwd" class="form-control" placeholder="請輸入密碼">
      </div>
      <button id="btnLoginSubmit" class="btn-action btn-tomorrow" style="width:100%; margin-top: 10px;" onclick="performLogin()">登入</button>
      <button id="btnGuestSubmit" class="btn-action btn-reserve" style="width:100%; margin-top:10px;" onclick="guestLogin()">訪客登入 (僅查看)</button>
    </div>

    <!-- 註冊 Form -->
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label id="lblRegName">會員名稱 (不可重複)</label>
        <input type="text" id="txtRegName" class="form-control" placeholder="例如：Daniel" oninput="checkDuplicateName()">
        <div id="msgDuplicateName" class="error-msg">⚠️ 此名稱已被使用，請更換其他名稱</div>
      </div>
      <div class="form-group">
        <label id="lblRegEmail">電子信箱</label>
        <input type="email" id="txtRegEmail" class="form-control" placeholder="user@gmail.com">
      </div>
      <div class="form-group">
        <label id="lblRegRole">身份別</label>
        <select id="selRegRole" class="form-control">
          <option value="協作會員">協作會員 (Collaborator)</option>
          <option value="一般會員">一般會員 (General Member)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lblRegPwd">設定識別密碼</label>
        <input type="password" id="txtRegPwd" class="form-control">
      </div>
      <div class="form-group">
        <label id="lblRegColor">個人代表色 (不可重複)</label>
        <select id="selRegColor" class="form-control">
        </select>
      </div>
      <div class="form-group">
        <label id="lblRegLang">預設介面語言</label>
        <select id="selRegLang" class="form-control">
          <option value="ZH">中文 (Traditional Chinese)</option>
          <option value="EN">English</option>
        </select>
      </div>
      <button id="btnRegisterSubmit" class="btn-action btn-tomorrow" style="width:100%;" onclick="performRegister()">註冊新帳號</button>
    </div>
  </div>

  <!-- 2. 主頁面 Header -->
  <div class="header">
    <div class="header-title">
      <h1 id="appTitle">智慧實驗日誌</h1>
      <h2>E-labnote</h2>
    </div>
    <div class="header-right">
      <div style="display:flex; gap:6px; align-items:center;">
        <div id="userBadge" class="user-badge" onclick="performLogout()" title="點擊登出">未登入</div>
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
      </div>
      <div class="update-time">
        <span id="txtUpdateTime">更新時間 : 載入中...</span>
        <span class="refresh-icon" title="一鍵刷新" onclick="refreshDashboard()">🔄</span>
      </div>
    </div>
  </div>

  <!-- 3. 主頁面內容 -->
  <div class="main-content">
    <div class="dashboard-card">
      <div id="statusBadge" class="status-badge" style="display:none;">--</div>
      <div id="txtCurrentExpUser" style="font-size:12px; font-weight:700; color:var(--primary); margin-bottom:4px; font-family:ui-monospace, monospace;">載入中...</div>
      <div id="txtCurrentExpTitle" style="font-size:14px; font-weight:700; color:var(--text-primary);">同步試算表資料中...</div>
      <hr style="margin:12px 0; border:0; border-top:1px solid var(--border-color);">
      
      <div id="scheduleSection" onclick="openScheduleCenter()">
        <div id="txtScheduleHeader" style="font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase;">未來排程 (最靠近兩筆)</div>
        <div id="scheduleList">
          <div class="schedule-item"><span class="schedule-tag">--</span><span>載入中...</span></div>
        </div>
      </div>
    </div>

    <div class="action-grid">
      <button id="btnTodayExp" class="btn-action btn-today" onclick="handleTodayExperiment()">今日實驗登錄</button>
      <button id="btnTomorrowPrep" class="btn-action btn-tomorrow" onclick="handleTomorrowPrep()">明日準備</button>
      <button id="btnReserveExp" class="btn-action btn-reserve" onclick="openForm('FORM_001_2')">實驗預約</button>
      <button id="btnMakeupExp" class="btn-action btn-makeup" onclick="openForm('FORM_001_1', true)">實驗補登</button>
    </div>

    <div id="timelineContainer" class="timeline-container" onclick="openRecordCenter()">
      <div class="timeline-line"></div>
    </div>
  </div>

  <div id="fabMenuOverlay" class="fab-menu-overlay" onclick="closeFabMenu()">
    <div class="fab-menu-item" id="menuSchedule" onclick="openScheduleCenter()">排程中心</div>
    <div class="fab-menu-item" id="menuRecord" onclick="openRecordCenter()">紀錄中心</div>
    <div class="fab-menu-item" id="menuProfile" onclick="openEditProfile()">更改個人資訊</div>
    <div class="fab-menu-item" id="menuLogout" style="color:var(--danger);" onclick="performLogout()">登出系統</div>
    <div class="fab-menu-item" id="menuClose" style="color:var(--text-muted);" onclick="closeFabMenu()">關閉</div>
  </div>
  <div class="fab" onclick="toggleFabMenu()">+</div>

  <div id="formPageContainer" class="form-page-container">
    <div class="form-header" id="formHeader">
      <h3 id="formTitle" style="font-size: 15px; font-weight: 700;">表單名稱</h3>
      <button style="border:none; background:transparent; font-size:18px; cursor:pointer;" onclick="closeFormPage()">❌</button>
    </div>
    <div class="form-body">
      <div id="formSidebar" class="form-sidebar"></div>
      <div id="formContent" class="form-content"></div>
    </div>
    <div class="form-footer">
      <button id="btnFormPrev" class="modal-btn" onclick="prevFormPage()">上一頁</button>
      <button id="btnFormNext" class="modal-btn modal-btn-confirm" onclick="nextFormPage()">下一頁</button>
    </div>
  </div>

  <div id="customModalBackdrop" class="custom-modal-backdrop">
    <div class="custom-modal">
      <h3 id="modalTitle">系統提示</h3>
      <p id="modalMessage">提示內容</p>
      <div id="modalBtnGroup" class="custom-modal-btns">
        <button id="btnModalConfirm" class="modal-btn modal-btn-confirm" onclick="closeCustomModal(true)">確定</button>
      </div>
    </div>
  </div>

</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwvsd4fRN4qgWBL2ku7E_r-DekIiVtikpvjyVLRqOiGWPPb1sts3Mj10bMiX9n_zoO1tw/exec";
  
  const URL_MEMBERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=280963157&single=true&output=csv";
  const URL_FORMS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=0&single=true&output=csv";
  const URL_DATA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=301837161&single=true&output=csv";

  const PRESET_COLORS = [
    { name: "天藍色 (Sky Blue)", hex: "#e0f2fe" },
    { name: "薄荷綠 (Mint Green)", hex: "#dcfce7" },
    { name: "珊瑚粉 (Coral Pink)", hex: "#ffedd5" },
    { name: "紫羅蘭 (Violet)", hex: "#f3e8ff" },
    { name: "檸檬黃 (Lemon Yellow)", hex: "#fef9c3" }
  ];

  let state = {
    currentUser: null,
    isGuest: false,
    currentLang: "ZH",
    simulatedDate: "2026-07-25",
    membersList: [],
    dataCenter: [],
    formDataCache: {},
    dynamicForms: {}
  };

  window.addEventListener('DOMContentLoaded', async () => {
    applyLanguage();
    await fetchAndParseFormsFromSheet();
    await refreshDashboard();
  });

  async function refreshDashboard() {
    const now = new Date();
    document.getElementById('txtUpdateTime').innerText = `${state.currentLang==='ZH'?'更新':'Updated'}: ${state.simulatedDate} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

    await fetchMembersFromSheet();
    await fetchDataCenterFromSheet();

    renderMainDashboardUI();
    renderTimeline();
    updateDashboardButtons();
  }

  // 全能 Google 試算表表單動態解析器
  async function fetchAndParseFormsFromSheet() {
    try {
      const res = await fetch(URL_FORMS);
      const csvText = await res.text();
      const rows = parseCSV(csvText);

      if (rows.length < 2) return;

      const headerRow = rows[0];
      const formBlocks = [];

      for (let colIdx = 0; colIdx < headerRow.length; colIdx++) {
        const cellVal = (headerRow[colIdx] || "").trim();
        if (cellVal.startsWith("FORM_")) {
          formBlocks.push({
            formId: cellVal,
            startCol: colIdx
          });
        }
      }

      const parsedForms = {};

      formBlocks.forEach(block => {
        const formId = block.formId;
        const col = block.startCol;
        
        const pages = [];
        let currentPage = null;
        let lastParentField = null;

        for (let r = 2; r < rows.length; r++) {
          const rawLabel = (rows[r][col] || "").trim();
          const rawType = (rows[r][col + 1] || "").trim();
          const rawOption = (rows[r][col + 2] || "").trim();
          const rawDesc = (rows[r][col + 3] || "").trim();

          if (!rawLabel && !rawType) continue;

          // 1. 分頁解析 【...】[Page X]
          if (rawLabel.includes("【") && rawLabel.includes("】")) {
            const pageTitle = rawLabel.replace(/【|】/g, "").trim();
            currentPage = { title: pageTitle, fields: [] };
            pages.push(currentPage);
            lastParentField = null;
            continue;
          }

          if (!currentPage) {
            currentPage = { title: "Page 1 基本資訊", fields: [] };
            pages.push(currentPage);
          }

          // 2. 區塊標題 [#]
          if (rawType.includes("[#]")) {
            currentPage.fields.push({
              type: "section",
              label: rawLabel
            });
            lastParentField = null;
            continue;
          }

          // 3. 單選題 [radio]
          if (rawType.includes("[radio]")) {
            lastParentField = {
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: "radio",
              options: []
            };
            currentPage.fields.push(lastParentField);
          } 
          // 4. 多選題組 [checkbox_group]
          else if (rawType.includes("[checkbox_group]")) {
            lastParentField = {
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: "checkbox_group",
              options: []
            };
            currentPage.fields.push(lastParentField);
          }
          // 5. 子選項 [option] 或帶有輸入框子選項 [option_input]
          else if ((rawType.includes("[option]") || rawType.includes("[option_input]")) && lastParentField) {
            const optName = rawLabel.replace(/^-\s*/, '');
            const hasInput = rawType.includes("[option_input]");
            
            // 提取跳頁/提交動作，如 [goto: Page 2] 或 [submit]
            let action = null;
            if (rawType.includes("[goto:")) {
              const match = rawType.match(/\[goto:\s*(Page\s*\d+)\]/i);
              if (match) action = { type: "goto", target: match[1] };
            } else if (rawType.includes("[submit]")) {
              action = { type: "submit" };
            }

            // 提取狀態變更指令，如 [status: 登錄狀態-休息中]
            let statusTag = null;
            if (rawType.includes("[status:")) {
              const match = rawType.match(/\[status:\s*([^\]]+)\]/i);
              if (match) statusTag = match[1];
            }

            lastParentField.options.push({
              name: optName,
              hasInput: hasInput,
              action: action,
              statusTag: statusTag,
              placeholder: rawType.match(/\[placeholder:\s*([^\]]+)\]/)?.[1] || "請說明..."
            });
          } 
          // 6. 一般核對框 [c]
          else if (rawType.includes("[c]") || rawType.includes("[checkbox]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel.replace(/^-\s*/, ''),
              type: "checkbox",
              desc: rawDesc,
              warning: rawType.includes("[warning]") ? rawType.split("[warning]")[1]?.trim() : null
            });
            lastParentField = null;
          } 
          // 7. 公式列 [formula]
          else if (rawType.includes("[formula]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: "formula",
              formulaStr: rawType.match(/\[formula:\s*([^\]]+)\]/)?.[1] || "",
              unit: rawType.match(/\[unit:\s*([^\]]+)\]/)?.[1] || ""
            });
            lastParentField = null;
          }
          // 8. 會員下拉選單 [v] \會員中心\A2:A
          else if (rawType.includes("[v]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: "user_select",
              default: state.currentUser ? state.currentUser.name : "Daniel"
            });
            lastParentField = null;
          }
          // 9. 數據輸入框 [number] / [text] / [datetime]
          else if (rawType.includes("[number]") || rawType.includes("[text]") || rawType.includes("[datetime]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: rawType.includes("[number]") ? "number" : "text",
              default: rawType.match(/\[default:\s*([^\]]+)\]/)?.[1] || (rawLabel.includes("日期") ? state.simulatedDate : ""),
              unit: rawType.match(/\[unit:\s*([^\]]+)\]/)?.[1] || "",
              placeholder: rawType.match(/\[placeholder:\s*([^\]]+)\]/)?.[1] || "",
              desc: rawDesc
            });
            lastParentField = null;
          }
          // 10. 資料庫連動詳情 [fetch_detail]
          else if (rawType.includes("[fetch_detail]") || rawType.includes("fetch_detail:")) {
            const detailKey = rawType.match(/\[fetch_detail:\s*([^\]]+)\]/)?.[1] || rawOption;
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: "fetch_detail",
              detailKey: detailKey
            });
            lastParentField = null;
          }
        }

        parsedForms[formId] = pages;
      });

      state.dynamicForms = parsedForms;
    } catch (err) {
      console.error("動態解析表單中心失敗:", err);
    }
  }

  function getFormStructure(formId) {
    if (state.dynamicForms && state.dynamicForms[formId]) {
      return state.dynamicForms[formId];
    }
    return [{ title: "Page 1 基本資訊", fields: [{ id: "fallback_1", label: "同步試算表中...", type: "checkbox" }] }];
  }

  async function fetchMembersFromSheet() {
    try {
      const res = await fetch(URL_MEMBERS);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      
      const members = [];
      for(let i = 1; i < rows.length; i++) {
        if(rows[i][0]) {
          members.push({
            name: rows[i][0].trim(),
            email: rows[i][1] ? rows[i][1].trim() : '',
            color: rows[i][3] ? rows[i][3].trim() : '#f1f5f9',
            role: rows[i][4] ? rows[i][4].trim() : '協作會員',
            password: rows[i][5] ? rows[i][5].trim() : '',
            lang: rows[i][6] ? rows[i][6].trim() : 'ZH'
          });
        }
      }
      state.membersList = members;
      initAuthDropdown();
      initColorDropdown();
    } catch(err) {
      console.error("同步會員中心失敗:", err);
    }

  function performLogin() {
    const selectedName = document.getElementById('selLoginUser').value;
    const inputPwd = document.getElementById('txtLoginPwd').value.trim();
    const user = state.membersList.find(m => m.name === selectedName);

    if (!user) {
      showCustomAlert(state.currentLang === 'ZH' ? "提示" : "Alert", state.currentLang === 'ZH' ? "請選擇會員帳號" : "Select an account");
      return;
    }

    if (user.password && inputPwd !== user.password) {
      showCustomAlert(state.currentLang === 'ZH' ? "登入失敗" : "Login Failed", state.currentLang === 'ZH' ? "識別密碼錯誤，請重新輸入！" : "Incorrect password.");
      return;
    }

    state.currentUser = user;
    state.isGuest = false;
    state.currentLang = user.lang || "ZH";
    document.getElementById('authPage').style.display = 'none';
    
    const badge = document.getElementById('userBadge');
    badge.innerText = user.name;
    badge.style.background = user.color || '#f1f5f9';

    applyLanguage();
    refreshDashboard();
    
    showCustomAlert(state.currentLang === 'ZH' ? "登入成功" : "Welcome", state.currentLang === 'ZH' ? `歡迎回來，${user.name}！` : `Welcome back, ${user.name}!`);

    switch(todayExp.status) {

  // 表單渲染器：精準渲染試算表定義的所有題型
  function renderFormCurrentPage() {
    const page = currentFormCtx.pages[currentFormCtx.currentPageIdx];
    const container = document.getElementById('formContent');

    let html = `<h4 style="margin-bottom:16px; font-size:13px; color:var(--text-primary); font-weight:700;">${page.title}</h4>`;

    page.fields.forEach(field => {
      const val = currentFormCtx.data[field.id] || field.default || "";

      if (field.type === "section") {
        html += `<div class="section-header">${field.label}</div>`;
      }
      else if (field.type === "user_select") {
        html += `
          <div class="form-group">
            <label>${field.label}</label>
            <select class="form-control" onchange="saveFormFieldData('${field.id}', this.value)">
              ${state.membersList.map(m => `<option value="${m.name}" ${val === m.name ? 'selected' : ''}>${m.name}</option>`).join('')}
            </select>
          </div>
        `;
      }
      else if (field.type === "text" || field.type === "number") {
        html += `
          <div class="form-group">
            <label>${field.label} ${field.unit ? `(${field.unit})` : ''}</label>
            <input type="${field.type}" class="form-control" value="${val}" placeholder="${field.placeholder || ''}" oninput="saveFormFieldData('${field.id}', this.value)">
            ${field.desc ? `<div class="field-desc">${field.desc}</div>` : ''}
          </div>
        `;
      }
      else if (field.type === "formula") {
        html += `
          <div class="form-group" style="background:var(--primary-light); padding:10px; border-radius:var(--radius-sm);">
            <label style="color:var(--primary);">${field.label}</label>
            <div style="font-size:14px; font-weight:700; color:var(--text-primary);" id="calc_${field.id}">${val || '根據公式自動計算...'} ${field.unit}</div>
          </div>
        `;
      }
      else if (field.type === "checkbox") {
        const checked = currentFormCtx.data[field.id] ? 'checked' : '';
        html += `
          <div class="checkbox-item">
            <input type="checkbox" id="${field.id}" ${checked} onchange="saveFormFieldData('${field.id}', this.checked)">
            <div>
              <label for="${field.id}">${field.label}</label>
              ${field.desc ? `<div class="field-desc">${field.desc}</div>` : ''}
              ${field.warning ? `<div class="warning-box">${field.warning}</div>` : ''}
            </div>
          </div>
        `;
      }
      else if (field.type === "radio") {
        html += `<div class="form-group"><label>${field.label}</label>`;
        field.options.forEach((opt, idx) => {
          const optName = typeof opt === 'string' ? opt : opt.name;
          const checked = val === optName ? 'checked' : '';
          const optId = `${field.id}_opt_${idx}`;
          
          html += `
            <div style="margin-bottom:8px; font-size:13px;">
              <input type="radio" name="${field.id}" id="${optId}" value="${optName}" ${checked} onchange="handleRadioSelect('${field.id}', '${optName}', ${JSON.stringify(opt.action || null)}, '${opt.statusTag || ''}')">
              <label for="${optId}">${optName}</label>
              ${opt.hasInput ? `<input type="text" class="form-control" style="margin-top:4px;" placeholder="${opt.placeholder || ''}" oninput="saveFormFieldData('${field.id}_input', this.value)">` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }
      else if (field.type === "checkbox_group") {
        html += `<div class="form-group"><label>${field.label}</label>`;
        field.options.forEach((opt, idx) => {
          const optName = typeof opt === 'string' ? opt : opt.name;
          const isChecked = currentFormCtx.data[field.id] && currentFormCtx.data[field.id].includes(optName);
          
          html += `
            <div class="checkbox-item">
              <input type="checkbox" id="${field.id}_${idx}" ${isChecked ? 'checked' : ''} onchange="handleCheckboxGroupSelect('${field.id}', '${optName}', this.checked)">
              <div>
                <label for="${field.id}_${idx}">${optName}</label>
                ${opt.hasInput ? `<input type="text" class="form-control" style="margin-top:4px;" placeholder="${opt.placeholder || ''}" oninput="saveFormFieldData('${field.id}_input', this.value)">` : ''}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      else if (field.type === "fetch_detail") {
        const detailText = calculateFetchDetail(field.detailKey);
        html += `
          <div class="form-group" style="background:#fffbeb; padding:12px; border-radius:var(--radius-sm); border:1px solid #fde68a;">
            <label style="color:#b45309;">${field.label}</label>
            <pre style="font-size:12px; background:#fff; padding:8px; border-radius:4px; color:var(--text-primary); margin-top:6px;">${detailText}</pre>
          </div>
        `;
      }
    });

    container.innerHTML = html;

    document.getElementById('btnFormPrev').style.display = currentFormCtx.currentPageIdx === 0 ? 'none' : 'inline-block';
    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;
    document.getElementById('btnFormNext').innerText = (isLastPage || (currentFormCtx.selectedAction && currentFormCtx.selectedAction.type === 'submit')) ? (state.currentLang==='ZH'?'提交':'Submit') : (state.currentLang==='ZH'?'下一頁':'Next');
  }

  function handleRadioSelect(fieldId, val, action, statusTag) {
    saveFormFieldData(fieldId, val);
    currentFormCtx.selectedAction = action;
    if (statusTag) currentFormCtx.selectedStatusTag = statusTag;
    
    // 更新「下一頁 / 提交」按鈕文字
    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;
    document.getElementById('btnFormNext').innerText = (isLastPage || (action && action.type === 'submit')) ? (state.currentLang==='ZH'?'提交':'Submit') : (state.currentLang==='ZH'?'下一頁':'Next');
  }

  function handleCheckboxGroupSelect(fieldId, val, isChecked) {
    if (!currentFormCtx.data[fieldId]) currentFormCtx.data[fieldId] = [];
    if (isChecked) {
      if (!currentFormCtx.data[fieldId].includes(val)) currentFormCtx.data[fieldId].push(val);
    } else {
      currentFormCtx.data[fieldId] = currentFormCtx.data[fieldId].filter(v => v !== val);
    }
    state.formDataCache[currentFormCtx.formId] = currentFormCtx.data;
  }

  function saveFormFieldData(fieldId, val) {
    currentFormCtx.data[fieldId] = val;
    state.formDataCache[currentFormCtx.formId] = currentFormCtx.data;
  }

  function prevFormPage() {
    if(currentFormCtx.currentPageIdx > 0) {
      currentFormCtx.currentPageIdx--;
      renderFormSidebar();
      renderFormCurrentPage();
    }
  }

  function nextFormPage() {
    // 判斷單選題帶出的條件跳頁或提交動作
    if (currentFormCtx.selectedAction) {
      if (currentFormCtx.selectedAction.type === 'submit') {
        submitFormFinal();
        return;
      }
      else if (currentFormCtx.selectedAction.type === 'goto') {
        const targetPageTitle = currentFormCtx.selectedAction.target; // 例如 "Page 2"
        const targetIdx = currentFormCtx.pages.findIndex(p => p.title.toLowerCase().includes(targetPageTitle.toLowerCase()));
        if (targetIdx !== -1) {
          currentFormCtx.currentPageIdx = targetIdx;
          renderFormSidebar();
          renderFormCurrentPage();
          return;
        }
      }
    }

    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;
    if (isLastPage) {
      submitFormFinal();
    } else {
      currentFormCtx.currentPageIdx++;
      renderFormSidebar();
      renderFormCurrentPage();
    }
  }

  function jumpToFormPage(idx) {
    currentFormCtx.currentPageIdx = idx;
    renderFormSidebar();
    renderFormCurrentPage();
  }

  function closeFormPage() {
    document.getElementById('formPageContainer').style.display = 'none';
  }

  async function submitFormFinal() {
    const todayExp = state.dataCenter.find(d => d.date === state.simulatedDate);
    let targetStatus = currentFormCtx.selectedStatusTag || "已完成";

    await syncToGoogleSheet("submitForm", {
      date: state.simulatedDate,
      user: state.currentUser ? state.currentUser.name : "Daniel",
      status: targetStatus,
      info: "Vortex gut–brain stimulation -VUS刺激",
      formData: currentFormCtx.data
    });

    if(todayExp) todayExp.status = targetStatus;

    closeFormPage();
    await refreshDashboard();
    showCustomAlert("提交成功 / Submitted", `表單已成功寫入 Google 試算表！\n實驗狀態更變為：[${targetStatus}]`);
  }

  function calculateFetchDetail(key) {
    const exp = state.dataCenter.find(d => d.date === state.simulatedDate) || state.dataCenter[0] || {};
    if(key === "O2_and_Isoflurane_usage") {
      return `O2：${exp.O2_init || 160}→120\nIsoflurane：${exp.Iso_init || 500.23}→485.54`;
    } 
    else if(key === "NaCl_and_Isoflurane_usage") {
      return `NaCl：${exp.user || 'Daniel'}, July 25, 9g\nIsoflurane：${exp.user || 'Daniel'}, July 25, 14.69g`;
    }
    return "尚無資料";
  }

  function showCustomAlert(title, message) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalBtnGroup').innerHTML = `
      <button class="modal-btn modal-btn-confirm" onclick="closeCustomModal(true)">${state.currentLang==='ZH'?'確定':'OK'}</button>
    `;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  function showCustomConfirm(title, message, cancelText, confirmText, callback) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalBtnGroup').innerHTML = `
      <button class="modal-btn modal-btn-cancel" onclick="handleConfirmChoice(false)">${cancelText}</button>
      <button class="modal-btn modal-btn-confirm" onclick="handleConfirmChoice(true)">${confirmText}</button>
    `;
    window.confirmCallback = callback;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  function handleConfirmChoice(choice) {
    document.getElementById('customModalBackdrop').style.display = 'none';
    if(window.confirmCallback) window.confirmCallback(choice);
  }

  function closeCustomModal() {
    document.getElementById('customModalBackdrop').style.display = 'none';
  }

  function toggleFabMenu() {
    const overlay = document.getElementById('fabMenuOverlay');
    overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
  }

  function closeFabMenu() {
    document.getElementById('fabMenuOverlay').style.display = 'none';
  }

  function openScheduleCenter() { closeFabMenu(); showCustomAlert("排程中心 / Schedule", "開啟排程中心面板。"); }
  function openRecordCenter() { closeFabMenu(); showCustomAlert("紀錄中心 / Record", "開啟實驗紀錄中心面板。"); }
  function openEditProfile() {
    closeFabMenu();
    if(state.currentUser) {
      showCustomAlert("個人資訊 / Profile", `會員姓名 : ${state.currentUser.name}\nEmail : ${state.currentUser.email}\n身份 : ${state.currentUser.role}`);
    }
  }
</script>
</body>
</html>

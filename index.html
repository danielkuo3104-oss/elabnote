<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧實驗日誌 E-labnote</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --primary-blue: #3498db;
      --color-form1: #e8f4f8;
      --color-form2: #e8f8f5;
      --color-form3: #fadbd8;
      --color-form4: #fdebd0;
      --color-form5: #f2f4f4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 10px; }

    .app-container {
      width: 100%; max-width: 480px; background: #fff; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; position: relative; min-height: 92vh;
      display: flex; flex-direction: column;
    }

    .header {
      background: #bce0fd; padding: 15px 20px; display: flex; justify-content: space-between; align-items: flex-start;
      border-bottom: 2px solid #2c3e50;
    }
    .header-title h1 { font-size: 20px; font-weight: bold; color: #000; }
    .header-title h2 { font-size: 16px; color: #333; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .user-badge { padding: 3px 12px; border-radius: 12px; border: 1px solid #333; font-size: 13px; font-weight: bold; }
    .lang-btn { background: #dcdde1; border: 1px solid #333; border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
    .update-time { font-size: 11px; color: #555; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .refresh-icon { cursor: pointer; display: inline-block; transition: transform 0.3s; }
    .refresh-icon:hover { transform: rotate(180deg); }

    .main-content { padding: 15px; flex: 1; overflow-y: auto; }

    .dashboard-card { border: 2px solid #000; border-radius: 16px; padding: 12px; margin-bottom: 15px; background: #fff; }
    .status-badge { background: #f39c12; color: #000; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; float: right; }
    .schedule-item { display: flex; align-items: center; margin-top: 8px; font-size: 13px; color: #666; cursor: pointer; }
    .schedule-tag { border: 1px solid #333; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-right: 8px; font-weight: bold; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn-action {
      padding: 12px; border-radius: 20px; border: 2px solid #000; font-weight: bold; font-size: 14px;
      cursor: pointer; text-align: center; transition: opacity 0.2s, transform 0.1s;
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-disabled { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; }
    .btn-today { background: #c5e1a5; }
    .btn-tomorrow { background: #80cbc4; }
    .btn-reserve { background: #e0e0e0; }
    .btn-makeup { background: #ffcc80; }

    .timeline-container { position: relative; padding-left: 30px; margin-top: 10px; }
    .timeline-line { position: absolute; left: 12px; top: 0; bottom: 0; width: 4px; background: #000; }
    .timeline-item { position: relative; margin-bottom: 15px; cursor: pointer; }
    .timeline-node { position: absolute; left: -24px; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: #0288d1; border: 2px solid #000; }
    .timeline-card { background: #fff; border-radius: 12px; padding: 10px 12px; border: 1px solid #ccc; }
    .timeline-card.today { background: #fff9c4; border: 2px solid #fbc02d; }

    .fab {
      position: absolute; right: 20px; bottom: 20px; width: 50px; height: 50px;
      background: #555; color: #fff; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 28px; cursor: pointer; border: 2px solid #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .fab-menu-overlay {
      position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.8);
      backdrop-filter: blur(5px); display: none; flex-direction: column; justify-content: flex-end;
      align-items: flex-end; padding: 80px 20px; z-index: 9;
    }
    .fab-menu-item {
      background: #fff; border: 2px solid #000; border-radius: 20px; padding: 10px 20px;
      margin-bottom: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .custom-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; z-index: 999;
    }
    .custom-modal {
      background: #fff; border: 2px solid #000; border-radius: 16px; width: 85%; max-width: 360px;
      padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
    }
    .custom-modal h3 { margin-bottom: 10px; font-size: 18px; color: #e74c3c; }
    .custom-modal p { font-size: 14px; color: #333; margin-bottom: 15px; white-space: pre-line; text-align: left; }
    .custom-modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #000; font-weight: bold; cursor: pointer; }
    .modal-btn-confirm { background: #2ecc71; color: #fff; }
    .modal-btn-cancel { background: #e74c3c; color: #fff; }

    .form-page-container {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #fff; z-index: 100; flex-direction: column;
    }
    .form-header { padding: 15px; border-bottom: 2px solid #000; display: flex; justify-content: space-between; align-items: center; }
    .form-body { flex: 1; display: flex; overflow: hidden; position: relative; }
    .form-sidebar { width: 80px; background: #f0f0f0; border-right: 1px solid #ccc; overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-bookmark { padding: 10px 5px; font-size: 11px; text-align: center; border-bottom: 1px solid #ddd; cursor: pointer; color: #555; }
    .sidebar-bookmark.active { background: #fff; font-weight: bold; color: #000; border-left: 4px solid #3498db; }
    .form-content { flex: 1; padding: 15px; overflow-y: auto; }
    .form-footer { padding: 12px; border-top: 1px solid #ccc; display: flex; justify-content: space-between; background: #fafafa; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
    .form-control { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .checkbox-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .field-desc { font-size: 11px; color: #7f8c8d; margin-top: 2px; line-height: 1.3; }

    .test-panel {
      position: absolute; bottom: 0; left: 0; right: 0; background: #34495e; color: #fff;
      padding: 8px 12px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; z-index: 50;
    }
    .test-panel input { padding: 2px 4px; border-radius: 4px; border: none; font-size: 11px; }

    .auth-container {
      position: absolute; top:0; left:0; right:0; bottom:0; background: #fff; z-index: 200;
      padding: 30px 20px; display: flex; flex-direction: column; justify-content: center;
    }
    .auth-title { font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px; }
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ccc; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; }
    .auth-tab.active { border-bottom: 3px solid #3498db; color: #3498db; }

    .error-msg { color: #e74c3c; font-size: 11px; font-weight: bold; margin-top: 4px; display: none; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- 1. 登入 / 註冊 遮罩頁面 (雙軌語系) -->
  <div id="authPage" class="auth-container">
    <div style="position: absolute; top: 15px; right: 20px;">
      <button id="authLangBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
    </div>

    <div class="auth-title" id="txtAuthTitle">智慧實驗日誌 E-labnote</div>
    <div class="auth-tabs">
      <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">登入</div>
      <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">註冊</div>
    </div>

    <!-- 登入 Form -->
    <div id="loginForm">
      <div class="form-group">
        <label id="lblUserSelect">選擇會員帳號</label>
        <select id="selLoginUser" class="form-control">
          <option value="">同步會員中心資料中...</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lblPassword">識別密碼</label>
        <input type="password" id="txtLoginPwd" class="form-control" placeholder="請輸入密碼">
      </div>
      <button id="btnLoginSubmit" class="btn-action btn-today" style="width:100%;" onclick="performLogin()">登入</button>
      <button id="btnGuestSubmit" class="btn-action btn-reserve" style="width:100%; margin-top:10px;" onclick="guestLogin()">訪客登入 (僅查看)</button>
    </div>

    <!-- 註冊 Form -->
    <div id="registerForm" style="display:none;">
      <div class="form-group">
        <label id="lblRegName">會員名稱 (不可重複)</label>
        <input type="text" id="txtRegName" class="form-control" placeholder="例如：Daniel" oninput="checkDuplicateName()">
        <div id="msgDuplicateName" class="error-msg">⚠️ 此名稱已被使用，請更換其他名稱</div>
      </div>
      <div class="form-group">
        <label id="lblRegEmail">電子信箱</label>
        <input type="email" id="txtRegEmail" class="form-control" placeholder="user@gmail.com">
      </div>
      <div class="form-group">
        <label id="lblRegRole">身份別</label>
        <select id="selRegRole" class="form-control">
          <option value="協作會員">協作會員 (Collaborator)</option>
          <option value="一般會員">一般會員 (General Member)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lblRegPwd">設定識別密碼</label>
        <input type="password" id="txtRegPwd" class="form-control">
      </div>
      <div class="form-group">
        <label id="lblRegColor">個人代表色 (不可重複)</label>
        <select id="selRegColor" class="form-control">
        </select>
      </div>
      <div class="form-group">
        <label id="lblRegLang">預設介面語言</label>
        <select id="selRegLang" class="form-control">
          <option value="ZH">中文 (Traditional Chinese)</option>
          <option value="EN">English</option>
        </select>
      </div>
      <button id="btnRegisterSubmit" class="btn-action btn-tomorrow" style="width:100%;" onclick="performRegister()">註冊新帳號</button>
    </div>
  </div>

  <!-- 2. 主頁面 Header -->
  <div class="header">
    <div class="header-title">
      <h1 id="appTitle">智慧實驗日誌</h1>
      <h2>E-labnote</h2>
    </div>
    <div class="header-right">
      <div style="display:flex; gap:5px; align-items:center;">
        <div id="userBadge" class="user-badge" style="background:#e0e0e0;">未登入</div>
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
      </div>
      <div class="update-time">
        <span id="txtUpdateTime">更新時間 : 載入中...</span>
        <span class="refresh-icon" title="一鍵刷新" onclick="refreshDashboard()">🔄</span>
      </div>
    </div>
  </div>

  <!-- 3. 主頁面內容 -->
  <div class="main-content">
    <div class="dashboard-card">
      <div id="statusBadge" class="status-badge" style="display:none;">--</div>
      <div id="txtCurrentExpUser" style="font-size:12px; font-weight:bold; color:#3498db; margin-bottom:4px;">載入中...</div>
      <div id="txtCurrentExpTitle" style="font-size:14px; font-weight:bold;">同步試算表資料中...</div>
      <hr style="margin:10px 0; border:0; border-top:1px solid #eee;">
      
      <div id="scheduleSection" onclick="openScheduleCenter()">
        <div id="txtScheduleHeader" style="font-size:12px; font-weight:bold; color:#888; margin-bottom:4px;">未來排程 (最靠近兩筆)</div>
        <div id="scheduleList">
          <div class="schedule-item"><span class="schedule-tag">--</span><span>載入中...</span></div>
        </div>
      </div>
    </div>

    <div class="action-grid">
      <button id="btnTodayExp" class="btn-action btn-today" onclick="handleTodayExperiment()">今日實驗登錄</button>
      <button id="btnTomorrowPrep" class="btn-action btn-tomorrow" onclick="handleTomorrowPrep()">明日準備</button>
      <button id="btnReserveExp" class="btn-action btn-reserve" onclick="openForm('FORM_001_2')">實驗預約</button>
      <button id="btnMakeupExp" class="btn-action btn-makeup" onclick="openForm('FORM_001_1', true)">實驗補登</button>
    </div>

    <div id="timelineContainer" class="timeline-container" onclick="openRecordCenter()">
      <div class="timeline-line"></div>
    </div>
  </div>

  <div id="fabMenuOverlay" class="fab-menu-overlay" onclick="closeFabMenu()">
    <div class="fab-menu-item" id="menuSchedule" onclick="openScheduleCenter()">排程中心</div>
    <div class="fab-menu-item" id="menuRecord" onclick="openRecordCenter()">紀錄中心</div>
    <div class="fab-menu-item" id="menuProfile" onclick="openEditProfile()">更改個人資訊</div>
    <div class="fab-menu-item" id="menuClose" style="background:#e74c3c; color:#fff;" onclick="closeFabMenu()">關閉</div>
  </div>
  <div class="fab" onclick="toggleFabMenu()">+</div>

  <div id="testPanel" class="test-panel">
    <span>[測試面板] 系統時間:</span>
    <input type="date" id="testDateInput" value="2026-07-25" onchange="onTestDateChange()">
    <span style="cursor:pointer;" onclick="toggleTestPanel(false)">❌</span>
  </div>

  <div id="formPageContainer" class="form-page-container">
    <div class="form-header" id="formHeader">
      <h3 id="formTitle">表單名稱</h3>
      <button style="border:none; background:transparent; font-size:18px; cursor:pointer;" onclick="closeFormPage()">❌</button>
    </div>
    <div class="form-body">
      <div id="formSidebar" class="form-sidebar"></div>
      <div id="formContent" class="form-content"></div>
    </div>
    <div class="form-footer">
      <button id="btnFormPrev" class="modal-btn" onclick="prevFormPage()">上一頁</button>
      <button id="btnFormNext" class="modal-btn modal-btn-confirm" onclick="nextFormPage()">下一頁</button>
    </div>
  </div>

  <div id="customModalBackdrop" class="custom-modal-backdrop">
    <div class="custom-modal">
      <h3 id="modalTitle">系統提示</h3>
      <p id="modalMessage">提示內容</p>
      <div id="modalBtnGroup" class="custom-modal-backdrop-btns">
        <button id="btnModalConfirm" class="modal-btn modal-btn-confirm" onclick="closeCustomModal(true)">確定</button>
      </div>
    </div>
  </div>

</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwvsd4fRN4qgWBL2ku7E_r-DekIiVtikpvjyVLRqOiGWPPb1sts3Mj10bMiX9n_zoO1tw/exec";
  
  const URL_MEMBERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=280963157&single=true&output=csv";
  const URL_FORMS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=0&single=true&output=csv";
  const URL_DATA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=301837161&single=true&output=csv";

  const PRESET_COLORS = [
    { name: "天藍色 (Sky Blue)", hex: "#81d4fa" },
    { name: "薄荷綠 (Mint Green)", hex: "#a5d6a7" },
    { name: "珊瑚粉 (Coral Pink)", hex: "#ffab91" },
    { name: "紫羅蘭 (Violet)", hex: "#ce93d8" },
    { name: "檸檬黃 (Lemon Yellow)", hex: "#fff59d" },
    { name: "淡橙色 (Light Orange)", hex: "#ffe082" }
  ];

  let state = {
    currentUser: null,
    isGuest: false,
    currentLang: "ZH",
    simulatedDate: "2026-07-25",
    showTestPanel: true,
    membersList: [],
    dataCenter: [],
    formDataCache: {}
  };

  window.addEventListener('DOMContentLoaded', async () => {
    toggleTestPanel(state.showTestPanel);
    applyLanguage();
    await refreshDashboard();
  });

  async function refreshDashboard() {
    const now = new Date();
    document.getElementById('txtUpdateTime').innerText = `${state.currentLang==='ZH'?'更新時間':'Updated'}: ${state.simulatedDate} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

    await fetchMembersFromSheet();
    await fetchDataCenterFromSheet();

    renderMainDashboardUI();
    renderTimeline();
    updateDashboardButtons();
  }

  async function fetchMembersFromSheet() {
    try {
      const res = await fetch(URL_MEMBERS);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      
      const members = [];
      for(let i = 1; i < rows.length; i++) {
        if(rows[i][0]) {
          members.push({
            name: rows[i][0].trim(),
            email: rows[i][1] ? rows[i][1].trim() : '',
            color: rows[i][3] ? rows[i][3].trim() : '#e0e0e0',
            role: rows[i][4] ? rows[i][4].trim() : '協作會員', // E欄: 身份別
            lang: rows[i][6] ? rows[i][6].trim() : 'ZH'
          });
        }
      }
      state.membersList = members;
      initAuthDropdown();
      initColorDropdown();
    } catch(err) {
      console.error("同步會員中心失敗:", err);
    }
  }

  function checkDuplicateName() {
    const nameInput = document.getElementById('txtRegName').value.trim().toLowerCase();
    const isDuplicate = state.membersList.some(m => m.name.toLowerCase() === nameInput);
    
    document.getElementById('msgDuplicateName').style.display = isDuplicate ? 'block' : 'none';
    document.getElementById('btnRegisterSubmit').classList.toggle('btn-disabled', isDuplicate);
  }

  function initColorDropdown() {
    const usedColors = state.membersList.map(m => m.color.toLowerCase());
    const selColor = document.getElementById('selRegColor');
    
    const available = PRESET_COLORS.filter(c => !usedColors.includes(c.hex.toLowerCase()));
    
    if(available.length === 0) {
      selColor.innerHTML = `<option value="">${state.currentLang==='ZH'?'全數顏色已被使用':'All colors taken'}</option>`;
      return;
    }

    selColor.innerHTML = available.map(c => `
      <option value="${c.hex}">${c.name}</option>
    `).join('');
  }

  async function fetchDataCenterFromSheet() {
    try {
      const res = await fetch(URL_DATA);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      
      const records = [];
      for(let i = 1; i < rows.length; i++) {
        if(rows[i][0]) {
          records.push({
            date: rows[i][0].trim(),
            user: rows[i][1] ? rows[i][1].trim() : '',
            status: rows[i][2] ? rows[i][2].trim() : '',
            info: rows[i][3] ? rows[i][3].trim() : '',
            O2_init: rows[i][5] ? rows[i][5].trim() : '160',
            Iso_init: rows[i][5] ? rows[i][5].trim() : '500.23'
          });
        }
      }
      state.dataCenter = records;
    } catch(err) {
      console.error("同步資料中心失敗:", err);
    }
  }

  function parseCSV(text) {
    return text.split('\n').map(r => r.split(','));
  }

  function initAuthDropdown() {
    const sel = document.getElementById('selLoginUser');
    if(state.membersList.length === 0) {
      sel.innerHTML = `<option value="">${state.currentLang==='ZH'?'無會員資料':'No Members'}</option>`;
      return;
    }
    sel.innerHTML = state.membersList.map(m => `<option value="${m.name}">${m.name} (${m.email})</option>`).join('');
  }

  function renderMainDashboardUI() {
    const todayExps = state.dataCenter.filter(d => d.date === state.simulatedDate);
    if(todayExps.length > 0) {
      const active = todayExps[0];
      document.getElementById('statusBadge').style.display = 'block';
      document.getElementById('statusBadge').innerText = active.status;
      document.getElementById('txtCurrentExpUser').innerText = `${active.date} ${active.user}`;
      document.getElementById('txtCurrentExpTitle').innerText = active.info;
    } else {
      document.getElementById('statusBadge').style.display = 'none';
      document.getElementById('txtCurrentExpUser').innerText = state.simulatedDate;
      document.getElementById('txtCurrentExpTitle').innerText = state.currentLang==='ZH'?"本日無進行中實驗":"No active experiments today";
    }

    const futureExps = state.dataCenter
      .filter(d => new Date(d.date) > new Date(state.simulatedDate))
      .sort((a,b) => new Date(a.date) - new Date(b.date))
      .slice(0, 2);

    const scheduleContainer = document.getElementById('scheduleList');
    if(futureExps.length > 0) {
      scheduleContainer.innerHTML = futureExps.map(f => {
        const userObj = state.membersList.find(m => m.name === f.user);
        const userColor = userObj ? userObj.color : '#e0e0e0';
        return `
          <div class="schedule-item">
            <span class="schedule-tag" style="background:${userColor}; color:#000;">${f.date.slice(5)} ${f.user}</span>
            <span>${f.info}</span>
          </div>
        `;
      }).join('');
    } else {
      scheduleContainer.innerHTML = `<div class="schedule-item" style="color:#aaa;">${state.currentLang==='ZH'?'無未來預約排程':'No upcoming schedule'}</div>`;
    }
  }

  async function syncToGoogleSheet(actionType, payload) {
    try {
      await fetch(GAS_API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: actionType, ...payload })
      });
      console.log(`[GAS API] 同步發送成功: ${actionType}`);
    } catch(err) {
      console.error(`[GAS API] 同步失敗:`, err);
    }
  }

  function performLogin() {
    const selectedName = document.getElementById('selLoginUser').value;
    const user = state.membersList.find(m => m.name === selectedName);
    if(user) {
      state.currentUser = user;
      state.isGuest = false;
      state.currentLang = user.lang || "ZH";
      document.getElementById('authPage').style.display = 'none';
      
      const badge = document.getElementById('userBadge');
      badge.innerText = user.name;
      badge.style.background = user.color || '#e0e0e0';

      applyLanguage();
      refreshDashboard();
      showCustomAlert(state.currentLang==='ZH'?"登入成功":"Login Success", `歡迎回來 / Welcome, ${user.name}！`);
    }
  }

    state.currentUser = { name: "訪客", role: "Guest", color: "#e0e0e0" };
    state.isGuest = true;
    document.getElementById('authPage').style.display = 'none';
    document.getElementById('userBadge').innerText = state.currentLang==='ZH'?"訪客":"Guest";

  async function performRegister() {
    const name = document.getElementById('txtRegName').value.trim();
    const email = document.getElementById('txtRegEmail').value.trim();
    const role = document.getElementById('selRegRole').value;
    const password = document.getElementById('txtRegPwd').value.trim();
    const color = document.getElementById('selRegColor').value;
    const lang = document.getElementById('selRegLang').value;

    if(!name || !email) { showCustomAlert("錯誤 / Error", "請完整填寫姓名與 Email"); return; }
    
    if(state.membersList.some(m => m.name.toLowerCase() === name.toLowerCase())) {
      showCustomAlert("註冊失敗 / Failed", "會員名稱已存在，請使用其他名稱！");
      return;
    }

    const newUser = { name, email, role, password, color, lang };
    state.membersList.push(newUser);

    await syncToGoogleSheet("registerUser", newUser);

    initAuthDropdown();
    initColorDropdown();
    switchAuthTab('login');
    showCustomAlert("註冊成功 / Success", "註冊資料已同步寫入會員中心！請選擇帳號登入。");
  }

  function onTestDateChange() {
    state.simulatedDate = document.getElementById('testDateInput').value;
    refreshDashboard();
  }

  function toggleTestPanel(show) {
    document.getElementById('testPanel').style.display = show ? 'flex' : 'none';
  }

  function updateDashboardButtons() {
    const todayHasExp = state.dataCenter.some(d => d.date === state.simulatedDate);
    
    const d = new Date(state.simulatedDate);
    d.setDate(d.getDate() + 1);
    const tomorrowStr = d.toISOString().split('T')[0];
    const tomorrowHasExp = state.dataCenter.some(d => d.date === tomorrowStr);

    if(state.isGuest) {
      document.getElementById('btnTodayExp').classList.add('btn-disabled');
      document.getElementById('btnTomorrowPrep').classList.add('btn-disabled');
      document.getElementById('btnReserveExp').classList.add('btn-disabled');
      document.getElementById('btnMakeupExp').classList.remove('btn-disabled');
      return;
    }

    document.getElementById('btnTodayExp').classList.toggle('btn-disabled', !todayHasExp);
    document.getElementById('btnTomorrowPrep').classList.toggle('btn-disabled', !tomorrowHasExp);
    document.getElementById('btnReserveExp').classList.remove('btn-disabled');
    document.getElementById('btnMakeupExp').classList.remove('btn-disabled');
  }

  function renderTimeline() {
    const container = document.getElementById('timelineContainer');
    let html = `<div class="timeline-line"></div>`;

    const sorted = [...state.dataCenter].sort((a,b) => new Date(b.date) - new Date(a.date));
    
    if(sorted.length === 0) {
      container.innerHTML = html + `<div style="padding:10px; color:#888;">${state.currentLang==='ZH'?'今日無實驗紀錄':'No experiment records today'}</div>`;
      return;
    }

    sorted.forEach(item => {
      const isToday = item.date === state.simulatedDate;
      const userObj = state.membersList.find(m => m.name === item.user);
      const userColor = userObj ? userObj.color : '#e0e0e0';

      html += `
        <div class="timeline-item">
          <div class="timeline-node"></div>
          <div class="timeline-card ${isToday ? 'today' : ''}">
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:12px;">
              <span>${item.date} <span style="background:${userColor}; border:1px solid #333; border-radius:10px; padding:0 6px;">${item.user}</span></span>
              <span style="color:#e67e22;">${item.status}</span>
            </div>
            <div style="font-size:13px; margin-top:4px;">${item.info}</div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  let currentFormCtx = {
    formId: '',
    pages: [],
    currentPageIdx: 0,
    data: {},
    isMakeup: false
  };

  function handleTodayExperiment() {
    if(state.isGuest) return;
    const todayExp = state.dataCenter.find(d => d.date === state.simulatedDate);
    if(!todayExp) return;

    switch(todayExp.status) {
      case "已預約": openForm("FORM_001_1"); break;
      case "實驗開始": openForm(todayExp.info.includes("控制組") ? "FORM_002_2" : "FORM_002_1"); break;
      case "準備完成": openForm("FORM_003"); break;
      case "休息中": openForm("FORM_004"); break;
      case "訊號搜集完成": openForm("FORM_005"); break;
      case "開始善後": openForm("FORM_006"); break;
      default: showCustomAlert("提示 / Alert", `當前實驗狀態為 [${todayExp.status}]，無後續表單。`);
    }
  }

  function handleTomorrowPrep() {
    if(state.isGuest) return;
    showCustomAlert("明日準備", "已載入明日預約資料進行檢查表填寫。");
    openForm("FORM_002_1");
  }

  function openForm(formId, isMakeup = false) {
    currentFormCtx.formId = formId;
    currentFormCtx.currentPageIdx = 0;
    currentFormCtx.isMakeup = isMakeup;
    currentFormCtx.data = state.formDataCache[formId] || {};

    currentFormCtx.pages = getFormStructure(formId);
    setupFormTheme(formId);

    renderFormSidebar();
    renderFormCurrentPage();

    document.getElementById('formPageContainer').style.display = 'flex';
  }

  function setupFormTheme(formId) {
    const header = document.getElementById('formHeader');
    document.getElementById('formTitle').innerText = formId;

    if(formId.startsWith("FORM_001")) header.style.background = "var(--color-form1)";
    else if(formId.startsWith("FORM_002")) header.style.background = "var(--color-form2)";
    else if(formId === "FORM_003") header.style.background = "var(--color-form3)";
    else if(formId === "FORM_004") header.style.background = "var(--color-form4)";
    else if(formId === "FORM_005") header.style.background = "var(--color-form5)";
    else header.style.background = "#e1bee7";
  }

  function renderFormSidebar() {
    const sb = document.getElementById('formSidebar');
    sb.innerHTML = currentFormCtx.pages.map((p, idx) => `
      <div class="sidebar-bookmark ${idx === currentFormCtx.currentPageIdx ? 'active' : ''}" onclick="jumpToFormPage(${idx})">
        ${p.title}
      </div>
    `).join('');
  }

  function renderFormCurrentPage() {
    const page = currentFormCtx.pages[currentFormCtx.currentPageIdx];
    const container = document.getElementById('formContent');

    let html = `<h4 style="margin-bottom:15px; border-bottom:2px solid #333; padding-bottom:5px;">${page.title}</h4>`;

    page.fields.forEach(field => {
      const val = currentFormCtx.data[field.id] || field.default || "";

      if(field.type === "info") {
        html += `<div style="font-weight:bold; background:#e3f2fd; padding:8px; border-radius:6px; margin-bottom:10px;">${field.label}</div>`;
      }
      else if(field.type === "text" || field.type === "number") {
        html += `
          <div class="form-group">
            <label>${field.label}</label>
            <input type="${field.type}" class="form-control" value="${val}" onchange="saveFormFieldData('${field.id}', this.value)">
            ${field.desc ? `<div class="field-desc">${field.desc}</div>` : ''}
          </div>
        `;
      }
      else if(field.type === "checkbox") {
        const checked = currentFormCtx.data[field.id] ? 'checked' : '';
        html += `
          <div class="checkbox-item">
            <input type="checkbox" id="${field.id}" ${checked} onchange="saveFormFieldData('${field.id}', this.checked)">
            <div>
              <label for="${field.id}">${field.label}</label>
              ${field.desc ? `<div class="field-desc">${field.desc}</div>` : ''}
            </div>
          </div>
        `;
      }
      else if(field.type === "radio") {
        html += `<div class="form-group"><label>${field.label}</label>`;
        field.options.forEach(opt => {
          const checked = val === opt ? 'checked' : '';
          html += `
            <div style="margin-bottom:4px;">
              <input type="radio" name="${field.id}" value="${opt}" ${checked} onchange="saveFormFieldData('${field.id}', this.value)"> ${opt}
            </div>
          `;
        });
        html += `</div>`;
      }
      else if(field.type === "fetch_detail") {
        const detailText = calculateFetchDetail(field.detailKey);
        html += `
          <div class="form-group" style="background:#fff3e0; padding:10px; border-radius:8px; border:1px solid #ffe0b2;">
            <label style="color:#e65100;">${field.label}</label>
            <button class="modal-btn" style="font-size:11px; padding:4px 8px; margin-bottom:8px;" onclick="showCustomAlert('詳細計算結果', \`${detailText}\`)">顯示詳情</button>
            <pre style="font-size:12px; background:#fff; padding:6px; border-radius:4px;">${detailText}</pre>
          </div>
        `;
      }
    });

    container.innerHTML = html;

    document.getElementById('btnFormPrev').style.display = currentFormCtx.currentPageIdx === 0 ? 'none' : 'inline-block';
    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;
    document.getElementById('btnFormNext').innerText = isLastPage ? (state.currentLang==='ZH'?'提交':'Submit') : (state.currentLang==='ZH'?'下一頁':'Next');
  }

  function saveFormFieldData(fieldId, val) {
    currentFormCtx.data[fieldId] = val;
    state.formDataCache[currentFormCtx.formId] = currentFormCtx.data;
  }

  function prevFormPage() {
    if(currentFormCtx.currentPageIdx > 0) {
      currentFormCtx.currentPageIdx--;
      renderFormSidebar();
      renderFormCurrentPage();
    }
  }

  function nextFormPage() {
    if(currentFormCtx.formId.startsWith("FORM_002")) {
      const page = currentFormCtx.pages[currentFormCtx.currentPageIdx];
      const uncompleted = page.fields.filter(f => f.type === "checkbox" && !currentFormCtx.data[f.id]);
      
      if(uncompleted.length > 0) {
        const listText = uncompleted.map(u => `• ${u.label}`).join('\n');
        showCustomConfirm("未完成核對提示", `尚有以下項目未勾選：\n${listText}`, "返回繼續檢查", "仍要提交", (confirmed) => {
          if(!confirmed) proceedNextPage();
        });
        return;
      }
    }
    proceedNextPage();
  }

  function proceedNextPage() {
    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;

    if(currentFormCtx.currentPageIdx === 0) {
      triggerStatusUpdateOnPage1(currentFormCtx.formId);
    }

    if(isLastPage) {
      submitFormFinal();
    } else {
      currentFormCtx.currentPageIdx++;
      renderFormSidebar();
      renderFormCurrentPage();
    }
  }

  function jumpToFormPage(idx) {
    currentFormCtx.currentPageIdx = idx;
    renderFormSidebar();
    renderFormCurrentPage();
  }

  function closeFormPage() {
    document.getElementById('formPageContainer').style.display = 'none';
  }

  async function triggerStatusUpdateOnPage1(formId) {
    const todayExp = state.dataCenter.find(d => d.date === state.simulatedDate);
    if(!todayExp) return;

    let newStatus = todayExp.status;
    if(formId === "FORM_001_1") newStatus = "實驗開始";
    else if(formId.startsWith("FORM_002")) newStatus = "準備完成";
    else if(formId === "FORM_003") newStatus = "手術中";
    else if(formId === "FORM_004") newStatus = "正在蒐集訊號";
    else if(formId === "FORM_005") newStatus = "犧牲中";

    todayExp.status = newStatus;
    
    await syncToGoogleSheet("updateStatus", {
      date: todayExp.date,
      user: todayExp.user,
      status: newStatus
    });

    refreshDashboard();
  }

  async function submitFormFinal() {
    const todayExp = state.dataCenter.find(d => d.date === state.simulatedDate);
    let targetStatus = "已完成";
    const formId = currentFormCtx.formId;

    if(formId === "FORM_001_1") targetStatus = "實驗開始";
    else if(formId === "FORM_001_2") targetStatus = "已預約";
    else if(formId.startsWith("FORM_002")) targetStatus = "準備完成";
    else if(formId === "FORM_003") {
      const result = currentFormCtx.data['status_rat_result'];
      targetStatus = (result === "登錄狀態-已死亡") ? "已死亡" : "休息中";
    }
    else if(formId === "FORM_004") targetStatus = "訊號搜集完成";
    else if(formId === "FORM_005") targetStatus = "開始善後";
    else if(formId === "FORM_006") targetStatus = "實驗結束";

    if(currentFormCtx.isMakeup) targetStatus = "實驗結束";

    await syncToGoogleSheet("submitForm", {
      date: state.simulatedDate,
      user: state.currentUser ? state.currentUser.name : "Daniel",
      status: targetStatus,
      info: "Vortex gut–brain stimulation -VUS刺激",
      formData: currentFormCtx.data
    });

    if(todayExp) todayExp.status = targetStatus;

    closeFormPage();
    await refreshDashboard();
    showCustomAlert("提交成功 / Submitted", `表單已成功寫入 Google 試算表！\n實驗狀態更變為：[${targetStatus}]`);
  }

  function calculateFetchDetail(key) {
    const exp = state.dataCenter.find(d => d.date === state.simulatedDate) || state.dataCenter[0] || {};
    
    if(key === "O2_and_Isoflurane_usage") {
      const o2_init = exp.O2_init || 160;
      const iso_init = exp.Iso_init || 500.23;
      return `O2：${o2_init}→120\nIsoflurane：${iso_init}→485.54`;
    } 
    else if(key === "NaCl_and_Isoflurane_usage") {
      const link = "https://docs.google.com/spreadsheets/d/1gjmznxvsYOxakoa3bsjLy2OQSS9inLX3Y9vQGvdSH1E/edit#gid=1540621860";
      return `實驗室登錄連結 : ${link}\nNaCl：${exp.user || 'Daniel'}, July 25, 9g\nIsoflurane：${exp.user || 'Daniel'}, July 25, 14.69g`;
    }
    return "尚無資料";
  }

  function showCustomAlert(title, message) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalBtnGroup').innerHTML = `
      <button class="modal-btn modal-btn-confirm" onclick="closeCustomModal(true)">${state.currentLang==='ZH'?'確定':'OK'}</button>
    `;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  function showCustomConfirm(title, message, cancelText, confirmText, callback) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalBtnGroup').innerHTML = `
      <button class="modal-btn modal-btn-cancel" onclick="handleConfirmChoice(false)">${cancelText}</button>
      <button class="modal-btn modal-btn-confirm" onclick="handleConfirmChoice(true)">${confirmText}</button>
    `;
    window.confirmCallback = callback;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  function handleConfirmChoice(choice) {
    document.getElementById('customModalBackdrop').style.display = 'none';
    if(window.confirmCallback) window.confirmCallback(choice);
  }

  function closeCustomModal() {
    document.getElementById('customModalBackdrop').style.display = 'none';
  }

  function toggleFabMenu() {
    const overlay = document.getElementById('fabMenuOverlay');
    overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
  }

  function closeFabMenu() {
    document.getElementById('fabMenuOverlay').style.display = 'none';
  }

  function openScheduleCenter() { closeFabMenu(); showCustomAlert("排程中心 / Schedule", "開啟排程中心面板 (殼)。"); }
  function openRecordCenter() { closeFabMenu(); showCustomAlert("紀錄中心 / Record", "開啟實驗紀錄中心面板 (殼)。"); }
  function openEditProfile() {
    closeFabMenu();
    if(state.currentUser) {
      showCustomAlert("個人資訊 / Profile", `會員姓名 : ${state.currentUser.name}\nEmail : ${state.currentUser.email}\n身份 : ${state.currentUser.role}`);
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智慧實驗日誌 E-labnote</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #94a3b8;
      
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-light: #f0f9ff;
      
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --gray-badge: #64748b;
      
      --border-color: #e2e8f0;
      --border-focus: #38bdf8;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body { 
      width: 100%; height: 100%; overflow: hidden; position: fixed; 
      background-color: var(--bg-main); color: var(--text-primary);
    }

    .app-container {
      width: 100%; max-width: 480px; margin: 0 auto; height: 100%;
      background: var(--bg-main); display: flex; flex-direction: column; 
      position: relative; overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--card-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border-color); z-index: 10; padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      flex-shrink: 0;
    }
    .header-title h1 { font-size: 16px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .header-title h1::before { content: ""; display: inline-block; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; }
    .header-title h2 { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-left: 8px; }
    
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .header-btn-group { display: flex; gap: 6px; align-items: center; }
    .user-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--text-secondary); background: #f1f5f9; border: 1px solid var(--border-color); cursor: pointer; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lang-btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-secondary); border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600; cursor: pointer; }
    
    .btn-refresh-touch {
      display: flex; align-items: center; gap: 4px; background: var(--primary-light); color: var(--primary);
      border: 1px solid #bae6fd; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-refresh-touch.refreshing { background: #e2e8f0 !important; color: #94a3b8 !important; border-color: #cbd5e1 !important; opacity: 0.6; }

    .update-time { font-size: 10px; color: var(--text-muted); font-family: ui-monospace, monospace; margin-top: 2px; }

    .main-content { padding: 16px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 40px; }

    .dashboard-card { 
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg); 
      padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); 
    }
    
    .monitor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .monitor-title { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .pulse-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* 今日進行中項目卡片 */
    .active-exp-card {
      background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 12px 14px; margin-bottom: 10px; position: relative;
    }
    .active-exp-card:last-child { margin-bottom: 0; }
    
    .status-badge-lg { 
      display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; border-radius: 6px; 
      font-size: 11px; font-weight: 800; border: 1px solid transparent; flex-shrink: 0; min-width: 70px; text-align: center;
      white-space: nowrap;
    }
    .status-badge-lg.reserved { background: #f1f5f9; color: var(--gray-badge); border-color: #cbd5e1; }
    .status-badge-lg.active { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .status-badge-lg.completed { background: #dcfce7; color: #15803d; border-color: #86efac; }

    .exp-title-main { font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 8px 0 6px 0; line-height: 1.4; word-break: break-word; }
    .exp-meta-bar { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-secondary); gap: 8px; flex-wrap: wrap; }
    .exp-code-tag { font-family: ui-monospace, monospace; color: var(--text-muted); font-size: 11px; background: #ffffff; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border-color); word-break: break-all; }

    /* 未來排程（防破版樣式） */
    .schedule-item { display: flex; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-secondary); cursor: pointer; gap: 8px; width: 100%; }
    .schedule-date-tag { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; font-family: ui-monospace, monospace; flex-shrink: 0; }
    .schedule-info { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: var(--text-primary); }
    .schedule-user-tag { background: #f1f5f9; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; flex-shrink: 0; max-width: 75px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .btn-action {
      padding: 14px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); font-weight: 600; font-size: 13px;
      cursor: pointer; text-align: center; transition: all 0.15s; background: var(--card-bg); color: var(--text-primary); box-shadow: var(--shadow-sm);
    }
    .btn-action:active { transform: translateY(1px); }
    .btn-disabled { opacity: 0.35; cursor: not-allowed !important; pointer-events: none; background: #f1f5f9; color: var(--text-muted); border-color: #e2e8f0; }
    
    .btn-today { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .btn-tomorrow { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; }
    .btn-reserve { background: #ffffff; color: var(--text-primary); border-color: var(--border-color); }
    .btn-makeup { background: #fffbeb; color: #b45309; border-color: #fde68a; }

    /* 時間軸歷史紀錄 */
    .timeline-container { position: relative; padding-left: 20px; margin-top: 16px; margin-bottom: 20px; }
    .timeline-line { position: absolute; left: 5px; top: 12px; bottom: 8px; width: 2px; background: var(--border-color); }
    .timeline-item { position: relative; margin-bottom: 12px; cursor: pointer; }
    .timeline-node { position: absolute; left: -19px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); border: 2px solid var(--card-bg); box-shadow: 0 0 0 2px var(--primary); }
    .timeline-card { background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); overflow: hidden; }
    .timeline-card.today { border-color: #93c5fd; background: #f0f9ff; }

    .timeline-date-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .timeline-date-title { font-size: 14px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 6px; min-width: 0; }
    .timeline-user-badge { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    .timeline-status-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    
    .timeline-info-text { font-size: 13px; margin-top: 6px; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-exp-id { font-size: 10px; font-family: ui-monospace, monospace; color: var(--text-muted); font-weight: 500; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .section-divider {
      font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 0.5px; margin: 24px 0 12px 0; display: flex; align-items: center; gap: 8px;
    }
    .section-divider::after { content: ""; flex: 1; height: 1px; background: var(--border-color); }

    .upload-status-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
    .upload-status-tag.uploaded { background: #dcfce7; color: #15803d; }
    .upload-status-tag.pending { background: #fee2e2; color: #b91c1c; }

    .copyright-notice { text-align: center; font-size: 11px; color: var(--text-muted); padding: 16px 0; font-weight: 500; font-family: ui-monospace, monospace; }

    .blur-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 900; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fab {
      position: absolute; right: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 48px; height: 48px;
      background: var(--text-primary); color: #fff; border-radius: 50%; display: none; align-items: center;
      justify-content: center; font-size: 24px; cursor: pointer; border: none; box-shadow: var(--shadow-md); z-index: 50;
      transition: transform 0.25s ease;
    }
    .fab.active { transform: rotate(135deg); background: var(--danger); }

    .fab-menu-overlay {
      position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px); display: none; flex-direction: column; justify-content: flex-end; align-items: flex-end;
      padding: 0 20px calc(env(safe-area-inset-bottom, 0px) + 80px) 20px; z-index: 45;
    }
    .fab-menu-item {
      background: var(--card-bg); border-radius: var(--radius-md); padding: 12px 20px;
      margin-top: 10px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--shadow-md); color: var(--text-primary);
      width: 150px; text-align: center; border: 1px solid var(--border-color);
    }

    .custom-modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px;
    }
    .custom-modal {
      background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 320px;
      padding: 20px; box-shadow: var(--shadow-md); text-align: center; border: 1px solid var(--border-color);
    }
    .custom-modal h3 { margin-bottom: 8px; font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .custom-modal p { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; white-space: pre-line; text-align: center; line-height: 1.5; }
    .custom-modal-btns { display: flex; gap: 8px; justify-content: center; }
    .modal-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-weight: 600; font-size: 13px; cursor: pointer; }
    .modal-btn-confirm { background: var(--primary); color: #fff; border: none; }
    .modal-btn-cancel { background: var(--bg-main); color: var(--text-secondary); }

    .form-page-container {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--card-bg); z-index: 100; flex-direction: column; height: 100%;
    }
    .form-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-main); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); flex-shrink: 0;
    }
    .btn-close-red {
      background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; width: 32px; height: 32px;
      border-radius: 50%; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-close-red:active { background: var(--danger); color: #fff; }

    .form-body { flex: 1; display: flex; overflow: hidden; position: relative; }
    .form-sidebar { width: 95px; background: var(--bg-main); border-right: 1px solid var(--border-color); overflow-y: auto; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-bookmark { padding: 14px 8px; font-size: 11px; text-align: center; border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-muted); font-weight: 500; line-height: 1.3; }
    .sidebar-bookmark.active { background: var(--card-bg); font-weight: 700; color: var(--primary); border-left: 3px solid var(--primary); }
    
    .form-content { flex: 1; padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    
    .form-footer {
      padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 12px) 16px;
      border-top: 1px solid var(--border-color); display: flex; gap: 12px; justify-content: space-between;
      background: var(--card-bg); flex-shrink: 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
    }
    .btn-footer { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; cursor: pointer; border: 1px solid var(--border-color); text-align: center; }
    .btn-footer-prev { background: var(--bg-main); color: var(--text-secondary); }
    .btn-footer-next { background: var(--primary); color: #fff; border: none; }
    .btn-footer-next:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-group { margin-bottom: 18px; }
    .form-group > label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 8px; color: var(--text-primary); }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg-main); color: var(--text-primary); outline: none; }
    .form-control:focus { border-color: var(--border-focus); background: #fff; }
    
    .option-card {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--bg-main);
      border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; transition: all 0.15s;
    }
    .option-card.selected { background: var(--primary-light); border-color: var(--border-focus); }
    .option-card input[type="radio"], .option-card input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
    .option-card label { font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer; flex: 1; word-break: break-word; }

    .field-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
    .section-header { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 6px 10px; border-radius: 4px; margin: 16px 0 10px 0; }

    .auth-container {
      position: absolute; top:0; left:0; right:0; bottom:0; background: var(--card-bg); z-index: 200;
      padding: 24px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto;
    }
    .auth-header-bar { display: flex; justify-content: flex-end; padding-top: env(safe-area-inset-top, 10px); }
    .auth-title { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--text-primary); letter-spacing: -0.5px; }
    .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-muted); }
    .auth-tab.active { border-bottom: 2px solid var(--primary); color: var(--primary); }

    .error-msg { color: var(--danger); font-size: 11px; font-weight: 600; margin-top: 6px; display: none; }
  </style>

  <link rel="icon" type="image/png" href="icon-2.0.png?v=2.1">
  <link rel="apple-touch-icon" href="icon-2.0.png?v=2.1">
  <link rel="manifest" href="manifest.json?v=2.1">
  <meta name="theme-color" content="#ffffff">
</head>
<body>

<div class="app-container">

  <!-- 全螢幕霧面毛玻璃載入遮罩 -->
  <div id="blurOverlay" class="blur-overlay">
    <div class="spinner"></div>
    <div style="font-size:12px; font-weight:700; color:var(--text-secondary);" id="txtOverlayMsg">資料同步中...</div>
  </div>

  <!-- 1. 登入 / 註冊 頁面 -->
  <div id="authPage" class="auth-container">
    <div>
      <div class="auth-header-bar">
        <button id="authLangBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
      </div>

      <div class="auth-title" id="txtAuthTitle" style="margin-top: 20px;">智慧實驗日誌 E-labnote</div>
      <div class="auth-tabs">
        <div id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">登入</div>
        <div id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">註冊</div>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label id="lblUserSelect">選擇會員帳號</label>
          <select id="selLoginUser" class="form-control">
            <option value="">同步會員中心資料中...</option>
          </select>
        </div>
        <div class="form-group">
          <label id="lblPassword">識別密碼</label>
          <input type="password" id="txtLoginPwd" class="form-control" placeholder="請輸入密碼">
        </div>
        <button id="btnLoginSubmit" class="btn-action btn-tomorrow" style="width:100%; margin-top: 10px;" onclick="performLogin()">登入</button>
        <button id="btnGuestSubmit" class="btn-action btn-reserve" style="width:100%; margin-top:10px;" onclick="guestLogin()">訪客登入 (僅查看)</button>
      </div>

      <div id="registerForm" style="display:none;">
        <div class="form-group">
          <label id="lblRegName">會員名稱 (不可重複)</label>
          <input type="text" id="txtRegName" class="form-control" placeholder="例如：Daniel" oninput="checkDuplicateName()">
          <div id="msgDuplicateName" class="error-msg">⚠️ 此名稱已被使用，請更換其他名稱</div>
        </div>
        <div class="form-group">
          <label id="lblRegEmail">電子信箱</label>
          <input type="email" id="txtRegEmail" class="form-control" placeholder="user@gmail.com">
        </div>
        <div class="form-group">
          <label id="lblRegRole">身份別</label>
          <select id="selRegRole" class="form-control">
            <option value="協作會員">協作會員 (Collaborator)</option>
            <option value="一般會員">一般會員 (General Member)</option>
          </select>
        </div>
        <div class="form-group">
          <label id="lblRegPwd">設定識別密碼</label>
          <input type="password" id="txtRegPwd" class="form-control">
        </div>
        <div class="form-group">
          <label id="lblRegColor">個人代表色 (不可重複)</label>
          <select id="selRegColor" class="form-control"></select>
        </div>
        <div class="form-group">
          <label id="lblRegLang">預設介面語言</label>
          <select id="selRegLang" class="form-control">
            <option value="ZH">中文 (Traditional Chinese)</option>
            <option value="EN">English</option>
          </select>
        </div>
        <button id="btnRegisterSubmit" class="btn-action btn-tomorrow" style="width:100%;" onclick="performRegister()">註冊新帳號</button>
      </div>
    </div>

    <div class="copyright-notice">© DanielGuo. All Rights Reserved. v2.1</div>
  </div>

  <!-- 2. 主頁面 Header -->
  <div class="header">
    <div class="header-title">
      <h1 id="appTitle">智慧實驗日誌</h1>
      <h2>E-labnote</h2>
    </div>
    <div class="header-right">
      <div class="header-btn-group">
        <div id="userBadge" class="user-badge" onclick="performLogout()" title="點擊登出">未登入</div>
        <button id="langToggleBtn" class="lang-btn" onclick="toggleLanguage()">ZN</button>
        <button id="btnRefresh" class="btn-refresh-touch" onclick="refreshDashboard(true)" title="一鍵更新">
          <span class="refresh-icon">🔄</span> 更新
        </button>
      </div>
      <div class="update-time" id="txtUpdateTime">Syncing...</div>
    </div>
  </div>

  <!-- 3. 主頁面內容 -->
  <div class="main-content">
    
    <div class="dashboard-card" id="dashboardCard">
      <div class="monitor-header">
        <div class="monitor-title" id="txtTodayHeader">
          <span class="pulse-dot"></span> 今日進行中項目 / ACTIVE EXPERIMENTS
        </div>
      </div>
      
      <div id="todayActiveExpList">

      <hr style="margin:14px 0 10px 0; border:0; border-top:1px solid var(--border-color);">

</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwvsd4fRN4qgWBL2ku7E_r-DekIiVtikpvjyVLRqOiGWPPb1sts3Mj10bMiX9n_zoO1tw/exec";
  
  const URL_MEMBERS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=280963157&single=true&output=csv";
  const URL_FORMS   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=0&single=true&output=csv";
  const URL_DATA    = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrNpnTtT0ParHdFoT3lqwf07EzA2TbjEjrsHKu-BA8oNspw8ZvlGUVHfuXRZ18HHfGAtgnzyZqMziF/pub?gid=301837161&single=true&output=csv";

  const STATUS_TRANS = {
    "已預約": { ZH: "已預約", EN: "Reserved" },
    "實驗開始": { ZH: "實驗開始", EN: "Started" },
    "準備完成": { ZH: "準備完成", EN: "Prepared" },
    "進行中": { ZH: "進行中", EN: "In Progress" },
    "休息中": { ZH: "休息中", EN: "In Break" },
    "訊號搜集完成": { ZH: "訊號搜集完成", EN: "Signal Done" },
    "開始善後": { ZH: "開始善後", EN: "Cleaning" },
    "已完成": { ZH: "已完成", EN: "Completed" },
    "實驗結束": { ZH: "實驗結束", EN: "Finished" }
  };

  const PRESET_COLORS = [
    { name: "天藍色 (Sky Blue)", hex: "#e0f2fe" },
    { name: "薄荷綠 (Mint Green)", hex: "#dcfce7" },
    { name: "珊瑚粉 (Coral Pink)", hex: "#ffedd5" },
    { name: "紫羅蘭 (Violet)", hex: "#f3e8ff" },
    { name: "檸檬黃 (Lemon Yellow)", hex: "#fef9c3" }
  ];

  let state = {
    currentUser: null,
    isGuest: false,
    currentLang: "ZH",
    simulatedDate: "2026-07-26",
    membersList: [],
    dataCenter: [],
    formDataCache: {},
    dynamicForms: {},
    isSubmitting: false
  };

  window.addEventListener('DOMContentLoaded', async () => {
    applyLanguage();
    await fetchAndParseFormsFromSheet();
    await refreshDashboard(false);
  });

  // 智慧中英字串剖析 (以 '/' 作為分隔)
  function formatBilingualText(str, lang) {
    if (!str) return '';
    if (!str.includes('/')) return str;
    const parts = str.split('/');
    const zhText = parts[0].trim();
    const enText = parts[1].trim();
    return lang === 'EN' ? enText : zhText;
  }

  // 取得對應語言的狀態文字
  function getStatusText(statusRaw, lang) {
    if (STATUS_TRANS[statusRaw]) {
      return STATUS_TRANS[statusRaw][lang] || statusRaw;
    }
    return formatBilingualText(statusRaw, lang);
  }

  async function refreshDashboard(showBlur = true) {
    const btnRef = document.getElementById('btnRefresh');
    const blurOverlay = document.getElementById('blurOverlay');
    
    if (showBlur) {
      btnRef.classList.add('refreshing');
      document.getElementById('txtOverlayMsg').innerText = state.currentLang === 'ZH' ? "同步試算表資料中..." : "Syncing Spreadsheet...";
      blurOverlay.style.display = 'flex';
    }

    const now = new Date();
    document.getElementById('txtUpdateTime').innerText = `${state.simulatedDate} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;

    await fetchMembersFromSheet();
    await fetchDataCenterFromSheet();

    renderMainDashboardUI();
    renderTimeline();
    updateDashboardButtons();

    if (showBlur) {
      setTimeout(() => {
        btnRef.classList.remove('refreshing');
        blurOverlay.style.display = 'none';
      }, 300);
    }
  }

  async function fetchAndParseFormsFromSheet() {
    try {
      const res = await fetch(URL_FORMS);
      const csvText = await res.text();
      const rows = parseCSV(csvText);

      if (rows.length < 2) return;

      const headerRow = rows[0];
      const formBlocks = [];

      for (let colIdx = 0; colIdx < headerRow.length; colIdx++) {
        const cellVal = (headerRow[colIdx] || "").trim();
        if (cellVal.startsWith("FORM_")) {
          formBlocks.push({ formId: cellVal, startCol: colIdx });
        }
      }

      const parsedForms = {};

      formBlocks.forEach(block => {
        const formId = block.formId;
        const col = block.startCol;
        
        const pages = [];
        let currentPage = null;
        let lastParentField = null;

        for (let r = 2; r < rows.length; r++) {
          const rawLabel = (rows[r][col] || "").trim();
          const rawType = (rows[r][col + 1] || "").trim();
          const rawOption = (rows[r][col + 2] || "").trim();
          const rawDesc = (rows[r][col + 3] || "").trim();

          if (!rawLabel && !rawType) continue;

          if (rawLabel.includes("【") && rawLabel.includes("】")) {
            const pageTitle = rawLabel.replace(/【|】/g, "").trim();
            currentPage = { title: pageTitle, fields: [] };
            pages.push(currentPage);
            lastParentField = null;
            continue;
          }

          if (!currentPage) {
            currentPage = { title: "Page 1 基本資訊", fields: [] };
            pages.push(currentPage);
          }

          if (rawType.includes("[#]")) {
            currentPage.fields.push({ type: "section", label: rawLabel });
            lastParentField = null;
            continue;
          }

          let dependsOn = null;
          if (rawType.includes("[depends_on:")) {
            const match = rawType.match(/\[depends_on:\s*([^\]]+)\]/i);
            if (match) dependsOn = match[1].trim();
          }

          if (rawType.includes("[v]") && rawLabel.includes("實驗大綱")) {
            lastParentField = { id: `field_${r}_${col}`, label: rawLabel, type: "outline_select", options: [] };
            currentPage.fields.push(lastParentField);
          }
          else if (rawType.includes("[radio]")) {
            lastParentField = { id: `field_${r}_${col}`, label: rawLabel, type: "radio", dependsOn: dependsOn, options: [] };
            currentPage.fields.push(lastParentField);
          } 
          else if (rawType.includes("[checkbox_group]")) {
            lastParentField = { id: `field_${r}_${col}`, label: rawLabel, type: "checkbox_group", dependsOn: dependsOn, options: [] };
            currentPage.fields.push(lastParentField);
          }
          else if ((rawType.includes("[option]") || rawType.includes("[option_input]")) && lastParentField) {
            const optName = rawLabel.replace(/^-\s*/, '');
            const hasInput = rawType.includes("[option_input]");
            
            let action = null;
            if (rawType.includes("[goto:")) {
              const match = rawType.match(/\[goto:\s*(Page\s*\d+)\]/i);
              if (match) action = { type: "goto", target: match[1] };
            } else if (rawType.includes("[submit]")) {
              action = { type: "submit" };
            }

            let statusTag = null;
            if (rawType.includes("[status:")) {
              const match = rawType.match(/\[status:\s*([^\]]+)\]/i);
              if (match) statusTag = match[1];
            }

            lastParentField.options.push({
              name: optName,
              hasInput: hasInput,
              action: action,
              statusTag: statusTag,
              placeholder: rawType.match(/\[placeholder:\s*([^\]]+)\]/)?.[1] || "請說明..."
            });
          } 
          else if (rawType.includes("[c]") || rawType.includes("[checkbox]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel.replace(/^-\s*/, ''),
              type: "checkbox",
              desc: rawDesc
            });
            lastParentField = null;
          } 
          else if (rawType.includes("[v]")) {
            const isExpSelect = rawType.includes("資料中心");
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: isExpSelect ? "exp_select" : "user_select",
              default: state.currentUser ? state.currentUser.name : "Daniel"
            });
            lastParentField = null;
          }
          else if (rawType.includes("[datetime]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: "date",
              default: state.simulatedDate,
              desc: rawDesc
            });
            lastParentField = null;
          }
          else if (rawType.includes("[number]") || rawType.includes("[text]")) {
            currentPage.fields.push({
              id: `field_${r}_${col}`,
              label: rawLabel,
              type: rawType.includes("[number]") ? "number" : "text",
              default: rawType.match(/\[default:\s*([^\]]+)\]/)?.[1] || "",
              unit: rawType.match(/\[unit:\s*([^\]]+)\]/)?.[1] || "",
              placeholder: rawType.match(/\[placeholder:\s*([^\]]+)\]/)?.[1] || "",
              desc: rawDesc
            });
            lastParentField = null;
          }
        }

        parsedForms[formId] = pages;
      });

      state.dynamicForms = parsedForms;
    } catch (err) {
      console.error("動態解析表單失敗:", err);
    }
  }

  function getFormStructure(formId) {
    if (state.dynamicForms && state.dynamicForms[formId]) {
      return state.dynamicForms[formId];
    }
    return [{ title: "Page 1 基本資訊", fields: [{ id: "fallback_1", label: "同步試算表中...", type: "checkbox" }] }];
  }

  async function fetchMembersFromSheet() {
    try {
      const res = await fetch(URL_MEMBERS);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      
      const members = [];
      for(let i = 1; i < rows.length; i++) {
        if(rows[i][0]) {
          members.push({
            name: rows[i][0].trim(),
            email: rows[i][1] ? rows[i][1].trim() : '',
            color: rows[i][3] ? rows[i][3].trim() : '#f1f5f9',
            role: rows[i][4] ? rows[i][4].trim() : '協作會員',
            password: rows[i][5] ? rows[i][5].trim() : '',
            lang: rows[i][6] ? rows[i][6].trim() : 'ZH'
          });
        }
      }
      state.membersList = members;
      initAuthDropdown();
      initColorDropdown();
    } catch(err) {
      console.error("同步會員中心失敗:", err);
    }
  }

  function checkDuplicateName() {
    const nameInput = document.getElementById('txtRegName').value.trim().toLowerCase();
    const isDuplicate = state.membersList.some(m => m.name.toLowerCase() === nameInput);
    document.getElementById('msgDuplicateName').style.display = isDuplicate ? 'block' : 'none';
    document.getElementById('btnRegisterSubmit').classList.toggle('btn-disabled', isDuplicate);
  }

  function initColorDropdown() {
    const usedColors = state.membersList.map(m => m.color.toLowerCase());
    const selColor = document.getElementById('selRegColor');
    const available = PRESET_COLORS.filter(c => !usedColors.includes(c.hex.toLowerCase()));
    
    if(available.length === 0) {
      selColor.innerHTML = `<option value="">全數顏色已被使用</option>`;
      return;
    }
    selColor.innerHTML = available.map(c => `<option value="${c.hex}">${c.name}</option>`).join('');
  }

  // 重構資料中心讀取：Parsing 表單 JSON 欄位（以 FORM_001 或最新表單 JSON 為準）
  async function fetchDataCenterFromSheet() {
    try {
      const res = await fetch(URL_DATA);
      const csvText = await res.text();
      const rows = parseCSV(csvText);
      
      const records = [];
      for(let i = 1; i < rows.length; i++) {
        if(rows[i][0] || rows[i][1]) {
          const expId = rows[i][0] ? rows[i][0].trim() : '未編號';
          const date = rows[i][1] ? rows[i][1].trim() : '';
          const user = rows[i][2] ? rows[i][2].trim() : '';
          const status = rows[i][3] ? rows[i][3].trim() : '';
          
          let parsedFormData = {};
          // 嘗試遍歷 FORM 欄位抓取最完整的 JSON 資料 (E, G, I, K, M 欄位)
          [4, 6, 8, 10, 12].forEach(colIdx => {
            const rawJsonStr = rows[i][colIdx] ? rows[i][colIdx].trim() : '';
            if (rawJsonStr && rawJsonStr.startsWith('{')) {
              try {
                const jsonObj = JSON.parse(rawJsonStr);
                parsedFormData = { ...parsedFormData, ...jsonObj };
              } catch(e) {}
            }
          });

          // 組裝實驗標題資訊（從 JSON 中的大綱與目的剖析）
          const outlineName = parsedFormData['outline_select_val'] || '';
          const purposeName = parsedFormData['selected_purpose_name'] || '';
          let dynamicInfo = (outlineName || purposeName) ? `${outlineName}${purposeName ? ' - ' + purposeName : ''}`.trim() : "實驗專案";

          const colV = rows[i][21] ? rows[i][21].trim() : '';
          records.push({
            expId: expId,
            date: date,
            user: user,
            status: status,
            info: dynamicInfo,
            formData: parsedFormData,
            hasDataUpload: colV !== '' && colV !== '0' && colV !== '-'
          });
        }
      }
      state.dataCenter = records;
    } catch(err) {
      console.error("同步資料中心失敗:", err);
    }
  }

  function parseCSV(text) { return text.split('\n').map(r => r.split(',')); }

  function initAuthDropdown() {
    const sel = document.getElementById('selLoginUser');
    if(state.membersList.length === 0) {
      sel.innerHTML = `<option value="">無會員資料</option>`;
      return;
    }
    sel.innerHTML = state.membersList.map(m => `<option value="${m.name}">${m.name} (${m.email})</option>`).join('');
  }

  function renderMainDashboardUI() {
    const isZH = state.currentLang === 'ZH';
    const todayExps = state.dataCenter.filter(d => d.date === state.simulatedDate && d.status !== '已完成' && d.status !== '實驗結束' && d.status !== 'Completed');
    const todayListContainer = document.getElementById('todayActiveExpList');
    
    if(todayExps.length > 0) {
      todayListContainer.innerHTML = todayExps.map(exp => {
        const badgeClass = exp.status === '已預約' ? 'reserved' : 'active';
        const userObj = state.membersList.find(m => m.name === exp.user);
        const userColor = userObj ? userObj.color : '#f1f5f9';
        
        const displayStatus = getStatusText(exp.status, state.currentLang);
        const displayInfo = formatBilingualText(exp.info, state.currentLang);

        return `
          <div class="active-exp-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="status-badge-lg ${badgeClass}">${displayStatus}</span>
              <span class="exp-code-tag">${exp.expId}</span>
            </div>
            <div class="exp-title-main">${displayInfo || (isZH ? '實驗專案' : 'Experiment Project')}</div>
            <div class="exp-meta-bar">
              <span>${isZH?'負責人':'Owner'}：<strong style="background:${userColor}; padding:1px 6px; border-radius:4px; font-weight:700;">${exp.user}</strong></span>
              <span>${isZH?'日期':'Date'}：${exp.date}</span>
            </div>
          </div>
        `;
      }).join('');
    } else {
      todayListContainer.innerHTML = `<div style="font-size:13px; color:var(--text-muted); padding:10px 0; text-align:center;">${isZH?'目前無進行中實驗':'No active experiments'}</div>`;
    }

    const futureExps = state.dataCenter
      .filter(d => new Date(d.date) > new Date(state.simulatedDate))
      .sort((a,b) => new Date(a.date) - new Date(b.date))
      .slice(0, 2);

    const scheduleContainer = document.getElementById('scheduleList');
    if(futureExps.length > 0) {
      scheduleContainer.innerHTML = futureExps.map(f => {
        const userObj = state.membersList.find(m => m.name === f.user);
        const userColor = userObj ? userObj.color : '#f1f5f9';
        const displayDate = f.date ? f.date.slice(5) : '--';
        const displayInfo = formatBilingualText(f.info, state.currentLang);

        return `
          <div class="schedule-item">
            <span class="schedule-date-tag">${displayDate}</span>
            <span class="schedule-info" title="${displayInfo}">${displayInfo || (isZH?'預約排程':'Reserved Schedule')}</span>
            <span class="schedule-user-tag" style="background:${userColor};">${f.user}</span>
          </div>
        `;
      }).join('');
    } else {
      scheduleContainer.innerHTML = `<div class="schedule-item" style="color:var(--text-muted);">${isZH?'無未來預約排程':'No upcoming schedule'}</div>`;
    }
  }

  function renderTimeline() {
    const isZH = state.currentLang === 'ZH';
    const container = document.getElementById('timelineContainer');
    let html = `<div class="timeline-line"></div>`;
    const sorted = [...state.dataCenter].sort((a,b) => new Date(b.date) - new Date(a.date));
    
    if(sorted.length === 0) {
      container.innerHTML = html + `<div style="padding:10px; color:var(--text-muted); font-size:12px;">${isZH?'無歷史實驗紀錄':'No history records'}</div>`;
      return;
    }

    sorted.forEach(item => {
      const isToday = item.date === state.simulatedDate;
      const userObj = state.membersList.find(m => m.name === item.user);
      const userColor = userObj ? userObj.color : '#f1f5f9';
      
      const isCompleted = item.status === '已完成' || item.status === '實驗結束' || item.status === 'Completed';
      const statusColor = isCompleted ? 'var(--success)' : (item.status === '已預約' ? 'var(--gray-badge)' : 'var(--warning)');
      
      const displayStatus = getStatusText(item.status, state.currentLang);
      const displayInfo = formatBilingualText(item.info, state.currentLang);

      const uploadTagHtml = isCompleted 
        ? (item.hasDataUpload 
            ? `<span class="upload-status-tag uploaded">${isZH?'已上傳':'Uploaded'}</span>` 
            : `<span class="upload-status-tag pending">${isZH?'待上傳':'Pending'}</span>`) 
        : '';

      html += `
        <div class="timeline-item">
          <div class="timeline-node" style="background:${statusColor}"></div>
          <div class="timeline-card ${isToday ? 'today' : ''}">
            <div class="timeline-date-head">
              <div class="timeline-date-title">
                <span>${item.date}</span>
                <span class="timeline-user-badge" style="background:${userColor};">${item.user}</span>
              </div>
              <div class="timeline-status-group">
                <span style="color:${statusColor}; font-size:11px; font-weight:700;">${displayStatus}</span>
                ${uploadTagHtml}
              </div>
            </div>
            <div class="timeline-info-text" title="${displayInfo}">${displayInfo || (isZH?'實驗專案':'Experiment Project')}</div>
            <div class="timeline-exp-id">${isZH?'編號':'ID'}: ${item.expId}</div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  async function syncToGoogleSheet(actionType, payload) {
    try {
      await fetch(GAS_API_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: actionType, ...payload })
      });
    } catch(err) { console.error(`同步失敗:`, err); }
  }

  function switchAuthTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  }

  function performLogin() {
    const selectedName = document.getElementById('selLoginUser').value;
    const inputPwd = document.getElementById('txtLoginPwd').value.trim();
    const user = state.membersList.find(m => m.name === selectedName);

    if (!user) { showCustomAlert("提示", "請選擇會員帳號"); return; }

    state.currentUser = user;
    state.isGuest = false;
    state.currentLang = user.lang || "ZH";
    document.getElementById('authPage').style.display = 'none';
    document.getElementById('fabBtn').style.display = 'flex';

    applyLanguage();
    refreshDashboard(true);
    showCustomAlert("登入成功", `歡迎回來，${user.name}！`);

  function updateDashboardButtons() {

  let currentFormCtx = {
    formId: '', pages: [], currentPageIdx: 0, data: {}, isMakeup: false, selectedAction: null, selectedStatusTag: null
  };

  function openForm(formId, isMakeup = false) {
    currentFormCtx.formId = formId;
    currentFormCtx.currentPageIdx = 0;
    currentFormCtx.isMakeup = isMakeup;
    currentFormCtx.data = state.formDataCache[formId] || {};
    currentFormCtx.selectedAction = null;

    currentFormCtx.pages = getFormStructure(formId);

  // 自動帶入核心邏輯（完美解析 JSON 自動比對大綱與目的 Radio）
  function handleExpSelectChange(expId) {
    currentFormCtx.data['exp_select_val'] = expId;
    saveFormFieldData('exp_select_val', expId);

    if (expId && expId !== 'NEW_PROJECT') {
      const existingRecord = state.dataCenter.find(d => d.expId === expId);
      if (existingRecord) {
        // 1. 帶入負責人
        if (existingRecord.user) {
          saveFormFieldData('user_select_val', existingRecord.user);
        }

        // 2. 從解析出的 formData 直接帶入
        const savedData = existingRecord.formData || {};
        const savedOutline = savedData['outline_select_val'] || '';
        const savedPurpose = savedData['selected_purpose_name'] || '';

        if (savedOutline) {
          currentFormCtx.data['outline_select_val'] = savedOutline;
        }

        // 比對並選擇 Radio 目的選項
        currentFormCtx.pages.forEach(page => {
          page.fields.forEach(field => {
            if (field.type === 'radio' && field.options) {
              field.options.forEach((opt, idx) => {
                const optName = typeof opt === 'string' ? opt : opt.name;
                // 強健比對（完整匹配、包含匹配）
                if (savedPurpose && (optName === savedPurpose || optName.includes(savedPurpose) || savedPurpose.includes(optName))) {
                  currentFormCtx.data[field.id] = optName;
                  currentFormCtx.data['selected_purpose_name'] = optName;
                  currentFormCtx.data['purpose_code'] = String(idx + 1).padStart(2, '0');
                  if (opt.action) currentFormCtx.selectedAction = opt.action;
                  if (opt.statusTag) currentFormCtx.selectedStatusTag = opt.statusTag;
                }
              });
            }
          });
        });

        showCustomAlert("資料已自動帶入", `已成功同步 [${expId}] 的歷史紀錄！\n負責人、實驗大綱與目的已為您自動填入。`);
      }
    }
    renderFormCurrentPage();
  }

  function renderFormSidebar() {
    const sb = document.getElementById('formSidebar');
    sb.innerHTML = currentFormCtx.pages.map((p, idx) => `
      <div class="sidebar-bookmark ${idx === currentFormCtx.currentPageIdx ? 'active' : ''}" onclick="jumpToFormPage(${idx})">
        ${p.title}
      </div>
    `).join('');
  }

  function renderFormCurrentPage() {
    const page = currentFormCtx.pages[currentFormCtx.currentPageIdx];
    const container = document.getElementById('formContent');

    let html = `<h4 style="margin-bottom:16px; font-size:14px; color:var(--text-primary); font-weight:700;">${page.title}</h4>`;

    page.fields.forEach(field => {
      if (field.dependsOn) {
        const selectedOutline = currentFormCtx.data['outline_select_val'];
        if (selectedOutline !== field.dependsOn) return;
      }

      const val = currentFormCtx.data[field.id] || field.default || "";

      if (field.type === "section") {
        html += `<div class="section-header">${field.label}</div>`;
      }
      else if (field.type === "exp_select") {
        const isZH = state.currentLang === 'ZH';
        const newProjText = isZH ? "➕ 新增實驗專案" : "➕ New Experiment Project";
        const isTodayLogin = currentFormCtx.formId === "FORM_001_1";
        
        const activeProjects = state.dataCenter.filter(d => {
          const notFinished = d.status !== '實驗結束' && d.status !== 'Completed';
          return isTodayLogin ? (d.date === state.simulatedDate && notFinished) : notFinished;
        });

        html += `
          <div class="form-group">
            <label>${field.label}</label>
            <select class="form-control" onchange="handleExpSelectChange(this.value)">
              ${!isTodayLogin ? `<option value="NEW_PROJECT">${newProjText}</option>` : ''}
              ${activeProjects.length === 0 ? `<option value="">-- ${isZH?'無符合之實驗':'No Active Experiment'} --</option>` : ''}
              ${activeProjects.map(p => {
                const optText = `[${p.expId}] ${p.date} (${p.user})`;
                const selected = val === p.expId ? 'selected' : '';
                return `<option value="${p.expId}" ${selected}>${optText}</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }
      else if (field.type === "outline_select") {
        html += `
          <div class="form-group">
            <label>${field.label}</label>
            <select class="form-control" onchange="onOutlineChange('${field.id}', this.value)">
              <option value="">${state.currentLang === 'ZH' ? '請選擇實驗大綱...' : 'Select Outline...'}</option>
              ${field.options.map((opt, idx) => {
                const optName = typeof opt === 'string' ? opt : opt.name;
                const displayOptName = formatBilingualText(optName, state.currentLang);
                const selected = currentFormCtx.data['outline_select_val'] === optName ? 'selected' : '';
                return `<option value="${optName}" data-idx="${idx}" ${selected}>${displayOptName}</option>`;
              }).join('')}
            </select>
          </div>
        `;
      }
      else if (field.type === "user_select") {
        const selectedUser = currentFormCtx.data['user_select_val'] || val;
        html += `
          <div class="form-group">
            <label>${field.label}</label>
            <select class="form-control" onchange="saveFormFieldData('${field.id}', this.value); saveFormFieldData('user_select_val', this.value);">
              ${state.membersList.map(m => `<option value="${m.name}" ${selectedUser === m.name ? 'selected' : ''}>${m.name}</option>`).join('')}
            </select>
          </div>
        `;
      }
      else if (field.type === "date") {
        html += `
          <div class="form-group">
            <label>${field.label}</label>
            <input type="date" class="form-control" value="${val}" onchange="saveFormFieldData('${field.id}', this.value)">
            ${field.desc ? `<div class="field-desc">${field.desc}</div>` : ''}
          </div>
        `;
      }
      else if (field.type === "text" || field.type === "number") {
        html += `
          <div class="form-group">
            <label>${field.label} ${field.unit ? `(${field.unit})` : ''}</label>
            <input type="${field.type}" class="form-control" value="${val}" placeholder="${field.placeholder || ''}" oninput="saveFormFieldData('${field.id}', this.value)">
            ${field.desc ? `<div class="field-desc">${field.desc}</div>` : ''}
          </div>
        `;
      }
      else if (field.type === "checkbox") {
        const isSelected = !!currentFormCtx.data[field.id];
        html += `
          <div class="option-card ${isSelected ? 'selected' : ''}" onclick="toggleOptionCheckbox('${field.id}')">
            <input type="checkbox" id="${field.id}" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleOptionCheckbox('${field.id}');">
            <label for="${field.id}">${formatBilingualText(field.label, state.currentLang)}</label>
          </div>
          ${field.desc ? `<div class="field-desc" style="margin:-4px 0 10px 4px;">${field.desc}</div>` : ''}
        `;
      }
      else if (field.type === "radio") {
        html += `<div class="form-group"><label>${field.label}</label>`;
        field.options.forEach((opt, idx) => {
          const optName = typeof opt === 'string' ? opt : opt.name;
          const displayOptName = formatBilingualText(optName, state.currentLang);
          const isSelected = (val === optName);
          const optId = `${field.id}_opt_${idx}`;
          
          html += `
            <div class="option-card ${isSelected ? 'selected' : ''}" onclick="selectOptionRadio('${field.id}', '${optName}', ${JSON.stringify(opt.action || null)}, '${opt.statusTag || ''}', ${idx + 1})">
              <input type="radio" name="${field.id}" id="${optId}" value="${optName}" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); selectOptionRadio('${field.id}', '${optName}', ${JSON.stringify(opt.action || null)}, '${opt.statusTag || ''}', ${idx + 1});">
              <label for="${optId}">${displayOptName}</label>
            </div>
            ${(opt.hasInput && isSelected) ? `<input type="text" class="form-control" style="margin: -4px 0 8px 0;" placeholder="${opt.placeholder || ''}" value="${currentFormCtx.data[field.id+'_input'] || ''}" oninput="saveFormFieldData('${field.id}_input', this.value)">` : ''}
          `;
        });
        html += `</div>`;
      }
      else if (field.type === "checkbox_group") {
        html += `<div class="form-group"><label>${field.label}</label>`;
        field.options.forEach((opt, idx) => {
          const optName = typeof opt === 'string' ? opt : opt.name;
          const displayOptName = formatBilingualText(optName, state.currentLang);
          const isChecked = currentFormCtx.data[field.id] && currentFormCtx.data[field.id].includes(optName);
          
          html += `
            <div class="option-card ${isChecked ? 'selected' : ''}" onclick="toggleCheckboxGroupOption('${field.id}', '${optName}')">
              <input type="checkbox" id="${field.id}_${idx}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheckboxGroupOption('${field.id}', '${optName}');">
              <label for="${field.id}_${idx}">${displayOptName}</label>
            </div>
            ${(opt.hasInput && isChecked) ? `<input type="text" class="form-control" style="margin: -4px 0 8px 0;" placeholder="${opt.placeholder || ''}" value="${currentFormCtx.data[field.id+'_input'] || ''}" oninput="saveFormFieldData('${field.id}_input', this.value)">` : ''}
          `;
        });
        html += `</div>`;
      }
    });

    container.innerHTML = html;

    document.getElementById('btnFormPrev').style.visibility = currentFormCtx.currentPageIdx === 0 ? 'hidden' : 'visible';
    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;
    const isSubmit = isLastPage || (currentFormCtx.selectedAction && currentFormCtx.selectedAction.type === 'submit');
    
    const btnNext = document.getElementById('btnFormNext');
    btnNext.innerText = isSubmit ? (state.currentLang==='ZH'?'提交':'Submit') : (state.currentLang==='ZH'?'下一頁':'Next');
    btnNext.disabled = state.isSubmitting;
  }

  function onOutlineChange(fieldId, val) {
    const sel = event.target;
    const selectedOption = sel.options[sel.selectedIndex];
    const outlineIdx = selectedOption.getAttribute('data-idx') || 0;
    
    const outlineCode = String.fromCharCode(65 + parseInt(outlineIdx));
    currentFormCtx.data['outline_select_val'] = val;
    currentFormCtx.data['outline_code'] = outlineCode;
    saveFormFieldData(fieldId, val);
    
    renderFormCurrentPage();
  }

  function selectOptionRadio(fieldId, optName, action, statusTag, purposeIdx) {
    saveFormFieldData(fieldId, optName);
    currentFormCtx.selectedAction = action;
    if (statusTag) currentFormCtx.selectedStatusTag = statusTag;
    
    currentFormCtx.data['purpose_code'] = String(purposeIdx).padStart(2, '0');
    currentFormCtx.data['selected_purpose_name'] = optName;
    
    renderFormCurrentPage();
  }

  function toggleOptionCheckbox(fieldId) {
    const currentVal = !currentFormCtx.data[fieldId];
    saveFormFieldData(fieldId, currentVal);
    renderFormCurrentPage();
  }

  function toggleCheckboxGroupOption(fieldId, optName) {
    if (!currentFormCtx.data[fieldId]) currentFormCtx.data[fieldId] = [];
    const idx = currentFormCtx.data[fieldId].indexOf(optName);
    if (idx > -1) {
      currentFormCtx.data[fieldId].splice(idx, 1);
    } else {
      currentFormCtx.data[fieldId].push(optName);
    }
    state.formDataCache[currentFormCtx.formId] = currentFormCtx.data;
    renderFormCurrentPage();
  }

  function saveFormFieldData(fieldId, val) {
    currentFormCtx.data[fieldId] = val;
    state.formDataCache[currentFormCtx.formId] = currentFormCtx.data;
  }

  function prevFormPage() {
    if(currentFormCtx.currentPageIdx > 0) {
      currentFormCtx.currentPageIdx--;
      renderFormSidebar();
      renderFormCurrentPage();
    }
  }

  function nextFormPage() {
    if (state.isSubmitting) return;

    if (currentFormCtx.selectedAction) {
      if (currentFormCtx.selectedAction.type === 'submit') {
        submitFormFinal();
        return;
      }
      else if (currentFormCtx.selectedAction.type === 'goto') {
        const targetPageTitle = currentFormCtx.selectedAction.target;
        const targetIdx = currentFormCtx.pages.findIndex(p => p.title.toLowerCase().includes(targetPageTitle.toLowerCase()));
        if (targetIdx !== -1) {
          currentFormCtx.currentPageIdx = targetIdx;
          renderFormSidebar();
          renderFormCurrentPage();
          return;
        }
      }
    }

    const isLastPage = currentFormCtx.currentPageIdx === currentFormCtx.pages.length - 1;
    if (isLastPage) {
      submitFormFinal();
    } else {
      currentFormCtx.currentPageIdx++;
      renderFormSidebar();
      renderFormCurrentPage();
    }
  }

  function jumpToFormPage(idx) {
    currentFormCtx.currentPageIdx = idx;
    renderFormSidebar();
    renderFormCurrentPage();
  }

  function closeFormPage() {
    document.getElementById('formPageContainer').style.display = 'none';
    if(state.currentUser) {
      document.getElementById('fabBtn').style.display = 'flex';
    }
  }

  function generateExperimentId(dateStr) {
    const outlineCode = currentFormCtx.data['outline_code'] || 'A';
    const purposeCode = currentFormCtx.data['purpose_code'] || '01';
    const cleanDate = dateStr.replace(/-/g, '');
    const yyMMdd = cleanDate.length === 8 ? cleanDate.slice(2) : '260726';
    
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let checksum = '';
    for (let i = 0; i < 3; i++) {
      checksum += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    return `${outlineCode}${purposeCode}${yyMMdd}${checksum}`;
  }

  // 1. 修正提交邏輯：精準傳遞原始 formId (如 FORM_001_1)，並在前端就正規化為主欄位名稱 "FORM_001"
async function submitFormFinal() {
  if (state.isSubmitting) return;

  state.isSubmitting = true;
  const btnNext = document.getElementById('btnFormNext');
  btnNext.disabled = true;
  btnNext.innerText = state.currentLang === 'ZH' ? "上傳中..." : "Submitting...";

  let targetStatus = "已預約";
  if (currentFormCtx.formId !== "FORM_001_2") {
    targetStatus = currentFormCtx.selectedStatusTag || "已完成";
  }

  let submitDate = state.simulatedDate;
  Object.keys(currentFormCtx.data).forEach(k => {
    const v = currentFormCtx.data[k];
    if (typeof v === 'string' && v.match(/^\d{4}-\d{2}-\d{2}$/)) {
      submitDate = v;
    }
  });

  let selectedExpSelectVal = currentFormCtx.data['exp_select_val'] || "";
  let finalExpId = "";
  let isUpdateMode = false;

  if (selectedExpSelectVal && selectedExpSelectVal !== 'NEW_PROJECT' && selectedExpSelectVal.match(/^[A-Z]\d{8,12}/)) {
    finalExpId = selectedExpSelectVal;
    isUpdateMode = true;
  } else {
    finalExpId = generateExperimentId(submitDate);
    isUpdateMode = false;
  }

  // 取得基礎表單代碼 (FORM_001_1 / FORM_001_2 一律對應到 FORM_001)
  const rawFormId = currentFormCtx.formId; 
  const mainFormColName = rawFormId.startsWith("FORM_001") ? "FORM_001" : rawFormId.split('_').slice(0, 2).join('_');

  const jsonPayloadString = JSON.stringify(currentFormCtx.data);

  await syncToGoogleSheet("submitForm", {
    expId: finalExpId,
    date: submitDate,
    user: currentFormCtx.data['user_select_val'] || (state.currentUser ? state.currentUser.name : "Daniel"),
    status: targetStatus,
    formColumnName: mainFormColName, // 👈 明確指定目標 Header 欄位名稱 (如 "FORM_001")
    formJson: jsonPayloadString,
    isUpdate: isUpdateMode,
    formData: currentFormCtx.data
  });

  state.isSubmitting = false;
  closeFormPage();
  await refreshDashboard(true);
  
  const msg = isUpdateMode 
    ? `實驗編號 [${finalExpId}] 紀錄已更新！\n狀態：[${targetStatus}]` 
    : `新實驗專案建立成功！\n實驗編號：[${finalExpId}]\n狀態：[${targetStatus}]`;

  showCustomAlert("提交成功", msg);
}

// 2. 修正試算表資料讀取解析 (對應 correct 列：E=FORM_001, G=FORM_002, I=FORM_003, K=FORM_004, M=FORM_005)
async function fetchDataCenterFromSheet() {
  try {
    const res = await fetch(URL_DATA);
    const csvText = await res.text();
    const rows = parseCSV(csvText);
    
    const records = [];
    for(let i = 1; i < rows.length; i++) {
      if(rows[i][0] || rows[i][1]) {
        const expId = rows[i][0] ? rows[i][0].trim() : '未編號';
        const date = rows[i][1] ? rows[i][1].trim() : '';
        const user = rows[i][2] ? rows[i][2].trim() : '';
        const status = rows[i][3] ? rows[i][3].trim() : '';
        
        let parsedFormData = {};
        // E欄(index 4)為 FORM_001，G欄(6)為 FORM_002，I欄(8)為 FORM_003...
        const jsonColumns = [4, 6, 8, 10, 12]; 
        jsonColumns.forEach(colIdx => {
          const rawJsonStr = rows[i][colIdx] ? rows[i][colIdx].trim() : '';
          if (rawJsonStr && rawJsonStr.startsWith('{')) {
            try {
              const jsonObj = JSON.parse(rawJsonStr);
              parsedFormData = { ...parsedFormData, ...jsonObj };
            } catch(e) {}
          }
        });

        const outlineName = parsedFormData['outline_select_val'] || '';
        const purposeName = parsedFormData['selected_purpose_name'] || '';
        let dynamicInfo = (outlineName || purposeName) ? `${outlineName}${purposeName ? ' - ' + purposeName : ''}`.trim() : "實驗專案";

        const colV = rows[i][21] ? rows[i][21].trim() : '';
        records.push({
          expId: expId,
          date: date,
          user: user,
          status: status,
          info: dynamicInfo,
          formData: parsedFormData,
          hasDataUpload: colV !== '' && colV !== '0' && colV !== '-'
        });
      }
    }
    state.dataCenter = records;
  } catch(err) {
    console.error("同步資料中心失敗:", err);
  }
}

  function showCustomAlert(title, message) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalBtnGroup').innerHTML = `<button class="modal-btn modal-btn-confirm" onclick="closeCustomModal()">確定</button>`;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  function showCustomConfirm(title, message, cancelText, confirmText, callback) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalBtnGroup').innerHTML = `
      <button class="modal-btn modal-btn-cancel" onclick="handleConfirmChoice(false)">${cancelText}</button>
      <button class="modal-btn modal-btn-confirm" onclick="handleConfirmChoice(true)">${confirmText}</button>
    `;
    window.confirmCallback = callback;
    document.getElementById('customModalBackdrop').style.display = 'flex';
  }

  function handleConfirmChoice(choice) {
    document.getElementById('customModalBackdrop').style.display = 'none';
    if(window.confirmCallback) window.confirmCallback(choice);
  }

  function closeCustomModal() { document.getElementById('customModalBackdrop').style.display = 'none'; }

  function toggleFabMenu() {
    const overlay = document.getElementById('fabMenuOverlay');
    const btn = document.getElementById('fabBtn');
    const isOpening = overlay.style.display !== 'flex';
    
    overlay.style.display = isOpening ? 'flex' : 'none';
    btn.classList.toggle('active', isOpening);
  }

  function closeFabMenu() {
    document.getElementById('fabMenuOverlay').style.display = 'none';
    document.getElementById('fabBtn').classList.remove('active');
  }

  function openScheduleCenter() { closeFabMenu(); showCustomAlert("排程中心", "開啟排程中心面板。"); }
  function openRecordCenter() { closeFabMenu(); showCustomAlert("紀錄中心", "開啟實驗紀錄中心面板。"); }
  function openEditProfile() {
    closeFabMenu();
    if(state.currentUser) {
      showCustomAlert("個人資訊", `會員姓名 : ${state.currentUser.name}\nEmail : ${state.currentUser.email}\n身份 : ${state.currentUser.role}`);
    }
  }
</script>
</body>
</html>
